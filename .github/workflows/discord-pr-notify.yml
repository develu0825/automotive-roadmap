# PR이 열리거나 머지/닫힘/업데이트될 때 Discord 채널로 알림을 보냅니다.
# 사용한 액션(가장 평가 좋은 Discord 알림 액션): https://github.com/sarisia/actions-status-discord
#
# ── 설정 (최초 1회) ───────────────────────────────────────────────
# 1) Discord: 서버 설정 → 연동(Integrations) → 웹후크 → 새 웹후크 →
#    채널 선택(예: #github) → "웹후크 URL 복사"
# 2) GitHub: 이 레포 → Settings → Secrets and variables → Actions →
#    New repository secret → 이름 DISCORD_WEBHOOK, 값에 복사한 URL 붙여넣기
#    (CLI로도 가능: gh secret set DISCORD_WEBHOOK)
# 끝! 시크릿이 없으면 이 워크플로는 아무 것도 보내지 않고 조용히 통과합니다.
# ──────────────────────────────────────────────────────────────────

name: Discord PR Notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      # PR 상태에 따라 제목/색을 정합니다 (제목은 PR 본문을 셸에 넣지 않아 인젝션 안전).
      - name: Build message
        id: msg
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "$MERGED" = "true" ]; then
            title="🟢 PR 머지됨"; color="0x57F287"
          elif [ "$ACTION" = "closed" ]; then
            title="🔴 PR 닫힘 (머지 안 됨)"; color="0xED4245"
          elif [ "$ACTION" = "opened" ] || [ "$ACTION" = "reopened" ] || [ "$ACTION" = "ready_for_review" ]; then
            title="🔵 새 PR"; color="0x5865F2"
          else
            title="🟡 PR 업데이트"; color="0xFEE75C"
          fi
          {
            echo "title=$title"
            echo "color=$color"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          noprefix: true
          nodetail: true
          username: GitHub PR Bot
          title: "${{ steps.msg.outputs.title }} · #${{ github.event.pull_request.number }}"
          color: "${{ steps.msg.outputs.color }}"
          description: |
            **${{ github.event.pull_request.title }}**
            `${{ github.event.pull_request.user.login }}`  ·  `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`
            [PR 보기](${{ github.event.pull_request.html_url }})
