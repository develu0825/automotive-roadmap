<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="DDS 요청/오퍼 QoS 호환성: 매칭 성립과 거부">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">요청/오퍼 QoS 호환성 모델</text>

  <rect x="40" y="60" width="200" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="83" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">발행자 제공: RELIABLE</text>
  <text x="140" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(offered)</text>

  <rect x="480" y="60" width="200" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="580" y="83" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">구독자 요구: BEST_EFFORT</text>
  <text x="580" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(requested)</text>

  <line x1="240" y1="87" x2="480" y2="87" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="80" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">매칭 성립 (제공 ≥ 요구)</text>

  <rect x="40" y="180" width="200" height="54" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="140" y="203" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">발행자 제공: BEST_EFFORT</text>
  <text x="140" y="223" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(offered)</text>

  <rect x="480" y="180" width="200" height="54" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="580" y="203" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">구독자 요구: RELIABLE</text>
  <text x="580" y="223" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(requested)</text>

  <line x1="240" y1="207" x2="480" y2="207" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="200" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="middle">매칭 거부 (제공 &lt; 요구)</text>
</svg>
