<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="DDS 발행/구독 모델: 토픽을 매개로 한 발행자와 구독자">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">발행/구독: 토픽을 매개로 한 연결</text>

  <rect x="40" y="60" width="170" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="125" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">발행자 (Publisher)</text>

  <rect x="275" y="140" width="170" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="162" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">토픽</text>
  <text x="360" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ObstacleInfo</text>

  <rect x="510" y="60" width="170" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="595" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">구독자 A</text>

  <rect x="510" y="230" width="170" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="595" y="262" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">구독자 B</text>

  <line x1="200" y1="100" x2="280" y2="155" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">write</text>

  <line x1="445" y1="155" x2="515" y2="100" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">read</text>

  <line x1="445" y1="180" x2="515" y2="245" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="222" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">read</text>

  <text x="360" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">발행자와 구독자는 서로의 존재를 몰라도 토픽으로 연결된다</text>
</svg>
