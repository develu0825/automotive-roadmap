- topic: pub-sub-model
  title: "발행/구독 모델과 토픽"
  section: 정리
  variants:
    - question: "발행/구독 패턴에서 발행자와 구독자의 관계로 가장 적절한 것은?"
      choices: ["발행자는 구독자 수와 위치를 미리 알고 각각에게 개별적으로 연결을 요청해야 통신이 성립한다", "발행자와 구독자는 서로의 존재를 몰라도 토픽을 매개로 데이터를 주고받을 수 있다", "구독자가 먼저 Offer Service를 보내야 발행자가 응답한다", "발행자 하나당 구독자는 반드시 하나여야 한다"]
      answer: 1
      explanation: "발행/구독 모델에서는 발행자와 구독자가 서로의 존재를 알 필요 없이 토픽을 매개로만 데이터가 흘러간다."
    - question: "DDS에서 토픽 안의 서로 다른 개체를 구분하기 위해 필드에 @key를 지정하는 목적은 무엇인가?"
      choices: ["같은 토픽 안에서 여러 인스턴스를 object_id 같은 값으로 구분해 각각 추적할 수 있게 한다", "해당 필드의 값에 따라 QoS의 Reliability를 자동으로 BEST_EFFORT와 RELIABLE 사이에서 전환시킨다", "토픽 이름 자체를 암호학적 서명과 연결한다", "발행자의 IP 주소를 대신 저장하는 용도로 쓰인다"]
      answer: 0
      explanation: "키로 지정된 필드는 같은 토픽 안에서 서로 다른 인스턴스를 구분하는 식별자 역할을 해, 여러 개체의 데이터를 하나의 토픽으로 자연스럽게 표현할 수 있게 한다."

- topic: dds-discovery
  title: "DDS의 동적 디스커버리"
  section: 정리
  variants:
    - question: "DDS 참여자들이 중앙 서버 없이 서로를 찾는 과정을 두 단계로 나눌 때 SPDP와 SEDP의 역할로 옳은 것은?"
      choices: ["SPDP는 참여자의 존재를 알아내고 SEDP는 각 참여자가 발행·구독하는 토픽 정보를 교환한다", "SPDP는 QoS 호환성과 암호화 키를 모두 검사하고 SEDP는 발행자와 구독자의 물리적 위치만 교환한다", "SEDP가 먼저 실행되고 SPDP가 그 뒤를 잇는다", "둘 다 발행자에서만 실행된다"]
      answer: 0
      explanation: "SPDP는 네트워크의 참여자 존재를 먼저 알아내는 단계이고, SEDP는 그 참여자들이 어떤 토픽에 대해 발행자 또는 구독자인지를 교환하는 단계이다."
    - question: "새로운 센서 퓨전 모듈을 DDS 기반 시스템에 추가할 때 기존 모듈의 코드를 바꾸지 않아도 되는 이유로 가장 적절한 것은?"
      choices: ["새 모듈이 올바른 토픽을 구독하거나 발행하면 동적 디스커버리로 자동으로 네트워크에 합류하기 때문이다", "모든 모듈이 하나의 중앙 서버에 등록되어 있어 서버 설정만 바꾸면 전체 네트워크가 재구성되기 때문이다", "DDS는 참여자 수가 고정되어 새 모듈은 인식되지 않기 때문이다", "새 모듈은 기존 모듈을 서버로 지정해 수동 연결해야 한다"]
      answer: 0
      explanation: "DDS 참여자는 멀티캐스트로 자신의 토픽 정보를 알리고 수집하는 동적 디스커버리를 거치므로, 새 모듈은 기존 코드를 바꾸지 않아도 자동으로 네트워크에 합류한다."

- topic: dds-qos
  title: "DDS QoS 정책과 호환성"
  section: 정리
  variants:
    - question: "빠르게 갱신되는 레이더 거리 값처럼 구독자가 항상 가장 최근 값만 필요로 하는 토픽에 적합한 History QoS 설정은 무엇인가?"
      choices: ["KEEP_ALL로 설정해 리소스가 허용하는 한 모든 과거 값을 영구히 보관해 두는 것이 적합하다", "KEEP_LAST(depth=1)로 설정해 가장 최근 값만 유지하는 것이 적합하다", "Reliability를 RELIABLE로 바꾼다", "Durability를 TRANSIENT_LOCAL로 바꾼다"]
      answer: 1
      explanation: "구독자가 항상 최신 값만 필요로 한다면 KEEP_LAST(depth=1)로 설정해 메모리와 전송 오버헤드를 최소화하면서 최신 값만 유지하는 것이 적합하다."
    - question: "구독자가 Reliability를 RELIABLE로 요구했는데 발행자가 BEST_EFFORT로만 제공할 때 DDS의 요청/오퍼 호환성 모델에 따라 일어나는 일로 옳은 것은?"
      choices: ["제공 품질이 요구 품질보다 낮으므로 두 엔드포인트는 매칭되지 않는다", "발행자의 품질 설정이 구독자의 요구 수준에 맞추어 런타임에 자동으로 RELIABLE로 격상되면서 매칭이 성립한다", "구독자의 요구가 자동으로 BEST_EFFORT로 낮아진다", "Durability 설정에 따라서만 매칭 여부가 결정된다"]
      answer: 0
      explanation: "요청/오퍼 호환성 모델에서는 발행자가 제공하는 품질이 구독자가 요구하는 품질과 같거나 더 높아야 매칭되므로, BEST_EFFORT만 제공하면 RELIABLE 요구와 매칭되지 않는다."
