<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="단계적 배포(Phased Rollout)와 이상 발생 시 중단·롤백">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">단계적 배포 (Phased Rollout)</text>

  <rect x="20" y="60" width="140" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="90" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">내부/1%</text>

  <rect x="200" y="60" width="140" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="270" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">10% 배포</text>

  <rect x="380" y="60" width="140" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="450" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">50% 배포</text>

  <rect x="560" y="60" width="140" height="54" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="630" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">100% 배포</text>

  <line x1="160" y1="87" x2="200" y2="87" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="87" x2="380" y2="87" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="87" x2="560" y2="87" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <line x1="90" y1="114" x2="90" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="190" width="280" height="54" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="213" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">오류 급증 감지</text>
  <text x="160" y="233" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">→ 배포 중단 및 롤백</text>
</svg>
