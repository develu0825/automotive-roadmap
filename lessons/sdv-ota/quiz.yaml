- topic: sdv-architecture
  title: "SDV와 E/E 아키텍처 전환"
  section: 정리
  variants:
    - question: "SDV(소프트웨어 정의 차량)가 전통적인 차량 아키텍처와 근본적으로 다른 점으로 가장 적절한 것은?"
      choices: ["차량의 가치와 기능 차별화가 하드웨어보다 소프트웨어에서 나온다는 점이다", "ECU 개수를 70개에서 100개 사이로 더 늘려 기능마다 독립된 하드웨어를 추가로 배치한다는 점이다", "모든 소프트웨어를 출고 이후에는 절대 바꿀 수 없다는 점이다", "진단 통신을 아예 사용하지 않는다는 점이다"]
      answer: 0
      explanation: "SDV는 하드웨어는 범용화해 고정하고, 소프트웨어 업데이트로 차량의 성격과 기능을 계속 바꿔나가는 철학을 뜻한다."
    - question: "자동차 산업에서 기능별 분산 ECU 구조에서 집중형·영역형(zonal) E/E 아키텍처로 전환하는 이유로 옳은 것은?"
      choices: ["하드웨어를 범용화해 같은 하드웨어 위에서 소프트웨어 업데이트로 기능을 계속 바꿀 수 있게 하기 위해서이다", "ECU 수를 지금보다 훨씬 더 늘리고 배선을 더 복잡하게 만들어서 기능별 독립성을 강화하고 정비소의 진단기를 차종마다 다르게 만들기 위해서이다", "진단 통신(UDS)을 완전히 대체하기 위해서이다", "정비소의 진단기를 차종마다 다르게 만들기 위해서이다"]
      answer: 0
      explanation: "고성능 컴퓨터나 영역 제어기로 기능을 통합하면 하드웨어가 범용화되어, 같은 하드웨어 위에서 소프트웨어 업데이트만으로 기능을 개선하거나 추가할 수 있게 된다."

- topic: ota-process
  title: "OTA 업데이트 과정과 A/B 파티션"
  section: 정리
  variants:
    - question: "덮어쓰기(in-place update) 방식과 비교해 A/B 파티션 방식이 안전한 롤백에 유리한 이유로 가장 적절한 것은?"
      choices: ["새 버전이 현재 운영 중인 영역이 아닌 별도 영역에 설치되어 설치 실패가 현재 영역을 손상시키지 않는다", "A/B 파티션은 서명 검증과 세션 제어, 보안 접근 절차를 모두 생략할 수 있게 해 설치 속도를 크게 높이고 비용을 줄여주는 효과가 있다", "덮어쓰기보다 항상 전송 데이터량이 두 배로 늘어난다", "A 영역과 B 영역이 항상 동시에 같은 내용으로 갱신된다"]
      answer: 0
      explanation: "A/B 파티션은 새 버전을 현재 운영 중이지 않은 영역에 설치하므로, 설치 중 문제가 생겨도 현재 운영 중인 영역은 손상되지 않아 먹통 상태를 구조적으로 막는다."
    - question: "OTA 업데이트 과정에서 패키징 단계에서 전체 이미지 대신 변경된 부분만 델타로 전송하는 목적은 무엇인가?"
      choices: ["전송량을 줄여 통신 대역폭과 시간을 절약하기 위해서이다", "서명 검증과 롤백 메커니즘을 모두 생략할 수 있도록 패키지 구조 자체를 단순화하기 위해서이다", "차량이 주행 중에도 반드시 설치를 완료하도록 강제하기 위해서이다", "롤백 메커니즘을 완전히 제거하기 위해서이다"]
      answer: 0
      explanation: "전체 이미지가 아니라 변경된 부분만 압축해 보내는 델타 패키징은 전송량을 크게 줄여 통신 대역폭과 다운로드 시간을 절약한다."

- topic: ota-safety-security
  title: "단계적 배포·섀도우 모드와 안전·보안"
  section: 정리
  variants:
    - question: "새로운 ACC 소프트웨어를 전체 차량에 한 번에 배포하지 않고 소수의 차량에 먼저 배포한 뒤 점차 넓혀가는 전략의 목적으로 가장 적절한 것은?"
      choices: ["초기 단계에서 문제를 발견하면 영향받는 차량 수를 최소화하고 배포를 중단할 수 있기 때문이다", "배포 비용을 줄이기 위해 가장 비싼 차량에만 먼저 배포하고 나머지 차량에는 서명 검증과 롤백 절차 없이 배포하기 때문이다", "서명 검증 절차를 소수 차량에서만 수행해도 되기 때문이다", "A/B 파티션 구조를 사용하지 않아도 되게 만들기 때문이다"]
      answer: 0
      explanation: "단계적 배포는 소수의 차량에서 먼저 실제 운행 데이터로 문제를 확인해, 초기 단계에서 오류가 발견되면 영향받는 차량 수를 최소화하고 배포를 멈출 수 있게 한다."
    - question: "OTA 시스템에서 서명 검증이 보장해야 하는 바로 가장 적절한 것은?"
      choices: ["인증된 소프트웨어만 설치되도록 해 악성 업데이트가 차량에 들어오는 것을 막는다", "차량이 주행 중에도 항상 업데이트를 즉시 설치하도록 강제하고 델타 패키징 없이 전체 이미지를 매번 전송하도록 만든다", "업데이트 이력 관리를 완전히 생략해도 되게 만든다", "델타 패키징 없이 항상 전체 이미지를 전송하도록 강제한다"]
      answer: 0
      explanation: "서명 검증은 다운로드한 패키지가 변조되지 않고 인증된 제조사가 만든 것임을 확인해, 해킹된 악성 업데이트가 차량에 설치되는 것을 막는다."
