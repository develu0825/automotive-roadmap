- topic: virtualization-isolation
  title: "가상화와 VM 격리"
  section: 정리
  variants:
    - question: "가상화에서 VM 간 격리가 커널 단위로 이뤄지는 이유로 가장 적절한 것은?"
      choices: ["모든 VM이 하나의 공유 메모리 공간과 동일한 스케줄러를 그대로 사용하도록 하이퍼바이저가 강제하기 때문이다", "각 VM이 독립된 게스트 OS 커널을 가져 한쪽 커널 결함이 다른 VM에 번지지 않기 때문이다", "하이퍼바이저가 VM마다 다른 색의 가상 디스크를 할당하기 때문이다", "VM 번호가 서로 다르기 때문이다"]
      answer: 1
      explanation: "각 VM은 자신만의 게스트 OS 커널을 통째로 가지므로 한 VM의 커널 결함이 그 VM 안에서 끝난다."
    - question: "Type-1과 Type-2 하이퍼바이저의 차이에 대한 설명으로 옳은 것은?"
      choices: ["Type-2는 하드웨어 바로 위에서 직접 동작해 결정론성이 뛰어나다", "Type-1은 신뢰 기반이 작고 결정론적 타이밍을 제공한다", "Type-1은 반드시 리눅스 같은 범용 호스트 OS와 그 위의 수많은 응용 프로그램을 모두 거쳐야만 동작할 수 있다", "Type-2는 신뢰 기반이 작다"]
      answer: 1
      explanation: "Type-1은 bare-metal 구조로 신뢰 기반이 작고 결정론적 타이밍을 제공해 자동차 제어 영역에서 선호된다."
- topic: mixed-criticality
  title: "혼합 중요도와 간섭으로부터의 자유"
  section: 정리
  variants:
    - question: "ISO 26262 관점에서 QM 소프트웨어와 ASIL 소프트웨어를 하나의 OS 위에 격리 없이 함께 올렸을 때 발생하는 문제로 가장 적절한 것은?"
      choices: ["안드로이드 쪽 메모리 사용량이 하이퍼바이저 설정과 무관하게 항상 일정한 비율로 고정되어 버린다", "낮은 등급 결함이 공간적·시간적으로 간섭해 전체를 ASIL 수준으로 재검증해야 한다", "인포테인먼트 화면 밝기가 낮아진다", "ECU 개수가 늘어나 배선 비용이 증가한다"]
      answer: 1
      explanation: "낮은 등급의 결함이 높은 등급에 공간적·시간적으로 영향을 줄 수 있다면 전체를 가장 높은 등급으로 재검증해야 한다."
    - question: "하이퍼바이저가 보장해야 하는 간섭으로부터의 자유를 구성하는 두 가지 분리로 옳은 것은?"
      choices: ["소프트웨어 모듈 분리와 하드웨어 칩 분리라는 두 가지 개념", "공간적 분리와 시간적 분리", "전기 분리", "네트워크와 전원"]
      answer: 1
      explanation: "하이퍼바이저는 메모리·장치 침범을 막는 공간적 분리와 CPU·버스 점유를 막는 시간적 분리를 함께 보장해야 한다."
- topic: isolation-scheduling
  title: "격리 메커니즘과 시간 분할 스케줄링"
  section: 정리
  variants:
    - question: "하이퍼바이저가 메모리 파티셔닝을 강제하기 위해 활용하는 핵심 하드웨어로 가장 적절한 것은?"
      choices: ["MMU와 IOMMU", "GPU 셰이더 코어", "CAN 트랜시버와 LIN 마스터 컨트롤러", "HDMI 포트"]
      answer: 0
      explanation: "MMU는 CPU의 메모리 접근을, IOMMU는 장치의 DMA 접근을 각 VM에 허락된 범위로 제한한다."
    - question: "하이퍼바이저가 안전 영역 VM에게 1ms 주기마다 0.3ms를 정적으로 보장하는 시간 분할 스케줄링 방식이 데스크톱 OS의 공평 스케줄링보다 적합한 이유는 무엇인가?"
      choices: ["안드로이드 쪽 소프트웨어 용량이 줄어들기 때문이다", "설계 시점에 확정된 보장 시간이라 최악의 경우 데드라인 준수를 예측할 수 있기 때문이다", "모든 VM이 상황이나 부하와 무관하게 언제나 정확히 동일한 비율로 CPU 시간을 나눠 쓰도록 강제하는 방식이기 때문이다", "제어 영역의 코드 줄 수가 줄어들기 때문이다"]
      answer: 1
      explanation: "정적으로 확정된 시간 예산은 상황에 따라 변하지 않으므로 최악의 경우 데드라인 준수를 수학적으로 논증할 수 있다."
