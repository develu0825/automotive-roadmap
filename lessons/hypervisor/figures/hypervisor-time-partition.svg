<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="하이퍼바이저의 정적 시간 분할 스케줄링 1밀리초 주기">
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">정적 시간 분할 스케줄링 (하이퍼바이저)</text>

  <rect x="60" y="90" width="180" height="60" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="150" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">제어 VM</text>
  <text x="150" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0.3 ms (보장)</text>

  <rect x="240" y="90" width="420" height="60" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="450" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">안드로이드 VM</text>
  <text x="450" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0.7 ms (유연, 남는 시간 활용)</text>

  <line x1="60" y1="150" x2="60" y2="165" stroke="#8aa0c6" stroke-width="1.5"/>
  <line x1="240" y1="150" x2="240" y2="165" stroke="#8aa0c6" stroke-width="1.5"/>
  <line x1="660" y1="150" x2="660" y2="165" stroke="#8aa0c6" stroke-width="1.5"/>

  <text x="60" y="183" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0</text>
  <text x="240" y="183" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0.3 ms</text>
  <text x="660" y="183" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">1 ms</text>

  <text x="360" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">매 1 ms 마다 반복</text>
</svg>
