- topic: microkernel-fault-isolation
  title: "마이크로커널과 장애 격리"
  section: 정리
  variants:
    - question: "QNX Neutrino 마이크로커널과 리눅스 같은 모놀리식 커널의 가장 핵심적인 차이는 무엇인가?"
      choices: ["지원 언어가 다르다는 점이다", "드라이버와 파일시스템이 사용자 공간의 독립 프로세스로 분리되어 있는가 여부이다", "커널이 처리할 수 있는 최대 CPU 코어 수와 지원 가능한 메모리 용량이 근본적으로 다르다는 점이다", "화면 해상도를 지원하는 방식이 다르다는 점이다"]
      answer: 1
      explanation: "모놀리식 커널은 드라이버까지 커널 공간에 두지만 마이크로커널은 이를 사용자 공간의 독립 프로세스로 분리한다."
    - question: "네트워크 드라이버 프로세스에 심각한 버그가 생겨 비정상 종료되었을 때, QNX 같은 마이크로커널에서 계기판 디스플레이가 정상 유지될 수 있는 이유로 가장 적절한 것은?"
      choices: ["드라이버가 사용자 공간의 독립 프로세스라서 커널과 다른 프로세스는 영향을 받지 않기 때문이다", "계기판 디스플레이가 네트워크 드라이버와 물리적으로 완전히 다른 전용 칩과 전용 전원 회로에서 독립적으로 동작하기 때문이다", "드라이버 버그는 애초에 발생하지 않도록 설계되었기 때문이다", "화면이 꺼져도 금방 다시 켜지기 때문이다"]
      answer: 0
      explanation: "드라이버와 다른 프로세스가 메모리로 격리되어 있어 한 프로세스의 비정상 종료가 다른 프로세스로 번지지 않는다."
- topic: message-passing-ipc
  title: "메시지 패싱 IPC와 예측 가능한 지연시간"
  section: 정리
  variants:
    - question: "QNX의 동기식 메시지 패싱 IPC가 예측 가능한 지연시간을 제공하는 이유로 가장 적절한 것은?"
      choices: ["메시지 크기가 항상 1바이트로 고정되어 있기 때문이다", "누가 누구를 기다리는지와 우선순위 전달 방식이 명확히 정의되어 최악의 지연을 분석하기 쉽기 때문이다", "클라이언트가 서버의 응답을 전혀 기다리지 않고 메시지를 보낸 즉시 바로 다음 작업으로 넘어가 버리기 때문이다", "네트워크 드라이버가 커널 공간에서 실행되기 때문이다"]
      answer: 1
      explanation: "동기식 메시지 패싱은 대기 관계와 우선순위 전달이 명확해 최악의 경우 지연시간을 분석하고 보장하기 쉽다."
    - question: "QNX의 채널(channel)과 커넥션(connection) 구조에 대한 설명으로 옳은 것은?"
      choices: ["서버가 채널을 만들어 메시지를 기다리고, 클라이언트는 그 채널에 커넥션을 열어 메시지를 보낸다", "커넥션은 서버가 클라이언트를 감시하기 위해 만드는 전용 로그 파일이다", "채널은 메시지의 우선순위나 도착 순서와는 전혀 무관하게 완전히 무작위로 메시지를 처리하는 임시 저장소일 뿐이다", "클라이언트가 채널을 만든다"]
      answer: 0
      explanation: "서버는 채널을 만들어 수신 대기하고, 클라이언트는 그 채널에 커넥션을 열어 메시지를 보내고 응답을 기다린다."
- topic: safety-certification
  title: "사전 인증 RTOS와 POSIX 기반 통합"
  section: 정리
  variants:
    - question: "완성차 업체가 범용 리눅스 대신 QNX OS for Safety 같은 사전 인증된 RTOS를 선택하는 핵심적인 실무 이유로 가장 적절한 것은?"
      choices: ["리눅스보다 다운로드 용량이 작기 때문이다", "OS 벤더가 제공하는 인증 산출물로 전체 인증 부담이 줄어들기 때문이다", "QNX가 리눅스보다 항상 더 많은 디바이스 드라이버를 기본으로 제공하기 때문이다", "QNX가 무료 라이선스로 제공되기 때문이다"]
      answer: 1
      explanation: "사전 인증된 RTOS는 OS 계층의 인증 산출물을 제공해 업체가 직접 증명해야 할 범위를 크게 줄여 준다."
    - question: "QNX의 POSIX 준수가 AUTOSAR Adaptive Platform과 맺는 관계로 옳은 것은?"
      choices: ["Adaptive Platform이 POSIX 기반으로 정의되어 있어 QNX가 그 바닥이 되기에 이상적이다", "AUTOSAR Adaptive Platform은 POSIX를 전혀 사용하지 않는다", "QNX는 POSIX를 전혀 지원하지 않기 때문에 AUTOSAR Adaptive Platform과는 애초에 호환될 수 없는 구조이다", "POSIX는 안드로이드 전용 인터페이스라서 QNX와 무관하다"]
      answer: 0
      explanation: "Adaptive Platform은 POSIX 기반으로 규정되어 있어 POSIX를 지원하는 QNX가 그 기반 OS로 자연스럽게 쓰인다."
