<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="QNX 동기식 메시지 패싱의 채널과 커넥션">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>

  <text x="360" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">QNX 동기식 메시지 패싱 (채널 · 커넥션)</text>

  <rect x="80" y="60" width="160" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="160" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">클라이언트</text>

  <rect x="480" y="60" width="160" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="560" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">서버 (채널)</text>

  <line x1="160" y1="110" x2="160" y2="230" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="560" y1="110" x2="560" y2="230" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="5,5"/>

  <text x="360" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">MsgSend() — 클라이언트 블록</text>
  <line x1="160" y1="150" x2="560" y2="150" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="156" y="150" width="8" height="60" fill="#b794f6" stroke="none"/>
  <text x="148" y="180" fill="#b794f6" font-family="sans-serif" font-size="15" text-anchor="end">블록 대기</text>

  <text x="580" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">처리 중</text>

  <text x="360" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">MsgReply() — 블록 해제</text>
  <line x1="560" y1="210" x2="160" y2="210" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
</svg>
