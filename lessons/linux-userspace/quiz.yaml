- topic: process-thread
  title: "프로세스와 스레드"
  section: 정리
  variants:
    - question: "fork()로 생성된 자식 프로세스가 exec()를 호출했을 때 일어나는 일로 옳은 것은 무엇인가?"
      choices: ["exec() 호출은 항상 실패해서 무시된다", "자식 프로세스의 메모리 내용이 exec()가 지정한 다른 실행 파일로 완전히 교체된다", "부모와 자식 프로세스의 PID가 exec() 호출 이후 서로 같은 값으로 합쳐진다", "부모와 자식 프로세스는 exec() 호출이 끝난 뒤에도 여전히 같은 메모리 공간과 파일 디스크립터 테이블을 함께 공유한 채로 동작을 계속한다"]
      answer: 1
      explanation: "fork()는 프로세스를 복제하고, 자식 쪽에서 exec()를 호출하면 그 프로세스의 메모리가 완전히 다른 실행 파일로 바뀐다."
    - question: "두 스레드가 같은 카운터 변수를 동기화 없이 동시에 증가시킬 때 생길 수 있는 문제로 가장 적절한 것은 무엇인가?"
      choices: ["프로세스가 즉시 종료되어 카운터가 0으로 초기화된다", "두 스레드가 같은 옛 값을 읽어 증가시켜서 카운터가 한 번만 증가하는 race condition이 생길 수 있다", "mutex 없이도 두 스레드는 항상 번갈아 실행되어 문제가 전혀 생기지 않는다", "커널 스케줄러가 두 스레드의 증가 연산 순서를 자동으로 완전히 직렬화해서 항상 올바른 최종 결과를 보장해 준다"]
      answer: 1
      explanation: "race condition은 공유 자원에 대한 읽기-수정-쓰기가 원자적이지 않아서 발생하며, mutex 같은 동기화 수단으로 막아야 한다."

- topic: ipc-mechanisms
  title: "IPC 메커니즘"
  section: 정리
  variants:
    - question: "대용량 카메라 영상 프레임을 커널의 복사 없이 가장 빠르게 반복 전달하려 할 때 적합한 IPC 메커니즘은 무엇인가?"
      choices: ["메시지 큐로 프레임 데이터를 순서대로 전달하는 방식", "공유 메모리를 매핑해 두 프로세스가 같은 영역을 직접 참조하는 방식", "시그널", "유닉스 도메인 소켓을 이용해 매번 데이터를 복사하면서 순차적으로 스트리밍하는 방식"]
      answer: 1
      explanation: "공유 메모리는 커널을 거쳐 데이터를 복사하지 않고 같은 물리 메모리를 직접 참조하므로 대용량 데이터 전달에 가장 빠르다."
    - question: "문이 열렸다는 단순한 사실만 여러 프로세스에게 가볍게 알리고 싶을 때 가장 적합한 방식은 무엇인가?"
      choices: ["공유 메모리 영역에 문 상태 값을 쓰고 세마포어로 접근 순서를 통제하는 방식", "유닉스 도메인 소켓이나 시그널로 가볍게 이벤트를 알리는 방식", "메시지 큐", "FIFO를 열어 두고 지속적으로 폴링해서 문 상태를 확인하는 방식"]
      answer: 1
      explanation: "데이터 자체가 거의 없고 사건 발생만 알리면 되는 경우에는 시그널이나 유닉스 도메인 소켓 같은 가벼운 알림 수단이 적합하다."

- topic: systemd-dbus
  title: "systemd와 D-Bus"
  section: 정리
  variants:
    - question: "systemd 유닛 파일에서 After=can-gateway.service만 적고 Requires=는 적지 않았을 때 생길 수 있는 문제로 옳은 것은 무엇인가?"
      choices: ["부팅 자체가 완전히 실패한다", "can-gateway가 실패해도 뒤에 뜨는 서비스는 순서만 지켜지면 그대로 기동을 시도한다", "After= 설정은 아무 의미가 없어 기동 순서가 무작위로 결정된다", "systemd가 can-gateway.service를 자동으로 Requires= 관계로 승격시켜서 실패 시 다른 서비스도 함께 재시작을 반복한다"]
      answer: 1
      explanation: "After=는 순서만 보장할 뿐 해당 서비스가 반드시 성공적으로 실행되고 있어야 한다는 것까지는 보장하지 않는다."
    - question: "D-Bus가 유닉스 도메인 소켓만으로 직접 서비스 간 통신을 구현하는 것보다 나은 점으로 가장 적절한 것은 무엇인가?"
      choices: ["항상 TCP/IP를 거쳐 더 빨라진다", "서비스 이름으로 상대를 찾고 메서드 호출과 신호를 표준 형식으로 주고받을 수 있다", "모든 프로세스가 자동으로 같은 메모리 공간을 공유하게 된다", "커널이 D-Bus 메시지를 직접 해석해서 소켓이나 파일 디스크립터 없이 프로세스 사이에 데이터를 순간 이동시켜 준다"]
      answer: 1
      explanation: "D-Bus는 서비스 디스커버리와 표준화된 메서드 호출·신호 전달을 제공해 매번 소켓 프로토콜을 직접 설계할 필요를 없애 준다."
