- topic: symmetric-asymmetric
  title: "대칭키와 공개키 암호"
  section: 정리
  variants:
    - question: "CAN 버스처럼 짧은 메시지를 빠르게 주고받는 통신에 대칭키 암호가 공개키 암호보다 선호되는 이유로 가장 적절한 것은 무엇인가?"
      choices:
        - "대칭키 암호는 양쪽이 키를 사전에 전혀 공유하지 않아도 항상 안전하게 동작하기 때문이다"
        - "대칭키 연산이 공개키 연산보다 훨씬 빠르고 자원 소모가 적기 때문이다"
        - "대칭키 암호만 부인방지 속성을 완전히 제공하기 때문이다"
        - "공개키 암호는 자동차 환경에서 수학적으로 성립하지 않기 때문이다"
      answer: 1
      explanation: "대칭키 암호는 연산이 빠르고 자원 소모가 적어 반복적이고 빠른 통신에 적합하다."
    - question: "보안 부팅의 서명 검증에 공개키 암호가 적합한 이유로 옳은 것은 무엇인가?"
      choices:
        - "공개키가 유출되어도 검증 체계의 안전성이 깨지지 않기 때문이다"
        - "공개키 연산이 대칭키 연산보다 항상 더 빠르기 때문이다"
        - "공개키 암호는 키 길이가 대칭키보다 짧아 메모리를 절약하기 때문이다"
        - "공개키는 ECU마다 서로 다른 값을 매번 새로 생성해야 하기 때문이다"
      answer: 0
      explanation: "공개키는 외부에 공개되어도 안전하므로 수백만 대의 ECU에 동일한 공개키를 심어도 안전성이 유지된다."

- topic: mac-signature
  title: "MAC과 전자서명"
  section: 정리
  variants:
    - question: "메시지 인증 코드(MAC)와 전자서명의 근본적인 차이로 가장 적절한 것은 무엇인가?"
      choices:
        - "MAC은 비밀키 쪽만 생성 가능해 더 강력한 부인방지를 제공한다"
        - "전자서명은 비밀키를 가진 쪽만 생성할 수 있어 부인방지를 제공하지만 MAC은 그렇지 않다"
        - "MAC과 전자서명은 둘 다 암호학적 해시 함수라는 개념 자체를 어떤 경우에도 전혀 사용하지 않는다"
        - "전자서명은 대칭키를 공유한 모든 당사자가 똑같이 생성할 수 있다"
      answer: 1
      explanation: "전자서명은 비밀키 소유자만 생성할 수 있어 부인방지를 제공하지만, MAC은 공유 키를 가진 쪽이면 누구나 생성할 수 있다."
    - question: "CAN 프레임의 데이터 필드 공간이 제한된 상황에서 AUTOSAR SecOC가 취하는 실무적 절충으로 옳은 것은?"
      choices:
        - "MAC 값 전체를 조금도 자르지 않고 압축도 없이 매 프레임마다 그대로 전송한다"
        - "잘라낸 MAC과 신선도 값을 결합해 제한된 공간 안에서 인증을 제공한다"
        - "전자서명 전체를 매 프레임마다 압축 없이 포함시킨다"
        - "인증 자체를 생략하고 암호화만으로 무결성을 보장한다"
      answer: 1
      explanation: "SecOC는 잘라낸 MAC과 재전송 공격을 막는 신선도 값을 결합해 제한된 메시지 크기 안에서 실용적 인증을 제공한다."

- topic: key-lifecycle
  title: "키 유도와 키 수명주기"
  section: 정리
  variants:
    - question: "모든 차량에 완전히 동일한 대칭키 하나를 심는 설계가 가지는 가장 큰 위험으로 가장 적절한 것은 무엇인가?"
      choices:
        - "암호 연산 속도가 지나치게 빨라져서 오히려 차량 시스템 전체가 항상 매번 불안정해지는 것"
        - "한 대의 키 유출이 같은 키를 쓰는 모든 차량의 위험으로 번지는 단일 실패 지점 문제"
        - "서명 검증에 필요한 공개키를 더 이상 배포할 수 없게 되는 것"
        - "ADC의 양자화 오차가 암호화 과정에서 함께 커지는 것"
      answer: 1
      explanation: "동일한 키를 공유하면 한 대에서의 키 유출이 같은 키를 쓰는 모든 차량으로 번지는 단일 실패 지점이 된다."
    - question: "키 유도 함수(KDF)로 마스터 키와 칩 고유 식별값을 결합해 차량별 고유 키를 만드는 방식의 장점으로 옳은 것은?"
      choices:
        - "하나의 마스터 키만 안전하게 지키면서도 서로 다른 고유 키를 다수 운용할 수 있다"
        - "모든 차량이 결국 동일한 고유 키를 공유하게 되어 관리가 단순해진다"
        - "유출된 고유 키로부터 마스터 키를 쉽게 역산할 수 있게 해준다"
        - "마스터 키 자체를 매 차량마다 완전히 새로 생성해서 따로 배포해야 하는 부담을 크게 늘려준다"
      answer: 0
      explanation: "키 유도는 하나의 마스터 키만 지키면서도 차량별로 서로 다른 고유 키를 계산해내는 실용적 절충이다."
