<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="대칭키 암호와 공개키 암호의 구조 비교">
  <defs><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">대칭키 암호 vs 공개키 암호</text>

  <line x1="360" y1="45" x2="360" y2="200" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="5,5"/>

  <text x="180" y="55" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">대칭키 암호 (같은 키)</text>
  <rect x="20" y="100" width="140" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="90" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">송신자 (키 K)</text>
  <rect x="200" y="100" width="140" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="270" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">수신자 (키 K)</text>
  <line x1="160" y1="125" x2="200" y2="125" stroke="#8aa0c6" stroke-width="2" marker-end="url(#e)"/>
  <text x="180" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">암호문</text>

  <text x="540" y="55" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">공개키 암호 (다른 키)</text>
  <rect x="380" y="100" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="455" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">송신자 (공개키)</text>
  <rect x="560" y="100" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="635" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">수신자 (비밀키)</text>
  <line x1="530" y1="125" x2="560" y2="125" stroke="#8aa0c6" stroke-width="2" marker-end="url(#e)"/>
  <text x="545" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">암호문</text>
</svg>
