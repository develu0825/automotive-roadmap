- topic: root-of-trust
  title: "신뢰의 뿌리와 체인 오브 트러스트"
  section: 정리
  variants:
    - question: "보안 부팅에서 신뢰의 뿌리가 무조건 믿을 수 있는 출발점이 되는 이유로 가장 적절한 것은 무엇인가?"
      choices:
        - "제조 공정이 끝난 뒤에도 매번 새로운 비밀키를 네트워크로 내려받아 검증하기 때문이다"
        - "변경 불가능한 롬에 새겨져 공격자가 소프트웨어로 바꿀 수 없기 때문이다"
        - "검증 결과를 서버에 보내 다시 확인받는 절차를 거치기 때문이다"
        - "매 부팅마다 임의로 다른 코드를 실행하도록 설계되었기 때문이다"
      answer: 1
      explanation: "신뢰의 뿌리는 변경 불가능한 하드웨어 롬에 저장되어 소프트웨어 공격으로 바꿀 수 없기 때문에 신뢰된다."
    - question: "체인 오브 트러스트에서 한 단계가 서명 검증에 실패했을 때 반드시 일어나야 하는 동작으로 옳은 것은?"
      choices:
        - "실패를 무시하고 다음 단계로 그대로 실행을 넘긴다"
        - "실행을 중단하거나 안전한 대체 이미지로 전환한다"
        - "서명 검증 없이 해시값만 저장하고 넘어간다"
        - "공개키를 즉시 삭제하고 재부팅 없이 계속 동작한다"
      answer: 1
      explanation: "서명 검증에 실패하면 실행을 중단하거나 안전한 대체 경로로 전환해야 체인의 신뢰가 유지된다."

- topic: hsm-role
  title: "HSM의 역할"
  section: 정리
  variants:
    - question: "비밀키를 메인 프로세서의 일반 메모리에 저장하는 설계가 HSM 기반 설계보다 취약한 근본적인 이유는 무엇인가?"
      choices:
        - "메인 프로세서의 연산 속도가 HSM보다 어떤 경우에도 항상 느리기 때문이다"
        - "메인 소프트웨어의 취약점만으로 비밀키가 그대로 유출될 수 있기 때문이다"
        - "일반 메모리는 전원이 꺼지면 모든 데이터가 영구히 사라지기 때문이다"
        - "일반 메모리는 서명 생성 연산 자체를 수행할 수 없기 때문이다"
      answer: 1
      explanation: "비밀키가 메인 프로세서와 같은 신뢰 경계에 있으면 소프트웨어 취약점만으로 키가 유출될 수 있다."
    - question: "HSM이 제공하는 기능으로 가장 적절한 것은 무엇인가?"
      choices:
        - "메인 프로세서가 실행하는 모든 애플리케이션 코드를 대신 전부 실행해주는 기능"
        - "비밀키를 물리적으로 격리된 영역에 보관하고 변조 시도를 감지하는 기능"
        - "차량 내 모든 CAN 메시지의 내용을 자동으로 번역하는 기능"
        - "운전자의 생체 정보를 수집해 서버로 전송하는 기능"
      answer: 1
      explanation: "HSM은 비밀키를 물리적으로 격리된 영역에 보관하고 부채널 공격·변조 시도에 대응하는 기능을 제공한다."

- topic: measured-boot
  title: "측정 부팅과 보안 부팅"
  section: 정리
  variants:
    - question: "보안 부팅과 측정 부팅의 핵심적인 차이로 가장 적절한 것은 무엇인가?"
      choices:
        - "보안 부팅은 기록만 남기고 측정 부팅은 즉시 실행을 거부한다"
        - "보안 부팅은 검증 실패 시 실행을 거부하고 측정 부팅은 상태를 암호학적으로 기록한다"
        - "보안 부팅은 HSM이 필요 없고 측정 부팅만 HSM을 필요로 한다"
        - "보안 부팅과 측정 부팅은 명칭만 다를 뿐 내부적으로 완전히 동일한 하나의 절차를 가리킨다"
      answer: 1
      explanation: "보안 부팅은 검증 실패 시 실행을 거부하고, 측정 부팅은 실행된 구성을 암호학적으로 기록해 사후 검증에 활용한다."
    - question: "측정 부팅으로 남긴 기록이 실무에서 활용되는 방식으로 옳은 것은 무엇인가?"
      choices:
        - "기록을 즉시 삭제해 어떤 검증자도 접근하지 못하게 한다"
        - "원격 검증자가 기록을 확인해 신뢰 여부를 판단하거나 특정 기능을 조건부로 허용한다"
        - "기록된 값과 기대값이 달라도 항상 동일하게 처리한다"
        - "기록은 오직 1차 부트로더가 실행되기 바로 전에만 한 번 생성되고 그 이후로는 아무 의미도 갖지 않는다"
      answer: 1
      explanation: "측정 부팅의 기록은 원격 검증자가 확인해 신뢰 여부를 판단하거나 특정 민감 기능을 조건부로 허용하는 데 쓰인다."
