<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="HSM: 물리적으로 분리된 신뢰 영역과 비밀 키 격리">
  <defs><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">HSM: 물리적으로 분리된 신뢰 영역</text>

  <rect x="40" y="70" width="240" height="100" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="160" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">메인 프로세서</text>
  <text x="160" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(OS/애플리케이션)</text>

  <rect x="400" y="50" width="280" height="140" rx="10" fill="none" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="6,4"/>

  <rect x="420" y="65" width="240" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="540" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">HSM 코어</text>
  <text x="540" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(서명/검증 연산)</text>

  <rect x="420" y="135" width="240" height="45" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="540" y="162" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">비밀 키 (외부 반출 불가)</text>

  <line x1="280" y1="95" x2="420" y2="95" stroke="#8aa0c6" stroke-width="2" marker-end="url(#d)"/>
  <text x="350" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">서명 요청</text>

  <line x1="400" y1="145" x2="280" y2="145" stroke="#8aa0c6" stroke-width="2" marker-end="url(#d)"/>
  <text x="350" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">서명 결과</text>

  <path d="M393,151 L407,165" stroke="#f59e0b" stroke-width="2"/>
  <path d="M393,165 L407,151" stroke="#f59e0b" stroke-width="2"/>
