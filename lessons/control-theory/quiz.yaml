- topic: open-vs-feedback
  title: "개루프 제어와 피드백 제어"
  section: 정리
  variants:
    - question: "오르막길에서 스로틀 각도를 미리 계산된 값으로 고정해두는 크루즈 컨트롤의 한계를 가장 적절하게 설명한 것은 무엇인가?"
      choices:
        - "결과를 다시 측정하지 않으므로 경사 변화로 생긴 오차가 저절로 줄어들지 않는다"
        - "목표 속도를 아예 설정할 수 없게 되어 시스템 자체가 처음부터 멈춰버린다는 뜻이다"
        - "스로틀 모터가 과열되어 영구적으로 고장나는 문제가 반드시 발생한다"
        - "센서 없이도 항상 목표 속도를 정확하게 유지할 수 있게 된다"
      answer: 0
      explanation: "개루프 제어는 결과를 다시 측정해 고치는 과정이 없어 경사 등 교란으로 생긴 오차가 그대로 유지된다."
    - question: "피드백 제어 루프에서 오차를 보고 제어 입력을 결정하는 역할을 맡는 구성 요소로 옳은 것은?"
      choices:
        - "목표값을 설정하는 운전자의 입력 그 자체"
        - "오차를 바탕으로 다음 입력을 계산해내는 제어기"
        - "제어 대상이 되는 차량의 실제 종방향 동역학 그 자체"
        - "현재 속도를 측정해 전달하는 휠 스피드 센서"
      answer: 1
      explanation: "제어기는 목표값과 측정값의 오차를 받아 그에 맞는 제어 입력을 계산하는 블록이다."

- topic: pid-control
  title: "PID 제어기의 세 항"
  section: 정리
  variants:
    - question: "오르막에서 발생한 정상상태 오차를 줄이기 위해 올려야 하는 게인과 그 이유로 가장 적절한 것은 무엇인가?"
      choices:
        - "비례 게인을 올려야 하며 오차에 즉시 비례해 반응하기 때문이다"
        - "적분 게인을 올려야 하며 남아있는 오차가 시간에 따라 누적되어 결국 0으로 밀어붙이기 때문이다"
        - "미분 게인을 올려야 하며 오차가 변화하는 순간의 속도만 보아도 정상상태 오차를 완전히 없앨 수 있기 때문이다"
        - "세 게인을 모두 0으로 낮춰야 정상상태 오차가 사라지기 때문이다"
      answer: 1
      explanation: "적분항은 지속적으로 남아있는 오차를 시간에 걸쳐 누적해 결국 0으로 수렴시키므로 정상상태 오차 제거에 쓰인다."
    - question: "미분(D) 게인을 과도하게 키웠을 때 나타날 수 있는 문제로 가장 적절한 것은 무엇인가?"
      choices:
        - "정상상태 오차가 영원히 사라지지 않게 된다"
        - "센서 노이즈에 민감해져 출력이 미세하게 떨리는 현상이 나타난다"
        - "오버슈트가 어떤 상황에서도 항상 더 커지는 방향으로만 작용하게 된다"
        - "제어 주기가 자동으로 두 배로 늘어난다"
      answer: 1
      explanation: "미분항은 순간 변화율을 사용하므로 게인이 과하면 센서 노이즈까지 증폭해 출력이 떨리게 된다."

- topic: state-space
  title: "상태공간 표현"
  section: 정리
  variants:
    - question: "횡방향 속도와 요각속도처럼 서로 얽힌 여러 상태를 다룰 때 상태공간 표현이 PID 여러 개를 나란히 쓰는 방식보다 유리한 이유로 가장 적절한 것은 무엇인가?"
      choices:
        - "각 상태가 서로 아무 영향도 주지 않는 완전히 독립된 별개의 시스템으로 나누어 처리하기 때문이다"
        - "A, B 행렬에 상태 간 상호작용을 포함시켜 하나의 게인으로 설계할 수 있기 때문이다"
        - "상태공간은 센서 측정값을 전혀 사용하지 않고 제어할 수 있기 때문이다"
        - "상태공간을 쓰면 더 이상 안정성을 확인할 필요가 없어지기 때문이다"
      answer: 1
      explanation: "상태공간은 상태 간 상호작용을 행렬에 담아 하나의 게인 행렬로 여러 상태를 동시에 체계적으로 설계할 수 있다."
    - question: "상태 피드백으로 원하는 극점 배치가 가능한지를 판단하는 전제조건으로 가장 적절한 것은 무엇인가?"
      choices:
        - "가제어성 행렬의 랭크가 풀랭크인지를 확인하는 것"
        - "오버슈트가 항상 0퍼센트인지를 확인하는 것"
        - "제어 주기가 반드시 10ms보다 짧은지를 확인하는 것"
        - "센서가 전압이 아니라 펄스 빈도로만 값을 출력하는지를 확인하는 것"
      answer: 0
      explanation: "가제어성 행렬이 풀랭크면 시스템이 가제어이며, 그래야 원하는 극점 배치가 가능하다."
