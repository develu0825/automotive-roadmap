<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="피드백 제어 루프: 목표값과 측정값의 오차를 줄이는 순환 구조">
  <defs><marker id="i" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">피드백 제어 루프</text>

  <line x1="20" y1="110" x2="72" y2="110" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>
  <text x="35" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">r(t)</text>

  <circle cx="90" cy="110" r="18" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="90" y="116" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">+</text>
  <text x="78" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">−</text>

  <rect x="140" y="85" width="110" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="195" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">제어기</text>

  <rect x="290" y="85" width="110" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="345" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">구동기</text>

  <rect x="440" y="85" width="110" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="495" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">플랜트</text>

  <rect x="440" y="150" width="110" height="40" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="495" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">센서</text>

  <line x1="108" y1="110" x2="140" y2="110" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>
  <line x1="250" y1="110" x2="290" y2="110" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>
  <line x1="400" y1="110" x2="440" y2="110" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>
  <line x1="550" y1="110" x2="660" y2="110" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>
  <text x="675" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">y(t)</text>

  <line x1="495" y1="135" x2="495" y2="150" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>

  <polyline points="440,170 90,170 90,128" fill="none" stroke="#8aa0c6" stroke-width="2" marker-end="url(#i)"/>
</svg>
