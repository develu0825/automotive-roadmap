<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="DTS 노드 트리 구조">
  <text x="360" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">DTS 노드 트리 구조</text>

  <rect x="230" y="44" width="260" height="56" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">/ (루트)</text>
  <text x="360" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">compatible 선언</text>

  <rect x="90" y="140" width="260" height="56" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="220" y="162" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">i2c@7e804000</text>
  <text x="220" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">#address-cells=1</text>

  <rect x="430" y="140" width="200" height="56" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="530" y="162" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">leds</text>
  <text x="530" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">gpio-leds</text>

  <rect x="90" y="236" width="260" height="56" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="220" y="258" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">temp_sensor@48</text>
  <text x="220" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">compatible=ti,tmp102</text>

  <rect x="430" y="236" width="200" height="56" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="530" y="258" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">status_led</text>
  <text x="530" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">gpios = &amp;gpio 17 0</text>

  <line x1="360" y1="100" x2="220" y2="140" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="360" y1="100" x2="530" y2="140" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="220" y1="196" x2="220" y2="236" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="530" y1="196" x2="530" y2="236" stroke="#8aa0c6" stroke-width="2"/>
</svg>
