  <text x="360" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">dtc 컴파일</text>
  <text x="360" y="159" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">DTS → DTB 변환</text>

  <line x1="360" y1="170" x2="360" y2="196" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

