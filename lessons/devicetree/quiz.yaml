- topic: devicetree-purpose
  title: "디바이스 트리의 목적"
  section: 정리
  variants:
    - question: "디바이스 트리가 도입되기 전, 보드별 하드웨어 주소를 커널 소스 코드에 직접 하드코딩했을 때 생긴 근본적인 문제로 가장 적절한 것은?"
      choices:
        - "보드가 늘어날수록 보드별 소스 파일이 계속 늘어나고, 작은 변경에도 커널 전체를 다시 빌드해야 했다"
        - "커널이 네트워크 기능을 전혀 지원하지 못했다는 문제였다"
        - "모든 보드가 완전히 동일한 디바이스 트리 파일 하나만 공유하도록 커널이 강제해서 보드마다 전혀 수정할 수 없었다는 문제였다"
        - "DTC 컴파일러 자체가 세상에 존재하지 않아 빌드가 원천적으로 불가능했다는 문제였다"
      answer: 0
      explanation: "하드웨어 정보가 커널 소스에 섞여 있으면 보드가 늘어날수록 보드별 파일이 늘고, 작은 변경에도 커널 전체를 다시 빌드해야 했다."
    - question: "compatible 속성의 역할로 옳은 것은?"
      choices:
        - "노드가 어떤 하드웨어인지 선언해 커널이 맞는 드라이버를 찾아 연결하게 한다"
        - "노드의 인터럽트 번호를 지정한다"
        - "노드가 위치한 버스 주소를 지정한다"
        - "DTS 파일을 DTB로 컴파일할 때 DTC 컴파일러에 전달해야 하는 모든 명령줄 옵션들의 정식 이름이다"
      answer: 0
      explanation: "커널은 각 노드의 compatible 문자열을 읽고 자신이 등록한 드라이버 중 일치하는 것을 찾아 연결한다."
- topic: address-size-cells-phandle
  title: "address-cells와 phandle"
  section: 정리
  variants:
    - question: "#address-cells와 #size-cells 속성이 하는 역할로 가장 적절한 것은?"
      choices:
        - "자식 노드의 reg 속성을 몇 개의 32비트 셀로 해석해야 하는지를 선언한다"
        - "노드의 compatible 문자열 길이를 제한한다"
        - "DTS 파일의 전체 들여쓰기 규칙을 정의한다"
        - "커널 이미지와 디바이스 트리가 저장되는 저장장치의 파티션 번호와 오프셋을 전부 지정한다"
      answer: 0
      explanation: "#address-cells와 #size-cells는 자식 노드의 reg 값을 몇 개의 32비트 셀로 해석할지를 부모 노드가 선언하는 속성이다."
    - question: "phandle(&레이블) 참조가 필요한 상황으로 옳은 것은?"
      choices:
        - "나무 구조상 멀리 떨어진 두 노드가 공통 자원을 공유해서 가리켜야 할 때다"
        - "노드의 이름에 숫자와 특수문자를 자유롭게 섞어서 원하는 만큼 길게 포함시키고 싶을 때다"
        - "DTS 파일을 여러 줄로 나눠 적고 싶을 때다"
        - "컴파일러가 자동으로 주석을 생성해야 할 때다"
      answer: 0
      explanation: "phandle 참조는 나무 구조상 떨어진 노드들이 GPIO 컨트롤러 같은 공통 자원을 중복 없이 가리킬 수 있게 해준다."
- topic: dts-to-dtb
  title: "DTS에서 DTB로"
  section: 정리
  variants:
    - question: "DTC(Device Tree Compiler)가 수행하는 작업으로 옳은 것은?"
      choices:
        - "사람이 작성한 텍스트 형식의 DTS를 커널이 빠르게 파싱할 수 있는 이진 형식 DTB로 변환한다"
        - "커널 소스 코드를 실행 가능한 기계어로 번역한다"
        - "U-Boot 환경 변수의 bootcmd 값을 분석해 커널과 램디스크를 메모리에 올리는 순서까지 자동으로 생성한다"
        - "보드의 전원 레일 전압을 측정해서 기록한다"
      answer: 0
      explanation: "DTC는 사람이 읽는 DTS 텍스트 파일을 커널이 부팅 중 빠르게 파싱할 수 있는 DTB 이진 형식으로 변환하는 도구다."
    - question: "디바이스 트리 오버레이(overlay)를 쓰는 상황으로 가장 적절한 것은?"
      choices:
        - "메인 보드의 전체 DTS를 복제하지 않고 후방 카메라 모듈처럼 추가되는 하드웨어의 노드만 덧붙이고 싶을 때다"
        - "커널 바이너리 자체를 완전히 새로 컴파일하고, 부트로더와 램디스크와 루트파일시스템까지 전부 처음부터 다시 빌드하고 싶을 때다"
        - "U-Boot의 bootargs 문자열 전체를 삭제하고 싶을 때다"
        - "DRAM 컨트롤러의 타이밍 파라미터를 영구적으로 삭제하고 싶을 때다"
      answer: 0
      explanation: "오버레이는 기본 디바이스 트리 전체를 복제하지 않고도, 특정 확장 모듈에 필요한 노드만 덧붙여 병합할 수 있게 해준다."
