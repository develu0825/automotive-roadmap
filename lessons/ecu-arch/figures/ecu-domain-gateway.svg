  <rect x="300" y="120" width="120" height="60" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="2"/>
  <text x="360" y="148" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">게이트웨이</text>
  <text x="360" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ECU</text>

  <line x1="230" y1="57" x2="300" y2="120" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="490" y1="57" x2="420" y2="120" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="230" y1="242" x2="300" y2="180" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="490" y1="242" x2="420" y2="180" stroke="#8aa0c6" stroke-width="2"/>
