<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="도메인 아키텍처와 게이트웨이 ECU 구조">
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">도메인 아키텍처와 게이트웨이 ECU</text>

  <rect x="60" y="30" width="170" height="55" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="145" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">파워트레인 도메인</text>
  <text x="145" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(고속 CAN)</text>

  <rect x="490" y="30" width="170" height="55" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
