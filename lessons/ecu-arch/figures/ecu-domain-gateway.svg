  <text x="575" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(고속 CAN)</text>

  <rect x="60" y="215" width="170" height="55" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="145" y="237" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">바디 도메인</text>
  <text x="145" y="257" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(LIN)</text>

  <rect x="490" y="215" width="170" height="55" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
