- topic: ecu-power-cranking
  title: "ECU 전원 설계와 크랭킹 전압 저하"
  section: 정리
  variants:
    - question: "크랭킹 구간에서 배터리 단자 전압이 크게 떨어지는 현상이 엔진 ECU 전원 설계에 요구하는 것으로 가장 적절한 것은?"
      choices: ["엔진 ECU는 크랭킹 중에는 잠시 꺼져 있어도 무방하다", "전원 관리 IC가 낮아진 입력 전압에서도 필요한 전압을 안정적으로 만들어낼 여유를 갖도록 설계해야 한다", "배터리와 ECU를 잇는 배선의 저항을 오히려 의도적으로 최대한 크게 만들어서 전압 강하를 더욱 키워야 가장 안전해진다는 뜻이다", "크랭킹과 무관하다"]
      answer: 1
      explanation: "크랭킹 중 전압이 낮아져도 엔진 ECU가 리셋되지 않도록 전원 관리 IC는 낮은 입력 전압에서도 동작할 여유를 가져야 한다."
    - question: "배터리와 배선을 합친 내부 저항이 0.02옴이고 크랭킹 전류가 150A일 때 전압 강하로 옳은 것은?"
      choices: ["0.02V", "3V만큼 떨어진다", "150V만큼 떨어져 거의 모든 전압이 사라진다", "0V로 전혀 떨어지지 않는다"]
      answer: 1
      explanation: "V=IR 공식에 따라 0.02×150=3V의 전압 강하가 생긴다."
- topic: quiescent-current-sleep
  title: "암전류와 슬립 모드"
  section: 정리
  variants:
    - question: "배터리 용량 50Ah, 전체 ECU 암전류 합이 25mA일 때 완전 방전까지 걸리는 시간으로 가장 적절한 것은?"
      choices: ["약 8일 정도로 금방 방전된다", "약 83일 정도가 지나야 완전히 방전된다", "약 830일 정도로 거의 영구적으로 방전되지 않는 수준이다", "약 2일이면 방전된다"]
      answer: 1
      explanation: "t=Q/I=50/0.025=2000시간이고 이를 24로 나누면 약 83일이 된다."
    - question: "ECU가 슬립 모드로 제때 들어가지 못하고 계속 깨어 있는 상태가 되는 '다크 커런트 드레인' 문제가 일으키는 결과로 가장 적절한 것은?"
      choices: ["ECU의 연산 속도가 두 배로 빨라진다", "차량을 오래 세워두면 배터리가 예상보다 훨씬 빨리 방전될 수 있다", "CAN 버스의 비트 중재 우선순위와 메시지 ID 배정 규칙이 영구적으로 완전히 바뀌어 버린다", "엔진 출력이 즉시 증가한다"]
      answer: 1
      explanation: "슬립 모드로 들어가지 못한 ECU는 암전류를 계속 소모해 주차 중 배터리를 예상보다 빨리 방전시킬 수 있다."
- topic: domain-gateway
  title: "도메인 아키텍처와 게이트웨이"
  section: 정리
  variants:
    - question: "ECU를 기능별 도메인으로 묶는 도메인 아키텍처가 분산형 구조보다 나은 점과 새로 생기는 과제를 함께 설명한 것으로 가장 적절한 것은?"
      choices: ["ECU 개수는 늘지만 배선 부담은 전혀 늘지 않는다", "ECU 개수와 배선 부담은 줄지만 도메인 컨트롤러 한 대의 고장 영향 범위는 커진다", "배선 부담은 줄지만 각 ECU는 오히려 더 많아지고 고장 영향 범위는 완전히 사라진다", "아무 변화가 없다"]
      answer: 1
      explanation: "도메인 컨트롤러로 통합하면 배선과 ECU 개수는 줄지만 한 대가 고장 났을 때 영향받는 범위는 넓어진다."
    - question: "서로 다른 버스와 프로토콜로 나뉜 도메인들 사이에서 메시지를 중재하고 보안 방화벽 역할까지 수행하는 ECU로 옳은 것은?"
      choices: ["게이트웨이 ECU", "바디 도메인 컨트롤러", "모든 도메인의 연산을 직접 수행하는 중앙 고성능 컴퓨팅 유닛", "PMIC"]
      answer: 0
      explanation: "게이트웨이 ECU는 도메인 간 메시지를 중재해 전달하고 외부 침입 트래픽을 막는 방화벽 역할도 수행한다."
