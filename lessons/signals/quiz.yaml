- topic: sampling-quantization
  title: "샘플링과 양자화"
  section: 정리
  variants:
    - question: "나이퀴스트 기준을 지키지 않고 신호를 너무 느리게 샘플링했을 때 나타나는 현상으로 가장 적절한 것은 무엇인가?"
      choices:
        - "실제보다 더 빠르게 변하는 진짜 신호 그대로가 측정되는 현상"
        - "실제와 다른 느린 가짜 신호가 나타나는 에일리어싱 현상"
        - "양자화 비트 수가 자동으로 늘어나는 현상"
        - "센서 출력 전압이 항상 0V로 고정되는 현상"
      answer: 1
      explanation: "샘플링 주파수가 신호 최대 주파수의 2배보다 작으면 실제와 다른 느린 가짜 신호인 에일리어싱이 나타난다."
    - question: "0V에서 5V 범위를 8비트 ADC로 양자화할 때와 10비트 ADC로 양자화할 때의 관계로 옳은 것은?"
      choices:
        - "두 경우 모두 양자화 간격이 항상 완전히 동일하게 유지된다고 볼 수 있다"
        - "8비트 양자화의 간격이 10비트보다 약 4배 더 거칠어진다"
        - "10비트 양자화는 샘플링 주파수를 낮춰야 동작한다"
        - "비트 수가 늘어나면 양자화 오차도 함께 커진다"
      answer: 1
      explanation: "단계 수가 2의 거듭제곱으로 늘어나므로 8비트는 10비트보다 한 단계의 전압 간격이 약 4배 더 거칠다."

- topic: sensor-actuator
  title: "센서와 액추에이터"
  section: 정리
  variants:
    - question: "센서와 액추에이터의 역할 차이를 가장 적절하게 설명한 것은 무엇인가?"
      choices:
        - "센서는 전기 신호를 물리적 작용으로 바꾸고 액추에이터는 물리량을 전기 신호로 바꾼다고 알려져 있다"
        - "센서는 물리량을 전기 신호로, 액추에이터는 전기 신호를 물리적 작용으로 바꾼다"
        - "센서와 액추에이터는 둘 다 ECU 내부에서만 동작하는 소프트웨어 모듈이다"
        - "센서와 액추에이터는 서로 완전히 같은 기능을 수행하는 동의어다"
      answer: 1
      explanation: "센서는 물리량을 전기 신호로 바꾸는 입력 장치이고, 액추에이터는 전기 신호를 물리적 작용으로 바꾸는 출력 장치다."
    - question: "많은 바퀴 속도 센서가 전압의 크기보다 펄스의 빈도로 값을 표현하는 이유로 가장 적절한 것은 무엇인가?"
      choices:
        - "펄스 방식은 전압 강하나 전자기 노이즈에 훨씬 강하기 때문이다"
        - "펄스 방식은 ADC 변환을 생략하기 때문이다"
        - "전압 크기 방식은 배선 길이와 전혀 관계없이 항상 정확하기 때문이다"
        - "펄스 방식은 온도 변화에 의한 저항 변화를 측정하는 유일한 방법이기 때문이다"
      answer: 0
      explanation: "펄스의 있다 없다만 구분하는 방식은 전압 강하나 전자기 노이즈의 영향을 훨씬 덜 받는다."

- topic: pwm-noise
  title: "PWM과 노이즈 처리"
  section: 정리
  variants:
    - question: "12V 공급에 듀티 사이클 30퍼센트인 PWM 신호가 헤드램프에 걸릴 때 나타나는 효과로 가장 적절한 것은 무엇인가?"
      choices:
        - "램프에 순간적으로 12V가 그대로 계속 걸린 것과 동일한 밝기가 된다"
        - "약 3.6V가 걸린 것과 비슷한 평균 효과로 어둡게 빛난다"
        - "램프가 전혀 켜지지 않고 완전히 꺼진 상태로 유지된다"
        - "듀티 사이클과 무관하게 항상 동일한 밝기로 켜진다"
      answer: 1
      explanation: "평균 전압은 듀티 사이클과 공급 전압의 곱이므로 12V의 30퍼센트인 약 3.6V에 해당하는 밝기로 빛난다."
    - question: "같은 노이즈가 섞인 센서 신호를 여러 번 평균화할 때 생기는 trade-off 로 가장 적절한 것은 무엇인가?"
      choices:
        - "노이즈는 줄어들지만 빠르게 변하는 신호에는 반응이 뒤처지게 된다"
        - "노이즈와 반응 속도가 평균화 횟수와 전혀 관계없이 항상 일정하다"
        - "평균화를 많이 할수록 샘플링 주파수가 자동으로 함께 높아진다"
        - "평균화는 양자화 오차만 줄이고 노이즈에는 아무 영향도 주지 않는다"
      answer: 0
      explanation: "평균화 횟수를 늘리면 노이즈는 줄어들지만 측정에 걸리는 시간이 늘어 빠른 변화에 대한 반응이 뒤처진다."
