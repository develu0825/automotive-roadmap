  <line x1="280" y1="45" x2="280" y2="250" stroke="#3a4d72" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="360" y1="45" x2="360" y2="250" stroke="#3a4d72" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="45" x2="440" y2="250" stroke="#3a4d72" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="520" y1="45" x2="520" y2="250" stroke="#3a4d72" stroke-width="1" stroke-dasharray="4,4"/>
