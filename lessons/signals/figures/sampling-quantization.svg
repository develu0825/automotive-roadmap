  <circle cx="200" cy="100" r="4" fill="#f59e0b"/>
  <circle cx="280" cy="100" r="4" fill="#f59e0b"/>
  <circle cx="360" cy="140" r="4" fill="#f59e0b"/>
  <circle cx="440" cy="220" r="4" fill="#f59e0b"/>
