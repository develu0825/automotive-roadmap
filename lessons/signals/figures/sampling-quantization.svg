  <text x="700" y="254" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">t</text>
  <text x="60" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">V</text>

