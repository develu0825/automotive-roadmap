  <text x="200" y="279" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">아날로그 신호</text>
  <line x1="300" y1="275" x2="330" y2="275" stroke="#3a4d72" stroke-width="1" stroke-dasharray="4,4"/>
