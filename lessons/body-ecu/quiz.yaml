- topic: pinch-detection
  title: "파워윈도우 끼임 방지"
  section: 정리
  variants:
    - question: "파워윈도우 끼임 방지 알고리즘이 끼임을 감지하는 핵심 원리로 가장 적절한 것은 무엇인가?"
      choices:
        - "창문이 닫히는 순간 나는 소리의 크기 변화를 전용 마이크로 지속적으로 감지한다"
        - "부하가 커지면 모터 전류가 증가하는 특성을 이용해 비정상적인 변화를 감지한다"
        - "운전자의 손가락 온도를 적외선 센서로 직접 측정한다"
        - "창문 유리의 색상 변화를 카메라로 인식한다"
      answer: 1
      explanation: "끼임으로 부하가 커지면 모터 전류가 증가하는 특성을 이용해 비정상적인 전류 변화를 끼임으로 감지한다."
    - question: "겨울철 저온에서 끼임 방지 임계값을 상온 기준으로 그대로 두면 생기는 문제로 가장 적절한 것은 무엇인가?"
      choices:
        - "윤활유 굳음으로 커진 정상 부하를 끼임으로 오판하는 오탐이 늘어난다"
        - "모터에 전류가 전혀 흐르지 않게 되어 창문이 완전히 작동을 멈춰버린다"
        - "홀 센서가 더 이상 회전수를 측정할 수 없게 된다"
        - "ASIL 등급이 자동으로 QM으로 낮아지게 된다"
      answer: 0
      explanation: "저온에서는 윤활유 굳음으로 정상 부하도 커질 수 있어 상온 기준 임계값을 쓰면 오탐이 늘어난다."

- topic: pwm-hvac
  title: "PWM 제어와 공조 PID"
  section: 정리
  variants:
    - question: "바디 ECU가 와이퍼 속도나 실내등 밝기를 중간 정도로 표현할 때 PWM을 쓰는 이유로 가장 적절한 것은 무엇인가?"
      choices:
        - "듀티 사이클 조절만으로 디지털 스위치 소자로도 평균적인 중간 세기를 낼 수 있기 때문이다"
        - "PWM은 반드시 별도의 아날로그 전용 회로를 항상 추가로 더 필요로 하기 때문에 그렇다고 알려져 있다"
        - "PWM 신호는 주파수가 낮을수록 더 매끄러운 밝기를 내기 때문이다"
        - "PWM을 쓰면 끼임 방지 기능이 자동으로 함께 구현되기 때문이다"
      answer: 0
      explanation: "PWM은 켜짐 시간의 비율인 듀티 사이클을 조절해 디지털 스위치만으로도 평균적인 중간 세기를 낸다."
    - question: "공조 시스템의 온도 제어에서 비례 이득만 지나치게 높일 때 생기는 문제로 가장 적절한 것은 무엇인가?"
      choices:
        - "블로워가 과도하게 세졌다가 약해지는 것을 반복해 승객이 불편함을 느낀다"
        - "정상상태 오차가 즉시 완전히 사라져 쾌적도가 더 좋아진다"
        - "온도 센서 자체가 완전히 고장 나서 더 이상 어떤 값도 측정하지 못하게 된다"
        - "슬립 상태로의 전환 조건이 자동으로 느슨해진다"
      answer: 0
      explanation: "비례 이득이 지나치게 높으면 블로워 출력이 과도하게 오르내려 승객이 체감하는 불편함이 커진다."

- topic: power-state
  title: "전원 상태 관리"
  section: 정리
  variants:
    - question: "차량 시동이 꺼진 뒤에도 도어 ECU가 리모컨 신호에 즉시 반응할 수 있도록 유지하면서 배터리 소모를 줄이는 방법으로 가장 적절한 것은 무엇인가?"
      choices:
        - "슬립 상태에서 특정 이벤트만 감시하다가 필요할 때 웨이크업하는 방식"
        - "시동이 꺼지는 즉시 모든 회로의 전원을 영구히 차단하는 방식"
        - "활성 상태를 시동이 꺼진 뒤에도 항상 그대로 유지하는 방식"
        - "통신 버스 연결을 완전히 분리해 다른 어떤 ECU와도 신호를 주고받지 않는 방식"
      answer: 0
      explanation: "슬립 상태에서 특정 이벤트만 감시하다가 필요할 때 깨어나는 방식으로 반응성과 저전력을 동시에 만족시킨다."
    - question: "도어 ECU가 시동이 꺼진 뒤에도 슬립 상태로 전환되지 않고 계속 활성 상태를 유지할 때 생기는 가장 직접적인 문제로 옳은 것은?"
      choices:
        - "차량을 며칠만 세워두어도 배터리 암 전류 문제로 방전될 수 있다"
        - "창문 끼임 방지 기능의 ASIL 등급이 즉시 상승한다"
        - "PWM 신호의 듀티 사이클이 자동으로 100퍼센트까지 고정되어 버린다"
        - "다른 모든 ECU의 통신이 영구적으로 차단된다"
      answer: 0
      explanation: "슬립으로 전환되지 않으면 암 전류가 과도하게 커져 며칠만 세워두어도 배터리가 방전될 수 있다."
