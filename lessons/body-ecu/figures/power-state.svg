<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="바디 ECU 전원 상태: 활성·슬립·웨이크업의 순환">
  <defs><marker id="l" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">바디 ECU 전원 상태 순환</text>

  <rect x="300" y="40" width="140" height="55" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="370" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">활성(Active)</text>

  <rect x="80" y="180" width="160" height="55" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="160" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">슬립(Sleep)</text>

  <rect x="480" y="180" width="160" height="55" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="560" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">웨이크업(Wake-up)</text>

  <line x1="320" y1="95" x2="170" y2="180" stroke="#8aa0c6" stroke-width="2" marker-end="url(#l)"/>
  <text x="200" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">일정 시간 유휴</text>

  <line x1="240" y1="207" x2="480" y2="207" stroke="#8aa0c6" stroke-width="2" marker-end="url(#l)"/>
  <text x="360" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">이벤트 감지(리모컨/버스)</text>

  <line x1="560" y1="180" x2="420" y2="95" stroke="#8aa0c6" stroke-width="2" marker-end="url(#l)"/>
  <text x="520" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">즉시 전환</text>
</svg>
