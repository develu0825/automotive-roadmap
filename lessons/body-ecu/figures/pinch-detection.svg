  <defs><marker id="k" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">끼임 방지: 전류 급증 감지</text>

  <line x1="60" y1="200" x2="690" y2="200" stroke="#8aa0c6" stroke-width="2" marker-end="url(#k)"/>
  <line x1="60" y1="200" x2="60" y2="38" stroke="#8aa0c6" stroke-width="2" marker-end="url(#k)"/>
