<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Treble 아키텍처의 system과 vendor 파티션 분리">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Treble: system / vendor 파티션 분리</text>

  <rect x="50" y="70" width="230" height="160" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="165" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">system 파티션</text>
  <text x="165" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">프레임워크 (구글 배포)</text>
  <text x="165" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">안드로이드 공통 코드</text>
  <text x="165" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(system_server, Java API)</text>

  <rect x="440" y="70" width="230" height="160" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="555" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">vendor 파티션</text>
  <text x="555" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">HAL 구현 (OEM / SoC 벤더)</text>
  <text x="555" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">드라이버 바이너리</text>
  <text x="555" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(차량 BSP)</text>

  <rect x="310" y="120" width="100" height="60" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="145" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">VINTF</text>
  <text x="360" y="167" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">호환성 검증</text>

  <line x1="280" y1="150" x2="310" y2="150" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="150" x2="410" y2="150" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
</svg>
