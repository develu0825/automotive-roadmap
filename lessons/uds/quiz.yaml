- topic: uds-message
  title: "UDS 요청·응답 메시지 구조"
  section: 정리
  variants:
    - question: "진단기가 ECU에 데이터 읽기 서비스(0x22)를 요청했을 때 ECU가 처리에 실패하면 돌려주는 응답의 형식으로 옳은 것은?"
      choices: ["0x62로 시작하며 요청한 DID에 저장된 데이터를 세션 상태와 무관하게 항상 그대로 돌려준다", "0x7F로 시작하고 원래 서비스 ID와 NRC 값을 담아 돌려준다", "0x10으로 시작하며 세션을 기본 세션으로 되돌린다", "0x27로 시작하며 보안 접근용 시드 값을 담는다"]
      answer: 1
      explanation: "요청 처리가 실패하면 ECU는 0x7F로 시작하는 부정 응답에 원래 요청한 서비스 ID와 실패 이유를 나타내는 NRC 값을 담아 돌려준다."
    - question: "UDS에서 서비스 ID 뒤에 서브 펑션 바이트를 추가로 두는 이유로 가장 적절한 것은?"
      choices: ["같은 서비스 안에서도 더 세부적인 동작을 구분하기 위해서이다", "서비스 ID가 중복될 때 발생하는 충돌을 방지하고 메시지 전체의 체크섬을 다시 계산하기 위해서이다", "DTC의 상태 바이트를 대신 저장하기 위해서이다", "메시지의 송신 시각을 기록하기 위해서이다"]
      answer: 0
      explanation: "서브 펑션은 세션 제어의 '기본 세션'과 '확장 진단 세션'처럼 같은 서비스 안에서 더 세부적인 동작을 구분하는 역할을 한다."

- topic: uds-session-security
  title: "세션 제어와 보안 접근"
  section: 정리
  variants:
    - question: "UDS 보안 접근(0x27) 서비스가 매번 다른 시드(seed) 값을 사용하는 이유로 가장 적절한 것은?"
      choices: ["과거 통신을 그대로 재생해 인증을 통과하려는 공격을 막기 위해서이다", "ECU가 매 세션마다 메모리 사용량을 줄이기 위해 시드의 비트 수를 가변적으로 조정하기 위해서이다", "세션 타임아웃 시간을 자동으로 계산하기 위해서이다", "DID 번호와 RID 번호를 구분하기 위해서이다"]
      answer: 0
      explanation: "매번 다른 시드를 쓰면 과거에 주고받은 통신을 그대로 재생해 인증을 통과하려는 재생 공격을 막을 수 있다."
    - question: "UDS 표준이 시드-키 교환의 절차는 정의하면서도 시드로부터 키를 계산하는 구체적인 알고리즘을 표준에 명시하지 않는 이유로 옳은 것은?"
      choices: ["모든 차량이 같은 알고리즘을 쓰면 알려지는 순간 전 세계 차량의 보안 접근이 동시에 뚫리기 때문이다", "알고리즘을 표준에 명시하면 모든 제조사가 반드시 같은 하드웨어 보안 모듈을 구매해야 하는 규제가 함께 생기기 때문이다", "세션 제어 서비스와 번호가 겹치기 때문이다", "DTC 상태 바이트 형식과 충돌하기 때문이다"]
      answer: 0
      explanation: "알고리즘을 제조사마다 비공개로 다르게 설계해야, 한 제조사의 알고리즘이 유출되어도 다른 제조사의 차량에는 영향이 미치지 않는다."

- topic: uds-dtc-routine
  title: "DID·루틴 제어와 DTC"
  section: 정리
  variants:
    - question: "UDS에서 DID 기반 읽기·쓰기 서비스와 루틴 제어(0x31) 서비스의 역할 차이로 옳은 것은?"
      choices: ["DID는 상태를 보거나 바꾸고 루틴 제어는 ECU 안에 정의된 절차를 실행시킨다", "DID는 보안 접근 없이도 항상 모든 동작을 허용하고 루틴 제어는 세션 제어와 완전히 동일하게 동작한다", "DID와 루틴 제어는 동의어로 완전히 같은 동작을 한다", "루틴 제어만 암호화 서명을 검증한다"]
      answer: 0
      explanation: "DID 기반 읽기·쓰기는 개별 데이터 항목의 상태를 조회하거나 변경하고, 루틴 제어는 번호로 식별된 특정 절차를 실행시킨다는 점에서 역할이 구분된다."
    - question: "DTC 상태 바이트에서 testFailed 비트는 설정되었지만 confirmedDTC 비트는 아직 설정되지 않은 상태가 의미하는 바로 가장 적절한 것은?"
      choices: ["최근 테스트에서 이상이 감지되었지만 확정된 고장 조건은 아직 만족하지 못했다", "이 고장은 여러 주행 사이클에 걸쳐 이미 확정되어 경고등이 곧바로 켜지고 정비가 필요한 상태이다", "보안 접근을 통과하지 못해 진단이 거부되었다", "세션이 타임아웃되어 기본 세션으로 복귀했다"]
      answer: 0
      explanation: "testFailed는 가장 최근 테스트에서 이상이 감지되었음을 나타내지만, confirmedDTC가 설정되지 않았다면 여러 주행 사이클에 걸친 확정 조건을 아직 만족하지 못한 상태이다."
