- topic: logic-gate
  title: 논리 게이트
  section: 정리
  variants:
    - question: "NAND 게이트 두 개로 AND 게이트와 같은 동작을 만들 수 있는 원리로 가장 적절한 것은 무엇인가?"
      choices: ["NAND의 출력을 같은 입력으로 다시 NAND에 넣으면 반전이 한 번 더 걸려 AND가 된다", "NAND 게이트 두 개를 연결하면 저절로 OR 게이트로 바뀌기 때문이다", "NAND는 원래 입력이 없어도 항상 1을 출력하는 특수 게이트이기 때문이다", "NAND 게이트를 두 개 쓰면 클럭 신호가 두 배로 빨라지면서 동시에 전압 레벨도 함께 반전되어 겉보기에 AND처럼 보이기 때문이다"]
      answer: 0
      explanation: "NAND의 출력을 다시 NAND로 한 번 더 반전시키면 NOT(NOT(A AND B)) = A AND B가 되어 AND 게이트와 같은 동작이 된다."
    - question: "AND, OR, NOT, XOR 게이트의 동작 중 옳은 것은 무엇인가?"
      choices: ["XOR 게이트는 두 입력이 서로 다를 때만 출력이 1이 된다", "OR 게이트는 두 입력이 모두 1일 때만 출력이 1이 된다", "NOT 게이트는 두 개의 입력을 받아 그 합을 반전시켜 출력한다", "AND 게이트는 두 입력 중 하나라도 1이면 출력이 1이 되며, 특히 둘 다 0일 때만 예외적으로 0이 아니라 1을 출력하는 구조로 설계되어 있다"]
      answer: 0
      explanation: "XOR 게이트는 두 입력이 서로 다를 때만 1을 출력하고, 두 입력이 같으면 0을 출력한다."

- topic: combinational-logic
  title: 조합 논리 회로
  section: 정리
  variants:
    - question: "조합 논리 회로의 핵심 특징으로 가장 적절한 것은 무엇인가?"
      choices: ["클럭 신호가 올라가는 순간에만 입력을 받아들여 상태를 저장한다", "출력이 항상 입력보다 한 클럭 주기 늦게 나타나도록 설계되어 있다", "출력이 오직 현재 입력값에만 의존하며 과거 상태를 전혀 기억하지 않는다", "회로 내부에 별도의 전용 메모리 셀을 여러 개 두어 이전 열 번의 입력값을 전부 순서대로 기억해 둔다"]
      answer: 2
      explanation: "조합 논리 회로는 기억 소자가 없어 출력이 오직 현재 입력값에만 의해 결정되고 과거 상태를 전혀 반영하지 않는다."
    - question: "메모리 주소 디코더가 CPU의 주소 버스 신호를 받아 수행하는 동작으로 가장 적절한 것은 무엇인가?"
      choices: ["주소값을 그대로 데이터 버스에 복사해 CPU로 돌려보낸다", "모든 주변장치의 선택선을 동시에 전부 활성화해서 같은 값을 쓰게 한다", "버스에 실린 주소값은 전혀 해석하지 않고 그 대신 클럭 신호의 주파수를 낮추는 역할만 수행하도록 설계되어 있다", "주소 패턴을 보고 해당 번지에 연결된 하나의 모듈로 가는 선택선만 활성화한다"]
      answer: 3
      explanation: "주소 디코더는 버스에 실린 주소 패턴을 해석해, 그 번지에 연결된 정확히 하나의 하드웨어 모듈로 가는 선택선만 활성화한다."

- topic: sequential-logic
  title: 순차 논리 회로와 클럭
  section: 정리
  variants:
    - question: "플립플롭이 레지스터처럼 값을 저장할 수 있는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["플립플롭 내부에 작은 플래시 메모리 칩이 핀마다 독립적으로 여러 개씩 내장되어 있기 때문이다", "플립플롭은 전원이 꺼져도 트랜지스터가 스스로 전기를 생산하기 때문이다", "입력 신호의 전압을 항상 두 배로 증폭시켜 저장 용량을 늘리기 때문이다", "게이트 몇 개를 되먹임으로 연결해 클럭이 올라가는 순간의 입력값을 유지하기 때문이다"]
      answer: 3
      explanation: "플립플롭은 게이트들을 되먹임으로 연결해, 클럭이 상승하는 순간의 입력값을 저장하고 그 외의 시간에는 유지한다."
    - question: "MCU에서 클럭이 공통된 박자로 회로 전체에 필요한 이유로 가장 적절한 것은 무엇인가?"
      choices: ["클럭은 전력을 미리 저장해 두었다가 정전이 발생한 순간에 자동으로 회로 전체에 공급해 주는 역할을 하기 때문이다", "클럭 신호가 있어야 컴파일러가 C 코드를 기계어로 번역할 수 있기 때문이다", "클럭이 없으면 회로의 여러 부분이 각자 다른 순간에 값을 바꿔 신호 해석이 예측 불가능해지기 때문이다", "클럭은 오직 LED 깜빡임 속도를 조절하기 위한 장식적인 신호일 뿐이기 때문이다"]
      answer: 2
      explanation: "클럭이 공통 박자를 강제하지 않으면 회로의 각 부분이 제각각 다른 순간에 값을 바꿔 전체 동작을 예측할 수 없게 된다."
