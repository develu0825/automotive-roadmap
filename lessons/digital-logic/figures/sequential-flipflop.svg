<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="D 플립플롭의 클럭 저장 동작과 플립플롭으로 구성된 4비트 레지스터">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">D 플립플롭과 레지스터: 클럭이 있어야 값을 기억한다</text>

  <text x="120" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">D 플립플롭 (1비트 저장)</text>
  <rect x="50" y="70" width="140" height="80" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="120" y="116" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">D-FF</text>
  <line x1="15" y1="90" x2="50" y2="90" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="15" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">D</text>
  <line x1="190" y1="90" x2="225" y2="90" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="233" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Q</text>
  <polyline points="60,230 60,210 90,210 90,230 120,230 120,210 150,210 150,230 180,230" fill="none" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="120" y1="210" x2="120" y2="150" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="120" y="248" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">CLK</text>

  <text x="505" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">4비트 레지스터 (플립플롭 4개)</text>
  <line x1="400" y1="65" x2="400" y2="280" stroke="#8aa0c6" stroke-width="2"/>

  <rect x="420" y="60" width="170" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="505" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">bit3</text>
  <line x1="400" y1="85" x2="420" y2="85" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="85" x2="630" y2="85" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="645" y="89" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">Q3</text>

  <rect x="420" y="120" width="170" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="505" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">bit2</text>
  <line x1="400" y1="145" x2="420" y2="145" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="145" x2="630" y2="145" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="645" y="149" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">Q2</text>

  <rect x="420" y="180" width="170" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="505" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">bit1</text>
  <line x1="400" y1="205" x2="420" y2="205" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="205" x2="630" y2="205" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="645" y="209" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">Q1</text>

  <rect x="420" y="240" width="170" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="505" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">bit0</text>
  <line x1="400" y1="265" x2="420" y2="265" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="265" x2="630" y2="265" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="645" y="269" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">Q0</text>
</svg>
