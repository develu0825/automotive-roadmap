<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="AIDL Proxy/Stub와 Binder IPC 통신">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="30" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">프로세스 경계</text>
  <line x1="360" y1="50" x2="360" y2="230" stroke="#8aa0c6" stroke-width="2" stroke-dasharray="6,6"/>

  <rect x="20" y="50" width="300" height="180" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="170" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">앱 프로세스</text>

  <rect x="400" y="50" width="300" height="180" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="550" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CarService 프로세스</text>

  <rect x="70" y="130" width="200" height="60" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="170" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">Proxy</text>
  <text x="170" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(앱 쪽 대리자)</text>

  <rect x="450" y="130" width="200" height="60" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="550" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">Stub</text>
  <text x="550" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(서버 쪽 구현)</text>

  <rect x="270" y="250" width="180" height="50" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="360" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Binder (커널 IPC)</text>

  <line x1="170" y1="190" x2="300" y2="250" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="420" y1="250" x2="550" y2="190" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow2)"/>
