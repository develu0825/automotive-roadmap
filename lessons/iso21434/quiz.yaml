- topic: safety-vs-security
  title: "기능안전과 사이버보안의 차이"
  section: 정리
  variants:
    - question: "기능안전과 사이버보안이 전제하는 위험의 성격 차이로 가장 적절한 것은 무엇인가?"
      choices:
        - "기능안전은 공격자의 의도적이고 계획적인 공격 행동만을 유일한 전제로 삼고 사이버보안은 확률적 무작위 고장만 다룬다"
        - "기능안전은 무작위로 발생하는 고장을 전제하고 사이버보안은 의도를 가진 공격자의 행동을 전제한다"
        - "두 분야 모두 공격자의 능력은 시간이 지나도 변하지 않는다고 가정한다"
        - "두 분야는 서로 같은 전제 위에서 동일한 분석 절차만 수행한다"
      answer: 1
      explanation: "기능안전은 의도 없는 무작위 고장을, 사이버보안은 의도를 가진 공격자의 행동을 전제로 분석한다."
    - question: "사이버보안 분석이 기능안전의 FMEA와 달리 특히 중요하게 추적해야 하는 것으로 옳은 것은?"
      choices:
        - "부품 하나가 어떤 식으로 고장 날 수 있는지 모든 물리적 경우의 수를 전부 나열하는 것"
        - "공격자가 자산에 도달하기까지 거치는 여러 시스템에 걸친 공격 경로"
        - "반도체가 우주선에 맞아 비트가 뒤집히는 빈도"
        - "센서 노이즈로 인한 오작동 확률"
      answer: 1
      explanation: "사이버보안은 개별 부품이 아니라 공격자가 목표에 도달하는 전체 경로를 추적하는 것이 핵심이다."

- topic: tara-process
  title: "TARA 위협 분석"
  section: 정리
  variants:
    - question: "TARA에서 공격 가능성 평가와 영향 평가를 조합해 수행하는 과정으로 가장 적절한 것은 무엇인가?"
      choices:
        - "자산을 식별하는 즉시 피해 시나리오 단계 없이도 모든 위험 수준을 곧바로 확정해버리는 절차"
        - "공격 가능성과 영향을 함께 따져 사이버보안 위험을 산정하고 처리 방향을 결정하는 절차"
        - "피해 시나리오를 생략하고 공격 경로만 단독으로 평가하는 절차"
        - "장비 비용만을 기준으로 위협 등급을 매기는 절차"
      answer: 1
      explanation: "TARA는 공격 가능성과 영향을 조합해 위험을 산정하고 그에 따라 처리 방향을 결정한다."
    - question: "출시 당시 전문가 수준의 지식이 필요하다고 평가된 취약점이, 공격 도구 자동화로 인해 시간이 지나면서 바뀔 수 있는 것은 무엇인가?"
      choices:
        - "해당 취약점이 속한 자산의 물리적 위치"
        - "그 취약점의 공격 가능성 등급"
        - "ISO 26262가 정의하는 ASIL 등급 자체"
        - "차량의 제조 연월일 정보"
      answer: 1
      explanation: "공격 도구가 자동화되어 공개되면 동일한 취약점의 공격 가능성 등급이 시간이 지나며 높아질 수 있다."

- topic: csms-lifecycle
  title: "보안 수명주기와 CSMS"
  section: 정리
  variants:
    - question: "ISO/SAE 21434가 요구하는 사이버보안 관리 체계의 성격으로 가장 적절한 것은 무엇인가?"
      choices:
        - "생산 단계가 끝나고 차량이 출고되면 더 이상 점검이 필요 없는 일회성 인증 절차"
        - "개념부터 폐기까지 차량 전체 수명에 걸쳐 지속적으로 재평가되는 관리 체계"
        - "오직 소프트웨어 개발 단계에서만 적용되는 설계 지침"
        - "암호 키 주입 공정만을 다루는 생산 품질 규정"
      answer: 1
      explanation: "CSMS는 개념부터 폐기까지 차량 전체 수명에 걸쳐 지속적으로 운영되는 관리 체계다."
    - question: "차량 출고 후 새로운 취약점이 보고되었을 때 CSMS 관점에서 가장 적절한 대응은 무엇인가?"
      choices:
        - "다음 신차종 설계에만 반영하고 기존 출고 차량은 그대로 둔다"
        - "지속적인 모니터링으로 취약점을 재평가하고 필요하면 OTA 등으로 대응한다"
        - "취약점 정보를 공개하지 않고 내부 문서로만 보관한다"
        - "해당 취약점을 ISO 26262의 ASIL 등급 체계로만 재분류해서 처리하고 끝낸다"
      answer: 1
      explanation: "CSMS의 운영 및 유지보수 단계는 지속적인 모니터링과 재평가, 필요시 OTA 등을 통한 대응을 요구한다."
