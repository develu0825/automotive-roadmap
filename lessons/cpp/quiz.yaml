- topic: raii
  title: RAII와 자원 관리
  section: 정리
  variants:
    - question: "RAII 패턴에서 소멸자의 역할로 가장 적절한 것은 무엇인가?"
      choices: ["객체가 생성될 때 호출되어 초기값을 지정한다", "객체가 스코프를 벗어나는 순간 자동으로 호출되어 획득한 자원을 반납한다", "프로그램 전체가 종료될 때 단 한 번만 호출되는 함수이다", "클래스에 virtual을 붙였을 때만 컴파일러가 임의로 생성해 주는 함수로, 개발자가 직접 호출해야 동작한다"]
      answer: 1
      explanation: "RAII는 생성자에서 자원을 획득하고 소멸자가 스코프를 벗어나는 순간 자동으로 호출되어 자원을 반납하게 하는 패턴이다."
    - question: "fopen으로 연 파일을 에러 발생 시 return으로 바로 빠져나가 fclose를 호출하지 못하는 코드가 위험한 이유로 가장 적절한 것은 무엇인가?"
      choices: ["C 표준 라이브러리가 모든 파일 핸들을 추적해서 프로그램 종료 시점에 자동으로 정리해주므로 전혀 위험하지 않다", "소멸자가 없는 C 스타일 자원 관리라 모든 경로에서 수동으로 해제해야 하므로 누수가 생긴다", "fopen은 원래 메모리를 전혀 사용하지 않기 때문에 문제가 되지 않는다", "return 문은 C++에서 사용이 금지되어 있어 컴파일 오류가 발생하기 때문이다"]
      answer: 1
      explanation: "C 스타일 자원 관리는 소멸자가 없어 모든 경로에서 수동으로 fclose를 호출해야 하며, 에러 경로를 빠뜨리면 자원이 누수된다."

- topic: polymorphism
  title: 상속과 다형성
  section: 정리
  variants:
    - question: "virtual 함수와 가상 함수 테이블의 동작을 가장 적절히 설명한 것은 무엇인가?"
      choices: ["컴파일 시점에 호출할 함수가 완전히 고정되어 런타임 비용이 전혀 없다", "가상 함수는 템플릿과 똑같이 타입과 매개변수 조합마다 완전히 별도의 클래스와 함수를 컴파일 시점에 전부 새로 생성해버린다", "객체가 자신의 실제 타입에 맞는 함수 목록을 가리키는 포인터를 가져, 호출될 함수가 런타임에 결정된다", "서버에서만 동작하며 임베디드 MCU에서는 사용할 수 없는 문법이다"]
      answer: 2
      explanation: "가상 함수가 붙은 객체는 자신의 실제 타입에 맞는 함수 목록(vtable)을 가리켜, 실제로 호출될 함수가 런타임에 결정된다."
    - question: "센서 종류가 늘어나도 Sensor 참조를 받는 함수의 코드를 바꾸지 않아도 되는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["모든 센서 클래스가 동일한 메모리 주소를 공유하기 때문이다", "함수가 템플릿으로 선언되어 타입마다 별도로 자동 생성되기 때문이다", "공통 인터페이스를 상속받아 각 센서가 가상 함수로 자신만의 구현을 제공하기 때문이다", "컴파일러가 센서 종류를 미리 전부 하드코딩해서 하나의 거대한 if문으로 바꿔주기 때문이다"]
      answer: 2
      explanation: "공통 기반 클래스를 상속받고 가상 함수로 구현을 교체하면, 사용하는 쪽 코드는 구체 타입을 몰라도 올바른 동작이 실행된다."

- topic: template
  title: 템플릿과 zero-overhead 추상화
  section: 정리
  variants:
    - question: "C++ 템플릿이 런타임 오버헤드 없는 추상화라고 불리는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["실제 쓰이는 타입마다 컴파일 시점에 코드가 각각 생성되어 런타임 타입 분기가 없기 때문이다", "템플릿 코드는 실행 중에 인터프리터가 한 줄씩 해석하기 때문이다", "모든 템플릿 인스턴스가 하나의 공용 함수로 합쳐져 메모리를 아끼기 때문이다", "템플릿을 쓰면 컴파일러가 가상 함수 테이블을 자동으로 제거해 모든 함수 호출을 인라인으로 강제 변환하기 때문이다"]
      answer: 0
      explanation: "템플릿은 실제로 쓰이는 타입마다 컴파일 시점에 별도의 코드를 생성하므로, 런타임에 타입을 검사하는 비용이 들지 않는다."
    - question: "MovingAverage<int,8>과 MovingAverage<float,16>을 한 프로그램에서 함께 쓰면 생기는 현상으로 가장 적절한 것은 무엇인가?"
      choices: ["두 타입이 런타임에 하나로 합쳐져 매번 타입을 검사하는 분기가 생긴다", "서로 다른 두 개의 클래스로 각각 인스턴스화되어 코드 크기가 늘어날 수 있다", "컴파일 오류가 발생해 둘 중 하나만 선택해서 써야 한다", "int와 float 중 더 큰 타입으로 컴파일러가 자동으로 통일 변환해서 결국 하나의 코드만 공유해서 생성한다"]
      answer: 1
      explanation: "서로 다른 타입·매개변수 조합의 템플릿은 완전히 다른 클래스로 각각 인스턴스화되어, 많이 쓰면 코드 크기가 커질 수 있다."
