<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="RAII: 생성자와 소멸자로 자원을 자동 관리">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">RAII: 생성자·소멸자로 자원 수명 관리</text>

  <rect x="270" y="50" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="83" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">생성자: 자원 획득</text>

  <line x1="360" y1="105" x2="360" y2="140" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="140" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="173" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">객체 사용 중</text>

  <line x1="330" y1="195" x2="190" y2="225" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="195" x2="530" y2="225" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="90" y="225" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="180" y="258" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">정상 종료</text>

  <rect x="450" y="225" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="540" y="258" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">에러로 조기 return</text>

  <line x1="200" y1="280" x2="330" y2="310" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="280" x2="390" y2="310" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="310" width="180" height="55" rx="10" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="360" y="338" fill="#b794f6" font-family="sans-serif" font-size="16" text-anchor="middle">소멸자 자동 호출</text>
  <text x="360" y="358" fill="#b794f6" font-family="sans-serif" font-size="15" text-anchor="middle">자원 반납 보장</text>
</svg>
