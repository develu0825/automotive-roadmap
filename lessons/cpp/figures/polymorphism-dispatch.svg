<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="상속과 다형성: 기반 클래스와 파생 클래스, 런타임 동적 호출">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
  </defs>
  <text x="360" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">상속과 다형성: 같은 호출, 다른 구현</text>

  <rect x="270" y="50" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="73" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">Sensor (기반 클래스)</text>
  <text x="360" y="93" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">virtual read()</text>

  <line x1="330" y1="105" x2="195" y2="158" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="105" x2="525" y2="158" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="225" y="130" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">상속</text>
  <text x="495" y="130" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">상속</text>

  <rect x="90" y="160" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="180" y="183" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">RadarSensor</text>
  <text x="180" y="203" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">read() override</text>

  <rect x="450" y="160" width="180" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="540" y="183" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">CameraSensor</text>
  <text x="540" y="203" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">read() override</text>

  <line x1="330" y1="280" x2="195" y2="217" stroke="#38bdf8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="390" y1="280" x2="525" y2="217" stroke="#38bdf8" stroke-width="2" marker-end="url(#b)"/>

  <rect x="270" y="280" width="180" height="55" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="303" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">printReading(Sensor&amp;)</text>
  <text x="360" y="323" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">s.read() → 런타임에 결정</text>
</svg>
