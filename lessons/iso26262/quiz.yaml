- topic: asil
  title: "ASIL 등급 산정"
  section: 정리
  variants:
    - question: "어떤 위험이 S3, E4, C3로 평가되었을 때 이 위험이 받게 될 ASIL 등급으로 가장 적절한 것은?"
      choices: ["QM으로 분류되어 ISO 26262의 엄격한 요구사항을 전혀 적용받지 않을 가능성이 가장 크다", "ASIL D로 분류되어 가장 엄격한 수준의 설계·검증이 요구된다", "ASIL A로 분류되어 단순한 점검만으로 충분하다", "심각도 하나만으로는 등급을 정할 수 없어 분류 자체가 영구히 보류된다"]
      answer: 1
      explanation: "심각도·노출도·통제가능성이 모두 가장 위험한 쪽(S3, E4, C3)으로 평가되면 가장 엄격한 등급인 ASIL D에 해당할 가능성이 매우 높다."
    - question: "ASIL 분해(decomposition)에서 하나의 안전 목표를 두 개의 독립적인 메커니즘으로 나누어 각각 더 낮은 등급으로 구현할 수 있는 전제 조건으로 옳은 것은?"
      choices: ["두 메커니즘이 같은 원인으로 동시에 고장 나지 않는다는 독립성이 엄격히 입증되어야 한다", "두 메커니즘이 같은 전원과 같은 소프트웨어 버그를 공유해도 무방하며 별도의 입증 절차는 필요하지 않다", "두 메커니즘 모두 반드시 ASIL D로 구현되어야 분해가 성립한다", "분해는 하드웨어 메커니즘에는 적용할 수 없다"]
      answer: 0
      explanation: "ASIL 분해가 타당하려면 두 메커니즘이 같은 원인으로 동시에 실패하지 않는다는 독립성이 공통 원인 고장 분석을 통해 엄격히 입증되어야 한다."

- topic: fmea-rpn
  title: "FMEA와 위험 우선순위 수"
  section: 정리
  variants:
    - question: "FMEA에서 심각도 8, 발생빈도 3, 검출난이도 7인 고장 모드의 RPN 값과 그 활용 방식으로 옳은 것은?"
      choices: ["RPN은 18이며 세 항목을 더한 값으로 이 값이 낮을수록 먼저 개선해야 할 대상으로 다룬다", "RPN은 168이며 이 값이 클수록 더 우선적으로 개선해야 할 대상으로 다룬다", "RPN은 56이며 두 항목만 곱한 값이다", "RPN은 고장 모드와 무관하게 항상 고정된 값이다"]
      answer: 1
      explanation: "RPN은 심각도·발생빈도·검출난이도를 곱해 계산하며(8x3x7=168), 이 값이 큰 고장 모드일수록 제한된 개발 자원을 먼저 투입해야 할 우선순위가 높다."
    - question: "FMEA가 안전 분석에서 수행하는 역할로 가장 적절한 것은?"
      choices: ["고장 모드·영향·원인·검출 가능성을 체계적으로 정리해 개선 우선순위를 매긴다", "소프트웨어 코드의 MISRA C 준수 여부와 정적 분석 경고를 자동으로 모두 해결해 주는 코드 수정 도구이다", "OTA 배포 시 차량군의 진행 상황만 추적한다", "보안 접근 인증 절차만 수행한다"]
      answer: 0
      explanation: "FMEA는 가능한 고장 모드와 그 영향·원인·검출 가능성을 체계적으로 정리하고 RPN으로 우선순위를 매겨 개발 자원을 배분하는 데 쓰인다."

- topic: safety-lifecycle
  title: "FTTI와 안전 수명주기"
  section: 정리
  variants:
    - question: "EPS 조향력 상실 후 300 밀리초 안에 차선 이탈이 시작되는데 안전 메커니즘이 고장 검출과 전환에 150 밀리초가 걸린다면 FTTI 관점에서 이 설계에 대한 평가로 옳은 것은?"
      choices: ["150 밀리초가 FTTI인 300 밀리초보다 짧으므로 시간적으로는 적절하다고 볼 수 있다", "150 밀리초는 FTTI 개념과 무관한 값이므로 안전 여부를 전혀 판단할 수 없고 추가 분석도 불필요하다", "150 밀리초가 FTTI를 넘겼으므로 즉시 재설계해야 한다", "검출 시간이 길수록 항상 더 안전하다고 평가된다"]
      answer: 0
      explanation: "FTTI는 고장이 사고로 이어지기 전까지 안전 상태로 전환을 완료해야 하는 최대 허용 시간이므로, 150 밀리초는 300 밀리초보다 짧아 시간적으로 적절하다."
    - question: "ISO 26262의 V 모델 안전 수명주기에서 안전 목표(Safety Goal)가 도출되는 시점으로 옳은 것은?"
      choices: ["HARA를 통해 위험 상황을 식별하고 ASIL을 할당한 뒤에 도출된다", "소프트웨어 구현이 완료되고 정적 분석 도구의 모든 경고가 해소된 이후에만 거꾸로 도출된다", "FMEA의 RPN 계산이 끝난 뒤 자동으로 생성된다", "정적 분석 도구가 코드에서 자동으로 추출한다"]
      answer: 0
      explanation: "안전 목표는 HARA 과정에서 위험 상황을 식별하고 심각도·노출도·통제가능성을 평가해 ASIL을 할당한 뒤, 그 위험을 피하기 위한 최상위 목표로 도출된다."
