<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="두 프로세스의 가상 주소가 MMU를 통해 서로 다른 물리 메모리 영역으로 변환되는 모습">
  <defs>
    <marker id="arrow-vm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">가상 메모리를 통한 프로세스 격리</text>

  <rect x="60" y="55" width="240" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="180" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">프로세스 A</text>
  <text x="180" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">가상 주소 0x1000</text>

  <rect x="420" y="55" width="240" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="540" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">프로세스 B</text>
  <text x="540" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">가상 주소 0x1000</text>

  <rect x="300" y="160" width="120" height="60" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="182" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">MMU</text>
  <text x="360" y="204" fill="#38bdf8" font-family="sans-serif" font-size="14" text-anchor="middle">주소 변환</text>

  <line x1="180" y1="125" x2="330" y2="160" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow-vm)"/>
  <line x1="540" y1="125" x2="390" y2="160" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow-vm)"/>
  <line x1="330" y1="220" x2="250" y2="260" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow-vm)"/>
  <line x1="390" y1="220" x2="470" y2="260" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow-vm)"/>

  <text x="360" y="248" fill="#cbd5e1" font-family="sans-serif" font-size="14" text-anchor="middle">물리 메모리 (하드웨어)</text>
  <rect x="140" y="260" width="440" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <line x1="360" y1="260" x2="360" y2="320" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="250" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">A 전용 영역</text>
  <text x="470" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">B 전용 영역</text>
</svg>
