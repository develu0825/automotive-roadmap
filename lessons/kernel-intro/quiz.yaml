- topic: kernel-user-space
  title: "커널 공간과 유저 공간"
  section: 정리
  variants:
    - question: "커널 공간과 유저 공간을 나누는 근본적인 목적으로 가장 적절한 것은?"
      choices:
        - "컴파일 시간을 단축하기 위해 소스 코드를 커널용과 유저용 두 영역으로 미리 나누어 저장하는 것이다"
        - "한 프로그램의 버그가 다른 프로세스나 커널로 퍼지지 않도록 하드웨어로 특권을 제한하는 것이다"
        - "프로그램의 실행 속도를 두 배로 높이기 위한 것이다"
        - "디스크 용량을 절약하기 위한 것이다"
      answer: 1
      explanation: "CPU의 특권 등급 하드웨어로 커널 공간과 유저 공간을 나누어, 한 애플리케이션의 버그가 시스템 전체로 퍼지는 것을 막는다."
    - question: "유저 공간 프로그램이 할 수 없는 일로 옳은 것은?"
      choices:
        - "자신에게 할당되지 않은 물리 메모리 영역에 직접 접근하는 것"
        - "지역 변수를 선언하는 것"
        - "함수를 호출하고 반환값을 받는 것"
        - "시스템 콜이라는 특수한 호출 절차를 통해 커널에게 파일 읽기 작업을 대신 요청하는 것"
      answer: 0
      explanation: "유저 모드에서는 자신에게 할당된 메모리 밖은 접근할 수 없고, 하드웨어도 직접 건드릴 수 없다."
- topic: syscall-process-isolation
  title: "시스템 콜과 프로세스 격리"
  section: 정리
  variants:
    - question: "시스템 콜에 대한 설명으로 옳은 것은?"
      choices:
        - "유저 공간 프로그램이 하드웨어나 커널 자원이 필요한 작업을 커널에게 요청하는 통로다"
        - "커널이 유저 프로그램을 감시하기 위해 몰래 실행하는 코드다"
        - "컴파일러가 소스 코드를 기계어로 번역하는 과정에서 내부적으로만 사용하는 임시 함수다"
        - "두 유저 프로세스가 직접 메모리를 공유하는 방식이다"
      answer: 0
      explanation: "시스템 콜은 유저 공간 프로그램이 특권 등급을 커널 모드로 전환시켜 커널에게 작업을 요청하는 유일한 통로다."
    - question: "MMU와 가상 메모리가 프로세스 간에 보장해 주는 것을 고른 것은?"
      choices:
        - "한 프로세스가 다른 프로세스에 할당된 물리 메모리를 침범하면 즉시 감지되어 격리된다"
        - "모든 프로세스가 CPU 코어 하나를 돌아가며 항상 완전히 동일한 속도로 실행되도록 강제한다"
        - "프로세스 간에 자동으로 데이터가 동기화된다"
        - "디스크에 저장된 파일이 자동으로 암호화된다"
      answer: 0
      explanation: "MMU는 프로세스가 할당되지 않은 물리 메모리에 접근하면 즉시 감지해 커널에게 알리고, 커널은 그 프로세스를 종료시킨다."
- topic: cfs-vs-rtos
  title: "CFS와 RTOS 스케줄링"
  section: 정리
  variants:
    - question: "리눅스 CFS 스케줄러가 추구하는 목표로 가장 적절한 것은?"
      choices:
        - "모든 프로세스가 장기적으로 CPU 시간을 공평하게 나눠 갖도록 하는 것이다"
        - "특정 태스크가 반드시 정해진 시한 안에 끝난다는 수학적 보장을 제공하는 것이다"
        - "모든 프로세스를 우선순위 순서대로만 실행해 가장 중요한 것이 항상 먼저 끝나게 하는 것이다"
        - "CPU 코어 수를 늘리는 것이다"
      answer: 0
      explanation: "CFS는 모든 프로세스가 CPU 시간을 공평하게 나눠 갖는 것을 목표로 하며, RTOS의 데드라인 보장과는 성격이 다르다."
    - question: "엔진 점화 타이밍처럼 수백 마이크로초 단위의 데드라인이 걸린 로직을 일반 리눅스 프로세스로 구현하기 어려운 이유로 옳은 것은?"
      choices:
        - "CFS는 공정한 분배를 목표로 할 뿐 특정 프로세스의 실행 시한을 수학적으로 보장하지 않기 때문이다"
        - "리눅스는 C 언어로 작성된 프로그램을 실행할 수 없기 때문이다"
        - "유저 공간 프로세스는 CPU를 전혀 사용할 수 없기 때문이다"
        - "커널이 모든 프로세스를 아무 규칙 없이 완전히 무작위적인 순서로만 실행하도록 설계되어 있기 때문이다"
      answer: 0
      explanation: "CFS는 공정성만 추구할 뿐 특정 시한 안에 반드시 끝난다는 보장을 제공하지 않아, 엄격한 데드라인 로직은 RTOS나 베어메탈이 담당한다."
