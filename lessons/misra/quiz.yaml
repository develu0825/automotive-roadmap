- topic: undefined-behavior
  title: "정의되지 않은 동작과 구현 정의 동작"
  section: 정리
  variants:
    - question: "C 표준에서 정의되지 않은 동작(Undefined Behavior)이 구현 정의 동작(Implementation-Defined Behavior)보다 더 위험하게 여겨지는 이유로 가장 적절한 것은?"
      choices: ["표준이 결과를 전혀 규정하지 않아 컴파일러 버전이나 최적화에 따라 결과가 달라질 수 있다", "구현 정의 동작은 결과가 아예 존재하지 않는 반면 정의되지 않은 동작은 항상 같은 값을 안정적으로 돌려주기 때문이다", "구현 정의 동작은 MISRA C의 검사 대상이 아니기 때문이다", "정의되지 않은 동작은 항상 컴파일 오류로 걸러진다"]
      answer: 0
      explanation: "정의되지 않은 동작은 표준이 결과를 전혀 규정하지 않으므로, 같은 코드라도 컴파일러 버전이나 최적화 수준에 따라 전혀 다른 결과가 나올 수 있어 위험하다."
    - question: "'int16_t result = base * 200;' 코드에서 base가 200보다 큰 값일 때 발생할 수 있는 문제로 옳은 것은?"
      choices: ["곱셈 결과가 int16_t 표현 범위를 넘어서는 부호 있는 정수 오버플로우로 정의되지 않은 동작이 된다", "컴파일 시점에 항상 오류로 검출되어 실행 자체가 모든 플랫폼에서 완전히 불가능해지므로 오히려 더 안전해진다", "결과가 자동으로 0으로 고정되어 항상 안전하게 처리된다", "base의 타입이 자동으로 int32_t로 바뀌어 문제가 생기지 않는다"]
      answer: 0
      explanation: "base가 200보다 크면 곱셈 결과가 int16_t의 표현 범위를 넘어서는 부호 있는 정수 오버플로우가 되어 C 표준상 정의되지 않은 동작으로 처리된다."

- topic: directive-rule-classification
  title: "지침·규칙과 준수 등급"
  section: 정리
  variants:
    - question: "MISRA C의 지침(Directive)과 규칙(Rule)을 구분하는 기준으로 가장 적절한 것은?"
      choices: ["지침은 설계 의도나 맥락을 함께 고려해야 하고 규칙은 코드만으로 기계적으로 판단할 수 있다", "지침은 항상 Mandatory 등급만 가지고 규칙은 항상 Advisory 등급만 가지도록 표준에 고정되어 있다고 알려져 있다", "지침은 하드웨어에만 적용되고 규칙은 소프트웨어에만 적용된다", "지침과 규칙은 서로 바꿔 써도 무방한 동의어이다"]
      answer: 0
      explanation: "지침은 코드만 보고는 기계적으로 판단할 수 없어 설계 의도와 맥락을 함께 고려해야 하고, 규칙은 코드 패턴만으로 위반 여부를 판단할 수 있다는 점에서 구분된다."
    - question: "MISRA C의 Mandatory, Required, Advisory 세 등급 중 Required 등급 규칙을 위반해도 되는 경우로 옳은 것은?"
      choices: ["정당한 기술적 근거와 문서화를 거쳐 일탈(deviation)로 승인받은 경우에 한해 허용될 수 있다", "일정이 부족하다는 이유만으로도 별도 절차와 리뷰어 승인 없이 언제든지 자유롭게 위반해도 전혀 문제가 되지 않는다", "Required는 Mandatory와 같아 어떤 이유로도 위반이 불가능하다", "코드만 수정하면 자동으로 예외가 인정된다"]
      answer: 0
      explanation: "Required 등급은 반드시 지켜야 하지만, 정당한 기술적 근거를 문서화하고 리뷰어의 승인을 거친 일탈(deviation) 절차를 통해서만 예외가 허용될 수 있다."

- topic: static-analysis-deviation
  title: "정적 분석과 일탈 관리"
  section: 정리
  variants:
    - question: "정적 분석 도구가 undecidable 규칙(예: 모든 경로에서 변수가 사용 전에 초기화되는지)을 다룰 때 취하는 전략으로 가장 적절한 것은?"
      choices: ["확실한 위반과 위반 가능성이 있는 경고를 구분하고 애매한 경우는 과잉 경고를 내는 보수적인 방향을 택한다", "모든 가능한 실행 경로와 입력값의 조합을 완전히 분석해 어떤 경우에도 100%의 정확도로 위반 여부를 항상 확정할 수 있다", "판단이 어려운 경우는 모두 무시하고 경고를 내지 않는다", "undecidable 규칙은 검사 대상에서 제외된다"]
      answer: 0
      explanation: "undecidable 규칙은 모든 실행 경로를 완전히 분석하는 것이 불가능하므로, 정적 분석 도구는 놓치기보다는 과잉 경고를 내는 보수적인 전략을 쓴다."
    - question: "재귀로 작성된 함수가 MISRA C의 재귀 금지 규칙(Required)에 위반된다는 것을 알면서도 그대로 출시하려 할 때 절차적으로 허용되기 위해 필요한 것으로 옳은 것은?"
      choices: ["스택 사용량이 계산 가능하고 한계 내에 있다는 구체적 분석과 리뷰어 승인을 포함한 일탈 문서화가 필요하다", "출시 일정이 촉박하다는 사실만 간단히 보고서에 적어 두면 그 외 어떤 추가 분석이나 리뷰어 승인 절차도 전혀 거치지 않아도 충분하다", "재귀 금지는 Advisory 등급이라 무시해도 된다", "정적 분석 도구의 버전을 낮추면 위반이 사라진다"]
      answer: 0
      explanation: "일정 부족은 정당한 기술적 근거가 되지 못하며, 스택 사용량이 한계 내에 있다는 구체적 분석과 리뷰어 승인을 포함한 일탈 문서화가 있어야 절차적으로 허용될 수 있다."
