<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Android Auto와 Android Automotive OS의 구조 차이">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Android Auto vs Android Automotive OS</text>

  <rect x="50" y="50" width="190" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="145" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">스마트폰 (연산 수행)</text>
  <line x1="240" y1="75" x2="300" y2="75" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="50" width="200" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="400" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">차량 디스플레이 (투사만)</text>
  <text x="610" y="80" fill="#f59e0b" font-family="sans-serif" font-size="16" text-anchor="middle">Android Auto</text>

  <rect x="50" y="150" width="230" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="165" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">차량 SoC</text>
  <text x="165" y="197" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(안드로이드 직접 구동)</text>
  <line x1="280" y1="180" x2="340" y2="180" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="340" y="150" width="200" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="440" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">클러스터 / IVI</text>
  <text x="440" y="197" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">디스플레이</text>
  <text x="610" y="180" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">AAOS</text>
</svg>
