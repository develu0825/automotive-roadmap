<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="AAOS의 멀티 디스플레이와 occupant zone 구조">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">AAOS 멀티 디스플레이 / Occupant Zone</text>

  <rect x="260" y="50" width="200" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">차량 SoC</text>
  <text x="360" y="97" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(AAOS 1개 인스턴스)</text>

  <line x1="300" y1="110" x2="130" y2="180" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="110" x2="360" y2="180" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="110" x2="590" y2="180" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="180" width="180" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="130" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Display #0</text>
  <text x="130" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Cluster (운전자 전용)</text>

  <rect x="270" y="180" width="180" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Display #1</text>
  <text x="360" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">IVI (공용)</text>

  <rect x="500" y="180" width="180" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="590" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Display #2</text>
  <text x="590" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Rear seat (승객용)</text>
</svg>
