- topic: char-vs-block-device
  title: "캐릭터와 블록 디바이스"
  section: 정리
  variants:
    - question: "캐릭터 디바이스와 블록 디바이스의 차이로 옳은 것은?"
      choices:
        - "캐릭터 디바이스는 순서대로 흘러가는 스트림을 다루고 블록 디바이스는 고정 크기 블록 단위로 임의 접근한다"
        - "캐릭터 디바이스만 인터럽트를 사용할 수 있다"
        - "블록 디바이스는 major/minor number 같은 식별 체계를 아예 사용하지 않고 오직 이름 문자열만으로 장치를 구분한다"
        - "캐릭터 디바이스는 커널 모듈로 작성할 수 없다"
      answer: 0
      explanation: "캐릭터 디바이스는 스트림처럼 순서대로 다뤄지고, 블록 디바이스는 고정 크기 블록 단위로 임의 접근이 가능한 장치다."
    - question: "온도 센서와 eMMC 저장장치를 각각 캐릭터/블록 디바이스에 대응시킬 때 가장 적절한 것은?"
      choices:
        - "온도 센서는 스트림처럼 값을 읽는 캐릭터 디바이스에, eMMC는 임의 접근이 필요한 블록 디바이스에 대응된다"
        - "온도 센서는 임의 접근이 필요한 블록 디바이스에, eMMC는 순서대로 흘러가는 스트림을 다루는 캐릭터 디바이스에 대응된다"
        - "둘 다 항상 블록 디바이스로만 다뤄야 한다"
        - "둘 다 네트워크 디바이스로 다뤄야 한다"
      answer: 0
      explanation: "온도 센서는 순서대로 값을 읽는 스트림 모델이 자연스러워 캐릭터 디바이스에, eMMC는 임의 접근이 필요해 블록 디바이스에 대응된다."
- topic: interrupt-top-bottom-half
  title: "인터럽트와 top/bottom half"
  section: 정리
  variants:
    - question: "인터럽트 핸들러(top half) 안에서 피해야 하는 동작으로 옳은 것은?"
      choices:
        - "뮤텍스 획득처럼 잠들 수 있는(sleep) 동작"
        - "레지스터에서 값을 빠르게 읽는 동작"
        - "IRQ_HANDLED를 반환하는 동작"
        - "workqueue나 tasklet에 나중에 처리할 작업을 등록해 두는 동작"
      answer: 0
      explanation: "인터럽트 컨텍스트에서는 sleep이 금지되므로, 뮤텍스 획득처럼 잠들 수 있는 동작은 핸들러 안에서 피해야 한다."
    - question: "인터럽트 처리를 top half와 bottom half로 나누는 이유로 가장 적절한 것은?"
      choices:
        - "인터럽트 핸들러를 짧게 유지해 다른 인터럽트가 지연되거나 손실되는 것을 막기 위해서다"
        - "두 개의 서로 완전히 다른 프로그래밍 언어와 컴파일러를 매번 동시에 함께 사용해야 하기 때문이다"
        - "커널 모듈의 파일 크기를 줄이기 위해서다"
        - "DMA 컨트롤러의 전원을 절약하기 위해서다"
      answer: 0
      explanation: "top half를 짧게 유지하고 무거운 작업을 bottom half로 미루면, 핸들러가 길어져 다른 인터럽트를 놓치는 문제를 막을 수 있다."
- topic: dma-cache-coherency
  title: "DMA와 캐시 일관성"
  section: 정리
  variants:
    - question: "DMA(Direct Memory Access)를 사용하는 이유로 가장 적절한 것은?"
      choices:
        - "CPU 개입 없이 DMA 컨트롤러가 메모리와 주변장치 사이에서 데이터를 직접 옮겨 CPU 부담을 줄인다"
        - "커널 모듈을 자동으로 컴파일한다"
        - "핀 뮤잉 레지스터를 자동으로 설정한다"
        - "디바이스 트리 노드를 보드 리비전이 바뀔 때마다 매번 자동으로 새로 생성해서 저장장치에 기록해 둔다"
      answer: 0
      explanation: "DMA는 DMA 컨트롤러가 CPU 개입 없이 메모리와 주변장치 사이에서 데이터를 직접 옮겨 CPU 자원 소모를 줄이는 메커니즘이다."
    - question: "DMA 사용 시 항상 신경 써야 하는 캐시 일관성 문제의 원인으로 옳은 것은?"
      choices:
        - "CPU가 캐시에 들고 있는 값과 DMA 컨트롤러가 직접 바꾼 메모리 값이 서로 어긋날 수 있기 때문이다"
        - "인터럽트 핸들러가 너무 짧게 작성되었기 때문이다"
        - "커널 모듈이 아직 insmod로 로드되지 않았기 때문이다"
        - "핀 뮤잉 설정이 하드웨어 설계자의 실제 배선 의도와 완전히 다르게 엉뚱하게 지정되어 있기 때문이다"
      answer: 0
      explanation: "DMA 컨트롤러가 CPU 캐시를 거치지 않고 메모리를 직접 바꾸면, CPU가 캐시에 남은 옛 값을 계속 읽는 캐시 일관성 문제가 생길 수 있다."
