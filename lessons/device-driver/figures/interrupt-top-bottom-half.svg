<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="인터럽트 처리에서 Top Half와 Bottom Half의 컨텍스트 분리">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>

  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Top Half / Bottom Half의 컨텍스트 분리</text>

  <!-- Context zones -->
  <rect x="20" y="50" width="330" height="200" rx="10" fill="#0d1526" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="370" y="50" width="330" height="200" rx="10" fill="#0d1526" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="185" y="270" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">인터럽트 컨텍스트 (sleep 금지)</text>
  <text x="535" y="270" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">프로세스 컨텍스트 (sleep 가능)</text>

  <!-- Box A: hardware -->
  <rect x="60" y="80" width="250" height="55" rx="10" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="185" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">하드웨어 인터럽트 발생</text>
  <text x="185" y="123" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(CAN 컨트롤러 프레임 수신)</text>

  <!-- Box B: top half -->
  <rect x="60" y="165" width="250" height="55" rx="10" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="185" y="189" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Top Half: IRQ 핸들러</text>
  <text x="185" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(레지스터 read, 큐에 enqueue)</text>

  <!-- Box C: bottom half -->
  <rect x="410" y="120" width="250" height="55" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="535" y="144" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Bottom Half: workqueue</text>
  <text x="535" y="163" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(SocketCAN 상위 스택 전달)</text>

  <!-- Arrows -->
  <line x1="185" y1="135" x2="185" y2="165" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">IRQ 발생</text>

  <line x1="310" y1="192" x2="410" y2="147" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">schedule_work()</text>
</svg>
