<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="테스트 피라미드: 유닛, 통합, 시스템 테스트">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">테스트 피라미드</text>

  <rect x="260" y="60" width="200" height="70" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">시스템 테스트 (System)</text>
  <text x="360" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">적고 느림, 실제 환경</text>

  <rect x="180" y="150" width="360" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="178" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">통합 테스트 (Integration)</text>
  <text x="360" y="198" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">모듈 간 인터페이스 검증</text>

  <rect x="100" y="240" width="520" height="70" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="360" y="268" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">유닛 테스트 (Unit)</text>
  <text x="360" y="288" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">가장 많고 빠르며, 결함 위치를 정확히 짚어냄</text>
</svg>
