- topic: test-pyramid-vv
  title: "검증·확인과 테스트 피라미드"
  section: 정리
  variants:
    - question: "검증(Verification)과 확인(Validation)의 차이로 가장 적절한 것은?"
      choices: ["검증은 요구사항을 올바르게 구현했는가를 묻고 확인은 올바른 요구사항을 만들었는가를 묻는다", "검증과 확인은 완전히 같은 의미이며 ISO 26262에서는 이 둘을 구분하지 않고 항상 하나의 절차로만 함께 다룬다", "검증은 하드웨어에만, 확인은 소프트웨어에만 적용된다", "확인은 유닛 테스트만, 검증은 HIL 테스트만 가리킨다"]
      answer: 0
      explanation: "검증은 요구사항대로 구현했는지(did we build it right)를 묻고, 확인은 그 요구사항 자체가 올바른 요구사항인지(did we build the right thing)를 묻는다."
    - question: "테스트 피라미드에서 유닛 테스트 단계에서 결함을 걸러내는 것이 시스템 테스트 단계까지 끌고 가는 것보다 유리한 이유로 옳은 것은?"
      choices: ["유닛 테스트는 결함의 위치를 빠르게 짚어내고 적은 비용으로 반복 실행할 수 있기 때문이다", "유닛 테스트는 반드시 실제 ECU 하드웨어와 실시간 시뮬레이터를 모두 갖춘 뒤에만 수행할 수 있기 때문이다", "시스템 테스트가 유닛 테스트보다 항상 더 빠르고 저렴하다", "유닛 테스트에서는 결함을 발견해도 원인을 알 수 없다"]
      answer: 0
      explanation: "유닛 테스트는 모듈을 분리해 빠르게 많은 횟수를 실행할 수 있고 결함의 위치를 정확히 짚어낼 수 있어, 시스템 테스트 단계까지 결함을 끌고 가는 것보다 비용이 적게 든다."

- topic: coverage-mcdc
  title: "코드 커버리지와 MC/DC"
  section: 정리
  variants:
    - question: "분기 커버리지 100%를 달성했다는 보고만으로 이 모듈이 요구사항을 모두 충족한다고 결론 내릴 수 없는 이유로 가장 적절한 것은?"
      choices: ["요구사항에 있어야 할 코드가 통째로 빠진 경우는 애초에 커버리지 측정 대상에 포함되지 않기 때문이다", "분기 커버리지는 MC/DC보다 항상 더 엄격한 기준이며 동시에 구문 커버리지보다도 훨씬 느슨한 기준이기 때문이다", "분기 커버리지 100%는 구문 커버리지가 0%임을 의미한다", "분기 커버리지는 ASIL 등급과 아무 관련이 없다"]
      answer: 0
      explanation: "분기 커버리지는 코드에 작성된 분기가 실행되었는지만 측정하며, 요구사항에 있어야 할 코드가 빠진 경우는 애초에 커버리지 계산에 포함되지 않는다."
    - question: "복합 조건 'if ((speed > 100) and (gear == PARK) and not brake_active)'처럼 세 개의 독립 조건이 결합된 조건문에서 MC/DC가 분기 커버리지보다 더 엄격하게 요구하는 것은 무엇인가?"
      choices: ["각 개별 조건이 다른 조건은 고정한 채 혼자 바뀌었을 때 전체 결정 결과도 함께 바뀜을 보여주는 테스트 케이스를 요구한다", "모든 조건이 항상 동시에 참이 되는 테스트 케이스 하나만 반복해서 여러 번 수행하면 충분하다고 간주하며 추가 분석은 필요하지 않다고 본다", "전체 조건문이 참인 경우와 거짓인 경우 각 하나씩만 요구한다", "조건문 안 변수 이름이 모두 소문자인지만 검사한다"]
      answer: 0
      explanation: "MC/DC는 분기 커버리지와 달리 각 개별 조건이 독립적으로 전체 결정 결과에 영향을 미친다는 것을 보여주는 테스트 케이스 쌍을 모든 조건에 대해 요구한다."

- topic: sil-hil-blackbox
  title: "SIL·HIL 루프 테스트와 블랙박스 설계"
  section: 정리
  variants:
    - question: "SIL(Software-in-the-Loop)과 HIL(Hardware-in-the-Loop)의 차이로 가장 적절한 것은?"
      choices: ["SIL은 실제 타겟 하드웨어 없이 PC에서 코드 로직을 검증하고 HIL은 실제 ECU 하드웨어를 실시간 시뮬레이터와 연결해 검증한다", "SIL은 반드시 실제 ECU 하드웨어와 실제 배선이 모두 갖춰진 환경에서만 수행 가능하고 HIL은 수학적 모델만 있으면 되어 하드웨어가 전혀 필요하지 않다는 점이 다르다", "SIL과 HIL은 모두 수학적 모델 상태에서만 수행된다", "HIL은 유닛 테스트를 대체하는 가장 저렴한 방법이다"]
      answer: 0
      explanation: "SIL은 실제 타겟 하드웨어 없이 개발 PC에서 코드의 로직 정확성을 빠르게 검증하고, HIL은 실제 ECU 하드웨어를 실시간 시뮬레이터와 연결해 하드웨어·타이밍 관련 문제를 검증한다."
    - question: "제동 압력 계산 함수의 입력값 pedal_pos에 대해 음수와 0 이상의 유효한 범위 두 그룹으로 나누고 각 그룹을 대표하는 값만 테스트하는 기법의 이름으로 옳은 것은?"
      choices: ["동등 분할이며, 비슷하게 동작할 것으로 예상되는 입력을 그룹으로 묶어 대표값만 테스트한다", "MC/DC이며, 복합 조건문의 각 개별 조건이 독립적으로 전체 결과에 영향을 미치는지를 모든 조합에 대해 검사한다", "HIL 테스트이며, 실제 ECU와 실시간 시뮬레이터를 연결한다", "정적 분석이며, 코드를 실행하지 않고 구문만 검사한다"]
      answer: 0
      explanation: "입력값을 비슷하게 동작할 것으로 예상되는 그룹으로 나누고 그룹마다 대표값 하나씩만 테스트하는 기법은 동등 분할이며, 경계값 분석과 함께 블랙박스 테스트 설계에 쓰인다."
