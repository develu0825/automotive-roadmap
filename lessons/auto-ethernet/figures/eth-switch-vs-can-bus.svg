<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="CAN 버스 중재와 이더넷 패킷 스위칭 방식 비교">
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">버스 중재(CAN) vs 패킷 스위칭(이더넷)</text>

  <text x="180" y="55" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">CAN: 공유 버스 (중재)</text>
  <rect x="70" y="75" width="70" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="105" y="99" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ECU1</text>
  <rect x="145" y="75" width="70" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="180" y="99" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ECU2</text>
  <rect x="220" y="75" width="70" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="255" y="99" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ECU3</text>

  <line x1="60" y1="160" x2="300" y2="160" stroke="#8aa0c6" stroke-width="3"/>
  <line x1="105" y1="115" x2="105" y2="160" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="180" y1="115" x2="180" y2="160" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="255" y1="115" x2="255" y2="160" stroke="#8aa0c6" stroke-width="2"/>

  <text x="180" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">모든 노드가 선로 하나 공유</text>
  <text x="180" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">→ 총 대역폭 고정</text>

  <text x="540" y="55" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">이더넷: 스위치 (패킷)</text>
  <rect x="500" y="75" width="80" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="540" y="99" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">카메라1</text>

  <rect x="490" y="140" width="100" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="540" y="169" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">이더넷 스위치</text>

  <rect x="420" y="205" width="80" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="460" y="229" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">카메라2</text>

  <rect x="580" y="205" width="80" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="620" y="229" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">카메라3</text>

  <line x1="540" y1="115" x2="540" y2="140" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="460" y1="205" x2="490" y2="190" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="620" y1="205" x2="590" y2="190" stroke="#8aa0c6" stroke-width="2"/>

  <text x="540" y="262" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">각 노드가 전용 링크로 동시에 전체 속도 전송</text>
</svg>
