<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="존 아키텍처: 존 컨트롤러와 백본, 중앙 컴퓨팅 유닛">
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">존(Zone) 아키텍처: 위치 기반 통합</text>

  <rect x="290" y="130" width="140" height="60" rx="8" fill="#111a2e" stroke="#b794f6" stroke-width="2"/>
  <text x="360" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">중앙 컴퓨팅</text>
  <text x="360" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">유닛</text>

  <rect x="60" y="30" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="135" y="59" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">전방-좌 존</text>

  <rect x="510" y="30" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="585" y="59" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">전방-우 존</text>

  <rect x="60" y="240" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="135" y="269" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">후방-좌 존</text>

  <rect x="510" y="240" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="585" y="269" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">후방-우 존</text>

  <line x1="210" y1="80" x2="290" y2="130" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="510" y1="80" x2="430" y2="130" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="210" y1="240" x2="290" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="510" y1="240" x2="430" y2="190" stroke="#38bdf8" stroke-width="2.5"/>

  <text x="360" y="215" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">백본 (Automotive Ethernet)</text>

  <line x1="90" y1="80" x2="90" y2="100" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="130" y1="80" x2="130" y2="100" stroke="#8aa0c6" stroke-width="2"/>
  <circle cx="90" cy="100" r="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="130" cy="100" r="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">짧은 배선</text>
</svg>
