- topic: bandwidth-gap
  title: "센서 데이터 대역폭과 CAN의 한계"
  section: 정리
  variants:
    - question: "1920x1080 해상도, 24비트 컬러, 초당 30프레임 압축하지 않은 영상 한 대의 필요 대역폭을 CAN FD(5Mbps)와 비교한 결과로 가장 적절한 것은?"
      choices: ["약 5Mbps로 CAN FD와 거의 동일한 대역폭이면 충분하다", "약 1.49Gbps로 CAN FD보다 약 300배 큰 대역폭이 필요하다", "약 1.49Mbps로 CAN FD보다 오히려 더 작은 대역폭이면 충분한 수준이다", "약 100Mbps"]
      answer: 1
      explanation: "1920×1080×3byte×8bit×30fps≈1.49Gbps로 CAN FD(5Mbps)보다 약 300배 큰 대역폭이 필요하다."
    - question: "100BASE-T1 표준에서 'T1'이 의미하는 바로 옳은 것은?"
      choices: ["10개의 트랜시버가 하나로 통합되었다는 뜻이다", "단 한 가닥의 꼬임쌍선으로 양방향 통신을 한다는 뜻이다", "4쌍의 꼬임쌍선을 사용하는 일반 이더넷과 동일한 배선 방식이라는 뜻이다", "속도가 1Mbps라는 뜻이다"]
      answer: 1
      explanation: "T1은 한 가닥의 꼬임쌍선만으로 양방향 통신을 한다는 뜻으로, 배선 가닥 수를 크게 줄여 준다."
- topic: ethernet-packet-switching
  title: "패킷 스위칭과 TSN의 필요성"
  section: 정리
  variants:
    - question: "이더넷의 패킷 스위칭이 CAN의 버스 중재보다 합산 대역폭 측면에서 유리한 이유로 가장 적절한 것은?"
      choices: ["모든 노드가 하나의 공유선을 돌아가며 사용하기 때문이다", "각 장치가 스위치에 개별 선으로 연결되어 서로 다른 목적지 트래픽이 동시에 각자의 전체 링크 속도로 흐를 수 있기 때문이다", "패킷 스위칭에서는 식별자(ID)가 작은 노드가 항상 먼저 전송되고 ID가 큰 노드는 그 전송이 끝날 때까지 계속 기다려야 하기 때문이다", "이더넷 케이블이 더 두껍기 때문이다"]
      answer: 1
      explanation: "스위치의 각 포트가 독립된 링크 속도를 제공해 서로 다른 목적지 트래픽이 동시에 전송될 수 있어 합산 대역폭이 커진다."
    - question: "일반 이더넷이 best-effort 방식이라 차량 제어 신호에 그대로 쓰기 어려운 이유로 가장 적절한 것은?"
      choices: ["일반 이더넷은 영상 데이터를 전혀 전송할 수 없기 때문이다", "트래픽이 몰리면 대기열에서 기다리는 시간이 매번 달라져 지연이 흔들리는 지터가 생기기 때문이다", "일반 이더넷의 케이블 길이가 CAN보다 항상 훨씬 짧게 제한되어 먼 거리까지는 아예 연결조차 할 수 없기 때문이다", "속도가 CAN보다 느리기 때문이다"]
      answer: 1
      explanation: "best-effort 전달은 혼잡 시 대기열 지연이 상황마다 달라져 제어 신호에 치명적인 지터를 만든다."
- topic: zone-architecture
  title: "존 아키텍처와 SOA로의 전환"
  section: 정리
  variants:
    - question: "기존 도메인 아키텍처의 한계를 존 아키텍처가 해결하는 방식으로 가장 적절한 것은?"
      choices: ["기능 종류를 더 세분화해 ECU 개수를 오히려 늘린다", "기능이 아니라 물리적 위치 기준으로 묶어 센서가 가까운 존 컨트롤러까지만 짧게 연결되게 한다", "모든 센서를 하나의 중앙 ECU에 직접 하나씩 아주 긴 전선으로 개별 연결해야 하는 방식을 그대로 유지한다", "배선을 아예 없앤다"]
      answer: 1
      explanation: "존 아키텍처는 기능이 아니라 물리적 위치로 묶어 센서가 가까운 존 컨트롤러까지만 짧게 연결되도록 한다."
    - question: "존 아키텍처가 하니스 길이를 줄이는 핵심 원리로 옳은 것은?"
      choices: ["센서 수가 늘어날 때마다 백본의 길이와 무게도 정확히 똑같은 비율로 계속 비례해서 늘어나기 때문이다", "센서가 늘어도 짧은 지선만 늘고, 차를 가로지르는 긴 구간은 소수의 백본으로 집중되기 때문이다", "존 컨트롤러가 센서 데이터를 압축해서 전선 자체를 얇게 만들기 때문이다", "센서를 줄이기 때문이다"]
      answer: 1
      explanation: "센서는 가까운 존 컨트롤러까지 짧게만 연결되고 차량을 가로지르는 긴 구간은 소수의 백본으로 집중된다."
