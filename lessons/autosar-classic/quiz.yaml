- topic: layered-architecture
  title: "레이어드 아키텍처"
  section: 정리
  variants:
    - question: "AUTOSAR Classic에서 SWC가 하드웨어를 직접 건드리지 않고 항상 RTE를 거치는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["RTE가 더 빠른 하드웨어이기 때문이다", "제어 로직을 하드웨어 독립적으로 유지해 MCU가 바뀌어도 재사용할 수 있게 하기 때문이다", "BSW가 존재하지 않는 경우에만 RTE를 거치도록 예외적으로 설계되었기 때문이다", "RTE를 거치지 않으면 ARXML 파일이 자동으로 삭제되어 빌드 자체가 불가능해지기 때문이다"]
      answer: 1
      explanation: "SWC가 RTE만 거치도록 강제하면 애플리케이션이 하드웨어 독립적으로 남아, MCU가 바뀌어도 제어 로직을 그대로 재사용할 수 있다."
    - question: "표준 BSW 구조로 처리하기 어려운 매우 빠른 타이밍의 특수 하드웨어를 다룰 때 쓰는 예외 통로로 옳은 것은 무엇인가?"
      choices: ["RTE", "복합 장치 드라이버(CDD)를 통해 여러 계층을 가로질러 직접 접근한다", "MCAL을 완전히 제거하고 애플리케이션 레이어에서 레지스터를 직접 제어한다", "ECU 추상화 계층을 두 개로 중복 생성해서 하드웨어마다 별도의 MCAL을 병렬로 운용한다"]
      answer: 1
      explanation: "표준 레이어 구조에 맞추기 어려운 특수 하드웨어는 복합 장치 드라이버(CDD)라는 예외 통로로 여러 계층을 가로질러 직접 접근한다."

- topic: vfb-rte
  title: "VFB와 RTE 코드 생성"
  section: 정리
  variants:
    - question: "같은 ECU 안에 있던 두 SWC 중 하나가 다른 ECU로 옮겨갔을 때 SWC의 제어 로직 코드를 고치지 않아도 되는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["SWC는 원래 코드가 없기 때문이다", "SWC는 VFB 위에서 배치를 모른 채 설계되고 RTE가 배치에 맞춰 코드를 다시 생성하기 때문이다", "ARXML 파일을 삭제하면 모든 SWC가 자동으로 하나의 ECU로 합쳐지기 때문이다", "AUTOSAR OS가 두 ECU 사이의 모든 신호를 알아서 동일한 메모리 주소로 매핑해 주기 때문이다"]
      answer: 1
      explanation: "SWC는 VFB 위에서 ECU 배치를 모른 채 설계되므로, 배치가 바뀌면 RTE만 다시 생성하면 되고 제어 로직 코드는 그대로 재사용된다."
    - question: "고장 코드를 읽어 달라는 진단 요청처럼 명확한 요청-응답이 필요한 동작에 가장 적합한 인터페이스로 옳은 것은 무엇인가?"
      choices: ["Sender-Receiver", "Client-Server 인터페이스로 Rte_Call을 통해 연산을 요청하고 결과를 받는다", "VFB를 거치지 않고 CAN 드라이버에 직접 요청을 써서 전달한다", "P-Port와 R-Port를 모두 제거하고 전역 변수를 통해 값을 직접 공유하는 방식을 쓴다"]
      answer: 1
      explanation: "요청과 응답이 짝을 이루는 동작은 함수 호출에 가까운 Client-Server 인터페이스로 설계하는 것이 자연스럽다."

- topic: autosar-os
  title: "AUTOSAR OS"
  section: 정리
  variants:
    - question: "AUTOSAR OS가 태스크 개수와 우선순위, 스택 크기를 모두 빌드 전에 정적으로 고정하는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["개발 속도를 늦추기 위해서다", "메모리 사용량과 동작을 예측 가능하게 만들어 검증과 안전성 분석을 쉽게 하기 때문이다", "동적으로 태스크를 생성해야만 OSEK/VDX 규격을 만족할 수 있기 때문이다", "정적 구성을 쓰면 런타임에 태스크 우선순위를 자유롭게 무작위로 바꿀 수 있게 되기 때문이다"]
      answer: 1
      explanation: "모든 태스크 구성을 빌드 전에 정적으로 고정하면 메모리 사용량과 동작이 예측 가능해져 검증과 안전성 분석이 쉬워진다."
    - question: "OSEK PCP(우선순위 상한 프로토콜)가 리소스 공유 시 해결하는 문제로 가장 적절한 것은 무엇인가?"
      choices: ["메모리 누수", "우선순위 역전과 교착 상태를 정적으로 방지한다", "ARXML 파일의 문법 오류를 컴파일 시점에 자동으로 고쳐 준다", "RTE가 생성하는 코드의 크기를 줄여서 플래시 메모리 사용량을 최소화해 준다"]
      answer: 1
      explanation: "리소스에 최고 우선순위를 상한으로 미리 정해 두는 PCP는 우선순위 역전뿐 아니라 교착 상태까지 정적으로 방지한다."
