- topic: complexity
  title: 복잡도와 WCET
  section: 정리
  variants:
    - question: "자동차 제어 소프트웨어에서 평균 실행 시간보다 최악 실행 시간을 더 중요하게 따지는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["최악의 경우가 하필 긴급 제동 같은 순간에 일어나면 그대로 안전사고로 이어질 수 있기 때문이다", "평균 실행 시간은 컴파일러가 아예 계산해 주지 않기 때문이다", "최악 실행 시간이 항상 평균 실행 시간보다 짧게 나오기 때문이다", "데스크톱 프로그램과 달리 자동차 소프트웨어는 반복문 사용이 법적으로 전면 금지되어 있어 어쩔 수 없이 항상 최악의 경우만 계산해야 하기 때문이다"]
      answer: 0
      explanation: "평균적으로 빨라도 어쩌다 한 번 느려지는 순간이 긴급 제동 같은 안전 상황과 겹치면 그대로 사고로 이어질 수 있다."
    - question: "정렬된 배열에서 이진 탐색이 선형 탐색보다 데이터가 많을수록 훨씬 빨라지는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["이진 탐색은 매 단계마다 비교해서 탐색 범위를 절반씩 줄여 O(log n)이 되기 때문이다", "이진 탐색은 데이터를 미리 복사해서 두 개의 배열로 나누어 저장하기 때문이다", "선형 탐색은 데이터가 정렬되어 있으면 항상 첫 번째 원소만 확인하기 때문이다", "이진 탐색은 CPU 캐시를 사용하지 않도록 설계되어 있어 하드웨어 가속 칩이 자동으로 장착되어 추가로 동작하기 때문이라고 알려져 있다"]
      answer: 0
      explanation: "이진 탐색은 매 단계 비교로 탐색 범위를 절반씩 좁혀 나가므로, 데이터 개수가 늘어도 비교 횟수는 로그 수준으로만 늘어난다."

- topic: ring-buffer
  title: 원형 버퍼와 큐
  section: 정리
  variants:
    - question: "원형 버퍼 구현에서 head, tail과 별도로 count 필드를 두는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["count는 인터럽트를 자동으로 비활성화시키는 역할을 하기 때문이다", "head와 tail만으로는 큐가 비었는지 가득 찼는지 구분하기 모호하기 때문이다", "count가 있어야 컴파일러가 배열의 크기를 자동으로 계산해 주기 때문이다", "count 필드가 없으면 배열의 인덱스가 음수로 넘어가 프로그램이 즉시 종료되기 때문이다"]
      answer: 1
      explanation: "head와 tail이 같을 때 비었는지 가득 찼는지 모호해지므로, 현재 쌓인 개수를 별도 count로 추적해 이 모호함을 없앤다."
    - question: "UART 수신 ISR이 데이터를 원형 버퍼에 넣고 메인 루프가 꺼내 처리하는 구조를 쓰는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["서로 다른 속도로 움직이는 인터럽트와 메인 루프를 고정 크기 메모리로 안전하게 이어주기 때문이다", "원형 버퍼를 쓰면 ISR이 메인 루프보다 항상 느리게 동작하도록 강제되기 때문이다", "ring_push와 ring_pop은 내부적으로 동적 메모리를 반복해서 할당하여 버퍼 크기를 필요할 때마다 무한히 늘려주기 때문이다", "이 구조를 쓰면 CPU가 인터럽트를 전부 영구적으로 비활성화해도 되기 때문이다"]
      answer: 0
      explanation: "원형 버퍼는 고정 크기 메모리만으로 O(1) 삽입/삭제를 제공해, 속도가 다른 ISR과 메인 루프를 안전하게 이어주는 다리 역할을 한다."

- topic: binary-search
  title: 이진 탐색 트리와 이진 탐색
  section: 정리
  variants:
    - question: "이진 탐색 트리에 값을 항상 증가하는 순서로만 계속 삽입했을 때 벌어지는 문제로 가장 적절한 것은 무엇인가?"
      choices: ["트리가 한쪽으로 치우쳐 연결 리스트와 같은 모양이 되어 탐색이 O(n)으로 느려진다", "삽입할 때마다 트리 전체가 메모리에서 두 배로 복제되어 결국 플래시 메모리 공간을 전부 소모해버린다", "트리의 모든 노드가 자동으로 삭제되어 빈 트리가 된다", "노드의 값이 모두 0으로 초기화되어 기존 데이터가 사라진다"]
      answer: 0
      explanation: "한쪽 방향으로만 계속 삽입하면 트리가 균형을 잃고 연결 리스트처럼 치우쳐, 탐색 복잡도가 O(log n)에서 O(n)으로 나빠진다."
    - question: "DTC 코드 1000개가 정렬된 배열로 저장되어 있을 때, 특정 코드 존재 여부를 확인하는 가장 효율적인 방법으로 가장 적절한 것은 무엇인가?"
      choices: ["배열을 처음부터 끝까지 하나씩 비교하는 선형 탐색을 쓴다", "중간 원소와 비교해 탐색 범위를 절반씩 줄이는 이진 탐색을 써서 O(log n)으로 찾는다", "배열을 매번 무작위로 섞은 뒤 처음 원소만 확인한다", "모든 원소를 연결 리스트로 다시 변환한 뒤 처음 노드부터 포인터를 하나씩 따라가며 끝까지 순서대로 전부 비교한다"]
      answer: 1
      explanation: "배열이 정렬되어 있으므로 중간 원소와 비교해 범위를 절반씩 줄이는 이진 탐색을 쓰면 O(log n)에 답을 찾을 수 있다."
