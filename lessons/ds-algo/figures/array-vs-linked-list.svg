<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="배열과 연결 리스트의 메모리 구조 차이">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
  </defs>
  <text x="360" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">배열 vs 연결 리스트: 메모리 모양의 차이</text>

  <text x="175" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">배열: 연속 메모리</text>
  <rect x="40" y="70" width="60" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="110" y="70" width="60" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="180" y="70" width="60" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="250" y="70" width="60" height="50" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="70" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">10</text>
  <text x="140" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">20</text>
  <text x="210" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">30</text>
  <text x="280" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">40</text>
  <text x="70" y="135" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">[0]</text>
  <text x="140" y="135" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">[1]</text>
  <text x="210" y="135" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">[2]</text>
  <text x="280" y="135" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">[3]</text>

  <line x1="210" y1="160" x2="210" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#b)"/>
  <text x="210" y="178" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">O(1) 직접 접근</text>

  <text x="565" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">연결 리스트: 포인터로 연결</text>

  <rect x="390" y="165" width="90" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="435" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">node</text>

  <rect x="510" y="90" width="90" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="555" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">node</text>

  <rect x="610" y="190" width="90" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="655" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">node</text>

  <line x1="480" y1="178" x2="513" y2="122" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="125" x2="613" y2="193" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <text x="555" y="265" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">O(n): 몇 번째인지 알려면 포인터를 따라가야 한다</text>
</svg>
