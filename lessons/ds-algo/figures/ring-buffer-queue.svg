<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="원형 버퍼로 구현한 큐, head와 tail 포인터로 순환">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker>
    <marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b794f6"/></marker>
  </defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">원형 버퍼(ring buffer)로 만든 큐</text>

  <path d="M621,100 C650,30 46,30 75,100" stroke="#b794f6" stroke-width="2" fill="none" marker-end="url(#w)"/>

  <rect x="40" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="118" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="196" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="274" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="352" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="430" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="508" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="586" y="100" width="70" height="55" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>

  <text x="75" y="178" fill="#8aa0c6" font-family="sans-serif" font-size="14" text-anchor="middle">[0]</text>
  <text x="153" y="178" fill="#8aa0c6" font-family="sans-serif" font-size="14" text-anchor="middle">[1]</text>
  <text x="309" y="178" fill="#8aa0c6" font-family="sans-serif" font-size="14" text-anchor="middle">[3]</text>
  <text x="387" y="178" fill="#8aa0c6" font-family="sans-serif" font-size="14" text-anchor="middle">[4]</text>
  <text x="543" y="178" fill="#8aa0c6" font-family="sans-serif" font-size="14" text-anchor="middle">[6]</text>
  <text x="621" y="178" fill="#8aa0c6" font-family="sans-serif" font-size="14" text-anchor="middle">[7]</text>

  <line x1="231" y1="210" x2="231" y2="157" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="231" y="228" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">tail (읽을 위치)</text>

  <line x1="465" y1="210" x2="465" y2="157" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="465" y="228" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">head (쓸 위치)</text>
</svg>
