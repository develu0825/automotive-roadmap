- topic: rtos-task
  title: RTOS 태스크 스케줄링
  section: 정리
  variants:
    - question: "우선순위 기반 선점형 스케줄링에서 높은 우선순위 태스크가 실행 준비되었을 때 벌어지는 일로 가장 적절한 것은 무엇인가?"
      choices: ["지금 CPU를 쓰고 있는 낮은 우선순위 태스크를 즉시 멈추고 높은 우선순위 태스크가 먼저 실행된다", "두 태스크가 반드시 완전히 동시에 실행되도록 CPU가 분할된다", "낮은 우선순위 태스크가 완전히 끝날 때까지 높은 우선순위 태스크는 무조건 아무것도 못 하고 계속 대기만 해야 한다", "우선순위가 높은 태스크는 항상 인터럽트로 변환되어 실행된다"]
      answer: 0
      explanation: "선점형 스케줄링에서는 더 높은 우선순위 태스크가 준비되면 지금 실행 중인 낮은 우선순위 태스크를 즉시 멈추고 먼저 실행한다."
    - question: "베어메탈 무한 루프 하나로는 서로 다른 주기를 가진 여러 작업을 관리하기 어려운 이유로 가장 적절한 것은 무엇인가?"
      choices: ["무한 루프는 C 언어 표준에서 아예 금지된 문법이기 때문이다", "베어메탈 방식에서는 변수를 선언하는 것 자체가 불가능하기 때문이다", "무한 루프를 쓰면 MCU의 플래시 메모리 용량이 실행되는 동안 계속 줄어들다가 결국 완전히 바닥나 버리기 때문이다", "한 작업이 오래 걸리면 그 사이 더 급한 다른 작업이 밀려버리고 지연을 손으로 계산하기 어렵다"]
      answer: 3
      explanation: "단일 무한 루프에서는 한 작업이 길어지면 다른 급한 작업이 밀리고, 이런 지연을 코드 전체에서 손으로 추적하기 어려워진다."

- topic: rate-monotonic
  title: 레이트 모노토닉 스케줄링
  section: 정리
  variants:
    - question: "레이트 모노토닉 스케줄링의 핵심 규칙으로 가장 적절한 것은 무엇인가?"
      choices: ["주기가 짧은 태스크일수록 더 높은 우선순위를 부여한다", "실행 시간이 긴 태스크일수록 더 높은 우선순위를 부여한다", "태스크 번호가 낮을수록 무조건 우선순위가 높아진다", "모든 태스크에 같은 우선순위를 부여해 순서를 완전히 무작위로 섞는다"]
      answer: 0
      explanation: "레이트 모노토닉 스케줄링은 주기가 짧은 태스크일수록 더 높은 우선순위를 부여하는 단순한 규칙을 따른다."
    - question: "태스크 A(주기 2ms, 실행 0.4ms)와 태스크 B(주기 10ms, 실행 2ms)의 이용률 합이 의미하는 것으로 가장 적절한 것은 무엇인가?"
      choices: ["이용률 합은 0.4로, 안전 한계값 약 0.828보다 작아 데드라인을 항상 지킬 수 있다", "이용률 합은 1.2로 한계값을 넘어서 두 태스크 모두 항상 실패한다", "이용률 합은 계산할 수 없으며 실측으로만 알 수 있다", "이용률 합은 0.828로 한계값과 정확히 똑같아서 우선순위를 처음부터 완전히 다시 매겨야만 한다"]
      answer: 0
      explanation: "두 태스크의 이용률 합은 0.2+0.2=0.4이며, n=2일 때의 안전 한계값 약 0.828보다 작아 데드라인 준수가 수학적으로 보장된다."

- topic: priority-inversion
  title: 우선순위 역전과 상속
  section: 정리
  variants:
    - question: "우선순위 역전 상황에서 중간 우선순위 태스크 M이 낮은 우선순위 태스크 L을 선점할 때 생기는 문제로 가장 적절한 것은 무엇인가?"
      choices: ["뮤텍스를 기다리던 가장 높은 우선순위 태스크 H가 M이 끝날 때까지 간접적으로 지연된다", "M이 선점하면 L이 가진 뮤텍스가 영구적으로 삭제되어 버린다", "H의 우선순위가 자동으로 영구히 가장 낮은 수준으로 떨어진다", "M이 선점하는 순간 CPU 전체가 즉시 강제로 리셋되어 모든 태스크가 처음부터 다시 시작되어 버린다"]
      answer: 0
      explanation: "L이 M에게 선점당해 뮤텍스를 반납하지 못하면, 가장 높은 우선순위인 H가 M이 끝날 때까지 간접적으로 지연되는 역전이 생긴다."
    - question: "우선순위 상속 프로토콜이 우선순위 역전 문제를 완화하는 방식으로 가장 적절한 것은 무엇인가?"
      choices: ["뮤텍스를 쥔 태스크를 즉시 강제로 종료시켜 자원을 바로 반납시킨다", "모든 태스크의 우선순위를 동일하게 맞춰 역전이 생길 수 없게 만든다", "뮤텍스라는 개념 자체를 완전히 없애고 시스템에 존재하는 모든 자원을 오직 세마포어로만 전부 바꾸어 버려서 다시는 뮤텍스를 쓸 수 없도록 만든다", "뮤텍스를 쥔 낮은 우선순위 태스크의 우선순위를 기다리는 높은 우선순위 태스크 수준으로 임시로 끌어올린다"]
      answer: 3
      explanation: "우선순위 상속은 뮤텍스를 쥔 낮은 우선순위 태스크의 우선순위를 기다리는 태스크 수준으로 임시로 올려, 중간 태스크의 선점을 막는다."
