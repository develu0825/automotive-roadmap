<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="우선순위 기반 선점형 스케줄링: 높은 우선순위 태스크가 낮은 우선순위 태스크를 잠시 멈추고 먼저 실행되는 모습">
  <defs>
    <marker id="arrow-sched" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="360" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">우선순위 기반 선점형 스케줄링</text>

  <rect x="20" y="60" width="150" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="95" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">브레이크 제어</text>
  <text x="95" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(우선순위 상)</text>

  <rect x="20" y="150" width="150" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="95" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">디스플레이 갱신</text>
  <text x="95" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(우선순위 하)</text>

  <rect x="190" y="160" width="220" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="490" y="160" width="210" height="40" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="410" y="70" width="80" height="40" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="95" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">실행</text>

  <line x1="410" y1="110" x2="410" y2="160" stroke="#8aa0c6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="490" y1="110" x2="490" y2="160" stroke="#8aa0c6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="450" y="52" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="middle">선점</text>
  <line x1="450" y1="55" x2="450" y2="67" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-sched)"/>
</svg>
