<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="MCU 내부 구조: CPU 코어가 버스로 플래시, RAM, 주변장치와 연결된 모습">
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">MCU 내부 구조</text>

  <rect x="280" y="50" width="160" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">CPU 코어</text>

  <line x1="360" y1="100" x2="360" y2="140" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="50" y1="140" x2="670" y2="140" stroke="#8aa0c6" stroke-width="2"/>
  <text x="600" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="14" text-anchor="middle">시스템 버스</text>

  <line x1="145" y1="140" x2="145" y2="160" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="365" y1="140" x2="365" y2="160" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="575" y1="140" x2="575" y2="160" stroke="#8aa0c6" stroke-width="2"/>

  <rect x="50" y="160" width="190" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="145" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">플래시</text>
  <text x="145" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">코드 저장 (비휘발성)</text>

  <rect x="270" y="160" width="190" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="365" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">RAM</text>
  <text x="365" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">실행 중 데이터</text>

  <rect x="480" y="160" width="190" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="575" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">주변장치</text>
  <text x="575" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ADC·타이머·인터럽트</text>
</svg>
