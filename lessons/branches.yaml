# 자동차 임베디드 개발 로드맵 — 가운데 프로그래밍·HW 기초에서 플랫폼/통신/안전 세 갈래로 뻗는다.
# robotics-roadmap 엔진을 역공학해 자동차 임베디드(BSP·Android Automotive·AUTOSAR) 중심으로 재구성.

hub:
  rings:
    - branches: [prog, hw]

trees:
  - id: platform
    title: "플랫폼 & OS"
    color: "#b794f6"
    angle: 180
    branches: [embedded-core, bsp, linux-plat, android, autosar, virt]
  - id: comms
    title: "통신 & 진단"
    color: "#38bdf8"
    angle: 300
    branches: [veh-net, auto-eth, middleware, diag-ota]
  - id: safetyapp
    title: "안전·보안·응용"
    color: "#f59e0b"
    angle: 60
    branches: [safety, security, io-ctrl]

branches:
  - id: prog
    title: "프로그래밍 기초"
    summary: "C/C++ 와 자료구조·알고리즘. 임베디드 소프트웨어를 쓰는 언어와 사고의 토대"
    color: "#d6d3d1"

  - id: hw
    title: "디지털 · HW 기초"
    summary: "디지털 논리와 MCU 구조·메모리. 소프트웨어가 올라가는 하드웨어를 읽는 눈"
    color: "#22d3ee"

  - id: embedded-core
    title: "임베디드 핵심"
    summary: "베어메탈 펌웨어에서 RTOS·메모리/링커를 거쳐 리눅스 커널까지, 모든 차량 SW가 딛는 뼈대"
    color: "#cbd5e1"
    core: true

  - id: bsp
    title: "BSP · 보드 브링업"
    summary: "부트로더·디바이스 트리·클럭/핀뮤잉. 새 보드에 OS 를 처음 올리는 보드 지원 패키지"
    color: "#fb923c"

  - id: linux-plat
    title: "리눅스 플랫폼"
    summary: "디바이스 드라이버·Yocto 빌드 시스템·유저공간. 차량용 리눅스 플랫폼을 만드는 길"
    color: "#4ade80"

  - id: android
    title: "Android Automotive"
    summary: "AOSP·AAOS·VHAL·CarService. 차량용 안드로이드(IVI·클러스터) 플랫폼"
    color: "#a3e635"

  - id: autosar
    title: "AUTOSAR"
    summary: "Classic 과 Adaptive. 차량 ECU 소프트웨어의 표준 아키텍처"
    color: "#818cf8"

  - id: virt
    title: "가상화 · 하이퍼바이저"
    summary: "한 SoC 위에 여러 OS 를 안전하게 통합하는 하이퍼바이저와 상용 RTOS(QNX)"
    color: "#f87171"
    outer: true

  - id: veh-net
    title: "차량 네트워크"
    summary: "CAN·LIN·FlexRay 와 ECU 전장. 차 안의 제어기들을 잇는 버스"
    color: "#38bdf8"

  - id: auto-eth
    title: "차량 이더넷"
    summary: "Automotive Ethernet 과 TSN. 대역폭이 큰 차세대 차량 백본"
    color: "#60a5fa"

  - id: middleware
    title: "통신 미들웨어"
    summary: "SOME/IP·DDS. 서비스 지향(SOA) 차량 소프트웨어의 통신 계층"
    color: "#a78bfa"

  - id: diag-ota
    title: "진단 · OTA"
    summary: "UDS 진단과 플래싱, SDV 무선 업데이트(OTA)"
    color: "#2dd4bf"

  - id: safety
    title: "기능안전"
    summary: "ISO 26262·ASIL·MISRA C. 고장이 사람을 다치게 하지 않도록 하는 체계"
    color: "#f59e0b"

  - id: security
    title: "사이버보안"
    summary: "ISO/SAE 21434·보안 부팅·암호. 해킹으로부터 차량을 지키는 방어"
    color: "#fb7185"

  - id: io-ctrl
    title: "센서 · 제어 응용"
    summary: "센서 I/O·제어·바디 ECU. 임베디드 위에서 돌아가는 실제 차량 기능"
    color: "#f472b6"

