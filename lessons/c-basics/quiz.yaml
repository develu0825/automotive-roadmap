- topic: pointer-basics
  title: 포인터와 역참조
  section: 정리
  variants:
    - question: "C에서 포인터가 갖는 핵심 성질을 가장 적절히 설명한 것은 무엇인가?"
      choices: ["배열의 최대 크기를 결정하는 키워드이다", "메모리의 주소값을 담는 변수이며, 역참조로 그 주소의 값을 읽고 쓸 수 있다", "컴파일러가 변수의 자료형을 실행 중에 자유롭게 바꿔주도록 허용하는 특수한 전처리 매크로 문법이다", "정수 변수를 실수로 자동 변환하는 연산자이다"]
      answer: 1
      explanation: "포인터는 주소를 담는 변수이고, 역참조(*p) 연산으로 그 주소가 가리키는 메모리에 직접 접근할 수 있다."
    - question: "함수에 변수를 넘길 때 변수의 값이 아니라 주소(포인터)를 넘기는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["함수 호출마다 메모리 전체를 복사해서 속도를 두 배로 높이기 위한 목적이다", "call by value라 원본을 못 바꾸므로, 주소를 넘겨 원본 값을 직접 수정하려는 것이다", "포인터를 쓰면 변수의 타입이 자동으로 문자열로 바뀌어 디버깅 메시지를 쉽게 만들어 주기 때문이다", "스택 메모리를 아예 쓰지 않게 하려는 목적이다"]
      answer: 1
      explanation: "C는 기본적으로 값을 복사해 전달하므로, 함수 안에서 원본 변수를 바꾸려면 그 변수의 주소를 넘겨야 한다."

- topic: bit-operation
  title: 비트 연산과 레지스터
  section: 정리
  variants:
    - question: "레지스터의 3번 비트만 1로 세우고 나머지 비트는 그대로 두려는 코드로 가장 적절한 것은 무엇인가?"
      choices: ["`reg = 8;`로 레지스터 전체를 덮어쓴다", "`reg |= (1u << 3);`로 3번 비트만 세우고 나머지는 그대로 유지한다", "`reg &= ~(1u << 3);`로 3번 비트를 지우면서 동시에 나머지 모든 비트도 함께 0으로 초기화한다", "`reg = reg * 8;`로 레지스터 값 전체를 여덟 배로 늘려 비트를 세운다"]
      answer: 1
      explanation: "OR 연산으로 특정 비트에 1을 세우면 그 비트만 1이 되고 나머지 비트는 OR의 성질 때문에 원래 값이 그대로 유지된다."
    - question: "하드웨어 레지스터 포인터에 `volatile`을 반드시 붙여야 하는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["컴파일러의 최적화로 레지스터 값을 캐시해 읽기를 생략하는 것을 막기 위해서이다", "변수의 메모리 주소를 출력할 때 16진수로 표시되게 하기 위해서이다", "포인터 연산 시 자동으로 비트 반전을 수행하게 만들기 위한 지시어이기 때문이다", "함수 호출 비용을 줄이기 위해 컴파일러가 해당 변수를 레지스터 파일에 강제로 할당하도록 지시하는 전용 키워드이기 때문이다"]
      answer: 0
      explanation: "volatile이 없으면 컴파일러가 값이 변하지 않는다고 가정해 읽기를 생략할 수 있어, 하드웨어가 바꾼 실제 값을 놓칠 수 있다."

- topic: memory-region
  title: 메모리 영역과 동적 할당
  section: 정리
  variants:
    - question: "임베디드 안전 코드에서 MISRA-C가 동적 메모리 할당을 피하라고 권고하는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["malloc 함수는 32비트 이상의 값을 반환할 수 없기 때문이다", "실행 중 메모리 부족이나 파편화로 예측할 수 없는 실패가 생길 수 있어 안전성을 해치기 때문이다", "malloc은 비트 연산자를 전혀 지원하지 않기 때문이다", "동적 할당을 쓰면 컴파일러가 모든 전역 변수의 초기값을 무작위로 바꿔버려 디버깅이 불가능해지기 때문이다"]
      answer: 1
      explanation: "동적 할당은 실행 중 메모리 부족이나 파편화로 예측 불가능한 실패를 일으킬 수 있어 안전이 중요한 코드에서는 피한다."
    - question: "함수의 지역 변수가 저장되는 메모리 영역과 그 특징을 옳게 짝지은 것은 무엇인가?"
      choices: ["힙 영역에 저장되며 malloc을 호출해야 생성된다", "스택 영역에 저장되며 함수가 끝나면 자동으로 해제된다", "코드 영역에 저장되며 프로그램 실행 내내 값이 고정된다", "정적 영역에 저장되며 프로그램이 끝날 때까지 값이 유지되고 재선언할 수 없는 상수로만 취급된다"]
      answer: 1
      explanation: "지역 변수는 함수 호출 시 스택에 할당되고 함수가 반환되면 그 공간이 자동으로 정리되어 재사용된다."
