- topic: bus-vs-point-to-point
  title: "공유 버스와 점대점 연결의 한계"
  section: 정리
  variants:
    - question: "ECU가 10개에서 20개로 늘어날 때 점대점 연결에 필요한 전선 수의 변화로 가장 적절한 것은?"
      choices: ["10개에서 20개로 똑같이 두 배만 늘어난다", "45개에서 190개로 늘어나 ECU 수의 제곱에 가깝게 증가한다", "ECU 수와 무관하게 항상 하나의 선으로 충분하다", "190개에서 450개로 늘어나며 ECU 수가 늘어난 비율과 거의 같은 수준으로 선형적으로 증가하는 양상을 보인다"]
      answer: 1
      explanation: "점대점 연결의 수는 n(n-1)/2로 늘어나므로 ECU가 10개면 45개, 20개면 190개가 필요하다."
    - question: "CAN 버스가 멀티마스터 구조라는 것이 의미하는 바로 옳은 것은?"
      choices: ["중앙 관리 노드 없이 모든 ECU가 동등한 자격으로 버스에 접근할 수 있다", "하나의 마스터 노드가 미리 정해진 스케줄표에 따라 모든 슬레이브의 통신 순서를 일일이 지정해 준다", "ECU마다 서로 다른 전압 기준을 사용한다", "버스에 노드가 하나만 연결된다"]
      answer: 0
      explanation: "CAN은 중앙 관리 노드가 없는 멀티마스터 구조라서 모든 노드가 동등하게 버스 접근을 시도할 수 있다."
- topic: bit-arbitration
  title: "비트 중재와 CAN FD"
  section: 정리
  variants:
    - question: "노드 A(ID 0x100)와 노드 B(ID 0x7E8)가 동시에 전송을 시작했을 때 비트 중재의 결과로 옳은 것은?"
      choices: ["두 메시지가 동시에 절반씩 섞여서 전송된다", "ID가 더 작은 노드 A의 메시지가 데이터 손실 없이 끝까지 전송된다", "ID가 더 큰 노드 B의 메시지가 먼저 전송되고 노드 A는 그 뒤에 다시 전송을 시도해야 한다", "버스가 손상되어 두 메시지 모두 사라진다"]
      answer: 1
      explanation: "ID가 작을수록 도미넌트 비트가 먼저 나와 중재에서 이기므로 노드 A의 메시지가 손실 없이 전송된다."
    - question: "CAN FD가 기존 클래식 CAN보다 처리량을 높이는 방식으로 옳은 것은?"
      choices: ["모든 구간의 속도를 항상 2 Mbps 이상으로 고정한다", "중재 구간 속도는 유지하고 데이터 구간만 선택적으로 더 빠른 속도로 전환한다", "데이터 필드를 8바이트보다 더 작게 줄여서 전송해야 할 비트 수 자체를 줄이는 방식을 쓴다", "CRC를 제거해 프레임 길이를 줄인다"]
      answer: 1
      explanation: "CAN FD는 중재 구간은 기존 속도로 호환성을 유지하고, 경쟁이 끝난 데이터 구간만 더 빠른 속도로 전환한다."
- topic: lin-dbc-design
  title: "LIN 구조와 DBC 메시지 설계"
  section: 정리
  variants:
    - question: "LIN이 CAN보다 저렴하고 단순한 구조를 쓸 수 있는 이유로 가장 적절한 것은?"
      choices: ["LIN은 CAN보다 전송 속도가 더 빠르기 때문이다", "마스터-슬레이브 구조라서 복잡한 충돌 중재 로직이 필요 없기 때문이다", "LIN 슬레이브 노드는 두 가닥의 차동 신호선을 추가로 사용하기 때문이다", "LIN에는 ID가 존재하지 않기 때문이다"]
      answer: 1
      explanation: "마스터가 통신 순서를 지정하는 구조라서 슬레이브는 중재 로직 없이 호출될 때만 응답하면 된다."
    - question: "엔진 냉각수 온도 신호가 8비트 정수, 스케일 0.5, 오프셋 -40으로 정의되어 있다. 수신한 원시 값이 180일 때 실제 온도로 가장 적절한 것은?"
      choices: ["50도씨로 계산된다", "90도씨로 계산된다", "스케일과 오프셋을 무시하고 원시 값 그대로 180도씨로 읽어야 한다", "0도씨다"]
      answer: 0
      explanation: "physical = raw*scale+offset = 180*0.5-40 = 50도씨다."
