<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="CAN 버스 토폴로지, 멀티마스터 차동 신호 CAN_H CAN_L">
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">CAN 버스 토폴로지: 멀티마스터 차동 신호</text>

  <line x1="70" y1="80" x2="670" y2="80" stroke="#8aa0c6" stroke-width="3"/>
  <line x1="70" y1="120" x2="670" y2="120" stroke="#8aa0c6" stroke-width="3"/>
  <text x="65" y="83" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">CAN_H</text>
  <text x="65" y="123" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">CAN_L</text>

  <line x1="70" y1="80" x2="70" y2="120" stroke="#f59e0b" stroke-width="3"/>
  <text x="50" y="103" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="end">120Ω</text>
  <line x1="670" y1="80" x2="670" y2="120" stroke="#f59e0b" stroke-width="3"/>
  <text x="675" y="103" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="start">120Ω</text>

  <rect x="100" y="20" width="130" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="165" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">엔진 ECU</text>
  <line x1="165" y1="70" x2="165" y2="120" stroke="#8aa0c6" stroke-width="2"/>

  <rect x="295" y="20" width="130" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">계기판 ECU</text>
  <line x1="360" y1="70" x2="360" y2="120" stroke="#8aa0c6" stroke-width="2"/>

  <rect x="490" y="20" width="130" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="555" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ABS ECU</text>
  <line x1="555" y1="70" x2="555" y2="120" stroke="#8aa0c6" stroke-width="2"/>

  <text x="360" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">중앙 노드 없이 모든 ECU가 선로 한 쌍을 공유</text>
  <text x="360" y="178" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">전압 차이(CAN_H − CAN_L)로 신호 판단, 잡음에 강함</text>
</svg>
