<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="CAN 비트 중재, ID가 낮은 쪽이 승리">
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">CAN 비트 중재: ID가 낮은 쪽이 승리</text>

  <text x="150" y="73" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">노드 A (0x100)</text>
  <text x="150" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">노드 B (0x7E8)</text>
  <text x="150" y="193" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">버스 상태</text>

  <text x="190" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="280" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="370" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">1</text>
  <text x="460" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="550" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>

  <text x="190" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="280" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="370" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">1</text>
  <text x="460" y="130" fill="#f59e0b" font-family="sans-serif" font-size="16" text-anchor="middle">1</text>
  <text x="550" y="130" fill="#8aa0c6" font-family="sans-serif" font-size="15" text-anchor="middle">(중단)</text>

  <text x="190" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="280" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="370" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">1</text>
  <text x="460" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>
  <text x="550" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">0</text>

  <line x1="460" y1="45" x2="460" y2="215" stroke="#b794f6" stroke-width="2" stroke-dasharray="6,5"/>

  <text x="460" y="240" fill="#b794f6" font-family="sans-serif" font-size="15" text-anchor="middle">중재 지점: B가 레세시브(1)를 보냈지만 버스는 0 → B 패배, A가 끝까지 전송</text>
</svg>
