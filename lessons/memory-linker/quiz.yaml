- topic: compile-link-roles
  title: "컴파일과 링크"
  section: 정리
  variants:
    - question: "컴파일과 링크의 역할 차이에 대해 옳은 것은?"
      choices:
        - "컴파일러가 모든 오브젝트 파일을 모아 최종 메모리 주소까지 전부 결정하고 링커는 문법만 검사한다"
        - "컴파일러는 .c 파일을 기계어로 번역하고 링커는 오브젝트 파일들의 참조를 연결해 주소를 매긴다"
        - "링커는 소스 코드의 문법 오류만 검사하는 도구다"
        - "둘은 완전히 같은 작업을 수행한다"
      answer: 1
      explanation: "컴파일은 파일 단위 번역이고, 링크는 여러 오브젝트 파일을 모아 미해결 참조를 실제 주소로 채워 넣는 과정이다."
    - question: "링크 단계에서 .o 파일 안에 남아 있는 '미해결 참조'가 의미하는 것으로 가장 적절한 것은?"
      choices:
        - "크로스 컴파일 툴체인이 보드와 호환되지 않아서 생기는 설치 오류 메시지 모음"
        - "다른 파일에 정의된 함수나 변수를 아직 실제 주소로 연결하지 못한 상태"
        - "소스 코드에 문법 오류가 있어 컴파일이 실패한 상태"
        - "플래시 용량을 초과해 빌드가 거부된 상태"
      answer: 1
      explanation: "컴파일 단계에서는 다른 파일에 정의된 심볼을 나중에 링커가 채워 넣도록 미해결 참조로 남겨둔다."
- topic: memory-sections
  title: "메모리 섹션"
  section: 정리
  variants:
    - question: ".data 섹션의 특징으로 옳은 것은?"
      choices:
        - "전원이 꺼져도 사라지지 않아야 하므로 어떤 경우에도 플래시에만 존재하고 RAM은 전혀 쓰지 않는다"
        - "초기값은 플래시에 보관하고 실제 변수는 RAM에 두는 두 집 살림을 한다"
        - "초기값이 없는 변수만 모아두며 플래시 용량을 전혀 차지하지 않는다"
        - "실행되는 기계어 명령만 담겨 있어 수정이 불가능하다"
      answer: 1
      explanation: ".data는 초기값을 플래시에 보관하고 실제 변수는 RAM에 두며, 스타트업 코드가 매 전원 인가 시 그 값을 복사한다."
    - question: "스택 영역이 맵 파일의 섹션 표에 별도로 나타나지 않는 이유로 가장 적절한 것은?"
      choices:
        - ".text나 .rodata와 똑같이 컴파일 시점에 크기가 완전히 고정되는 정적 섹션이기 때문이다"
        - "함수 호출 깊이에 따라 실행 중 크기가 계속 바뀌는 동적 영역이기 때문이다"
        - "스택은 플래시에 저장되어 맵 파일에서 추적할 필요가 없기 때문이다"
        - "링커가 스택을 아예 인식하지 못해 오류로 처리하기 때문이다"
      answer: 1
      explanation: "스택은 함수 호출이 깊어질수록 실행 중에 크기가 계속 변하는 동적 영역이라 고정된 섹션으로 표시되지 않는다."
- topic: cross-compile-mapfile
  title: "크로스 컴파일과 맵 파일"
  section: 정리
  variants:
    - question: "크로스 컴파일이 필요한 이유로 가장 적절한 것은?"
      choices:
        - "호스트 PC와 타겟 MCU의 명령어 체계가 달라 네이티브 컴파일러로는 실행 파일을 만들 수 없기 때문이다"
        - "링커 스크립트의 MEMORY와 SECTIONS 블록 문법이 호스트 운영체제 종류에 따라 완전히 달라지기 때문이다"
        - "맵 파일을 생성하려면 반드시 별도의 컴파일러가 필요하기 때문이다"
        - "플래시 용량이 부족해서다"
      answer: 0
      explanation: "호스트와 타겟의 아키텍처가 다르면 네이티브 컴파일러가 만든 실행 파일이 타겟에서 전혀 동작하지 않아 크로스 컴파일 툴체인이 필요하다."
    - question: "빌드 후 생성된 맵 파일을 통해 확인할 수 있는 것을 고른 것은?"
      choices:
        - "각 섹션의 사용 용량과 특정 심볼이 배치된 실제 메모리 주소"
        - "소스 코드에 있는 주석의 전체 내용"
        - "실행 중인 프로세스의 현재 CPU 사용률과 스케줄링 우선순위"
        - "크로스 컴파일 툴체인의 설치 경로와 버전 정보 전체"
      answer: 0
      explanation: "맵 파일은 각 섹션의 용량과 각 심볼이 배치된 실제 주소를 보여주는 빌드 결과 보고서다."
