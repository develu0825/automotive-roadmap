<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="Classic 정적 바이너리와 Adaptive POSIX 프로세스 구조 비교">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>

  <line x1="370" y1="50" x2="370" y2="330" stroke="#8aa0c6" stroke-width="2" stroke-dasharray="6,6"/>

  <text x="190" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Classic: 정적 바이너리</text>
  <rect x="40" y="60" width="300" height="190" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="190" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">하나의 주소 공간</text>
  <text x="190" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Runnable A</text>
  <text x="190" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Runnable B</text>
  <text x="190" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Runnable C</text>

  <line x1="190" y1="250" x2="190" y2="268" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="40" y="270" width="300" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="190" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">AUTOSAR OS (OSEK)</text>

  <text x="545" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Adaptive: POSIX 프로세스</text>

  <rect x="400" y="70" width="85" height="150" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="442" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">App</text>
  <text x="442" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Process A</text>

  <rect x="500" y="70" width="85" height="150" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="542" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">App</text>
  <text x="542" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Process B</text>

  <rect x="600" y="70" width="85" height="150" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="642" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">App</text>
  <text x="642" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Process C</text>

  <line x1="442" y1="220" x2="442" y2="268" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="542" y1="220" x2="542" y2="268" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="642" y1="220" x2="642" y2="268" stroke="#8aa0c6" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="400" y="270" width="285" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="542" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">POSIX 준수 OS (Linux/QNX)</text>
