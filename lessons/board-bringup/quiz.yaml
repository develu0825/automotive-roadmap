- topic: power-sequencing
  title: "전원 시퀀스"
  section: 정리
  variants:
    - question: "전원 시퀀스를 데이터시트가 요구하는 순서와 타이밍대로 지키지 않으면 생길 수 있는 문제로 가장 적절한 것은?"
      choices:
        - "칩 내부 트랜지스터에 설계 범위를 넘는 전압 스트레스가 걸려 칩이 영구적으로 손상될 수 있다"
        - "컴파일 시간이 평소보다 눈에 띄게 훨씬 더 길어지고 빌드 서버 전체의 작업 부하가 심하게 커진다"
        - "디바이스 트리 파일의 문법 오류가 발생한다"
        - "링커 스크립트가 자동으로 재작성된다"
      answer: 0
      explanation: "전원 레일의 순서나 타이밍을 지키지 않으면 칩 내부 트랜지스터에 과도한 전압 스트레스가 걸려 칩이 영구 손상될 수 있다."
    - question: "PMIC(전원 관리 IC)의 역할로 옳은 것은?"
      choices:
        - "여러 전원 레일을 미리 프로그램된 순서와 시간 간격에 따라 순차적으로 켠다"
        - "CPU 명령어를 하나씩 해석해 실행한다"
        - "디바이스 트리를 DTB로 컴파일한다"
        - "U-Boot 콘솔에서 사람이 입력한 명령을 해석해 시리얼로 로그 문자열을 출력한다"
      answer: 0
      explanation: "PMIC는 배터리나 입력 전압을 여러 레일로 변환하면서, 내부에 프로그램된 순서에 따라 각 레일을 순차적으로 켠다."
- topic: clock-tree-pll
  title: "클럭 트리와 PLL"
  section: 정리
  variants:
    - question: "클럭 트리에서 PLL이 하는 역할로 가장 적절한 것은?"
      choices:
        - "수정 발진기의 기본 주파수를 CPU와 주변장치가 필요로 하는 다양한 주파수로 곱하거나 나눠준다"
        - "전원 레일의 전압 순서를 결정한다"
        - "핀 뮤잉 레지스터 값을 보드 리비전과 전원 상태에 따라 매번 자동으로 탐지해서 알맞게 재설정한다"
        - "JTAG 디버거의 연결 상태를 확인한다"
      answer: 0
      explanation: "PLL은 수정 발진기의 낮은 기본 주파수를 CPU, 버스, 주변장치가 필요로 하는 다양한 주파수로 곱하거나 나눠 공급한다."
    - question: "PLL이 lock 상태에 도달하지 못했을 때 흔히 의심해야 하는 원인으로 옳은 것은?"
      choices:
        - "수정 발진기 주변 커패시터 값이 권장값과 다르거나 배율 레지스터 값이 범위를 벗어난 경우다"
        - "디바이스 트리의 compatible 문자열 철자가 미세하게 틀려서 드라이버 바인딩이 완전히 실패하는 경우다"
        - "U-Boot 환경 변수 bootcmd가 비어 있는 경우다"
        - "커널 모듈이 아직 insmod로 로드되지 않은 경우다"
      answer: 0
      explanation: "PLL이 lock되지 않는 흔한 원인은 발진기 주변 커패시터 값이 권장값과 다르거나 배율 설정 레지스터 값이 범위를 벗어난 경우다."
- topic: pin-muxing
  title: "핀 뮤잉"
  section: 정리
  variants:
    - question: "핀 뮤잉(pin muxing)이 필요한 이유로 가장 적절한 것은?"
      choices:
        - "SoC 기능 수보다 물리적 핀 개수가 적어 하나의 핀이 여러 기능 중 하나로 동작해야 하기 때문이다"
        - "모든 핀을 보드 리비전과 전원 상태에 관계없이 항상 예외 없이 GPIO 기능으로만 고정해서 사용하기 위해서다"
        - "전원 레일의 전압을 낮추기 위해서다"
        - "DRAM 컨트롤러의 타이밍을 조정하기 위해서다"
      answer: 0
      explanation: "SoC가 지원하는 기능 수보다 물리적 핀 개수가 훨씬 적기 때문에, 하나의 핀을 소프트웨어로 여러 기능 중 하나로 지정한다."
    - question: "하드웨어 엔지니어가 어떤 핀을 I2C의 SCL로 배선했는데 소프트웨어 엔지니어가 그 핀을 GPIO로 설정했을 때 나타나는 문제로 옳은 것은?"
      choices:
        - "I2C 컨트롤러의 신호가 그 핀으로 전달되지 않아 버스 통신이 전혀 이루어지지 않는다"
        - "DRAM 용량이 절반으로 줄어든다"
        - "전원 레일의 순서가 자동으로 뒤바뀐다"
        - "커널 빌드 과정 자체가 완전히 실패해서 최종 이미지 파일이 전혀 생성되지 않는 상태가 된다"
      answer: 0
      explanation: "핀 뮤잉이 하드웨어 배선과 일치하지 않으면 I2C 신호가 해당 핀으로 전달되지 않아 버스 통신이 이루어지지 않는다."
