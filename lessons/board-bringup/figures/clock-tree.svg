<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="클럭 트리 분배 구조">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">클럭 트리 분배 구조</text>

  <rect x="260" y="30" width="200" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="49" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">수정 발진기</text>
  <text x="360" y="69" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">24MHz</text>

  <line x1="360" y1="80" x2="140" y2="120" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="80" x2="360" y2="120" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="80" x2="580" y2="120" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="120" width="200" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="140" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">PLL (CPU)</text>
  <text x="140" y="159" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">x50 배율</text>

  <rect x="260" y="120" width="200" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">PLL (DDR)</text>
  <text x="360" y="159" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">x33 배율</text>

  <rect x="480" y="120" width="200" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="580" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">분주기</text>
  <text x="580" y="159" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">저속 주변장치용</text>

  <line x1="140" y1="170" x2="140" y2="210" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="170" x2="360" y2="210" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="170" x2="580" y2="210" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="210" width="200" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="229" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">CPU 코어</text>
  <text x="140" y="249" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">1.2GHz</text>

  <rect x="260" y="210" width="200" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="229" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">DDR 컨트롤러</text>
  <text x="360" y="249" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">800MHz</text>

  <rect x="480" y="210" width="200" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="580" y="229" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">UART 등</text>
  <text x="580" y="249" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">저속 클럭</text>
</svg>
