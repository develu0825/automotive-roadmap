- topic: fetch-decode-execute
  title: CPU 실행 사이클
  section: 정리
  variants:
    - question: "CPU가 클럭마다 반복하는 fetch-decode-execute 사이클을 옳게 설명한 것은 무엇인가?"
      choices: ["PC가 가리키는 명령어를 읽고, 해석하고, 실행한 뒤 PC를 다음 명령어로 옮긴다", "시스템에 등록된 모든 인터럽트를 영구적으로 완전히 비활성화시켜서 다시는 켜질 수 없게 만들어 버린다", "플래시 메모리의 내용을 전부 지우고 새 프로그램을 기다린다", "CPU의 클럭 속도를 사용자가 입력할 때까지 무한정 대기시킨다"]
      answer: 0
      explanation: "CPU는 PC가 가리키는 명령어를 가져오고(fetch) 해석하고(decode) 실행하는(execute) 과정을 클럭마다 반복한다."
    - question: "C 코드 한 줄 `rpm = rpm + 1;`이 실행되는 과정을 가장 적절히 설명한 것은 무엇인가?"
      choices: ["한 번의 클럭 사이클 안에서 이 모든 동작이 영구히 동시에 끝나버려 더 이상 추가로 반복되지 않으며 다시는 일어나지 않는다", "컴파일러가 이 줄을 실행하지 않고 건너뛰어 버린다", "여러 개의 짧은 명령어로 쪼개져 fetch-decode-execute 사이클을 여러 번 거쳐 실행된다", "CPU가 아니라 메모리 칩이 자체적으로 값을 1 증가시켜 처리한다"]
      answer: 2
      explanation: "C 코드 한 줄은 여러 개의 짧은 기계어 명령어로 쪼개지고, 각 명령어가 fetch-decode-execute 사이클을 거치며 실행된다."

- topic: memory-map
  title: 메모리 맵과 MMIO
  section: 정리
  variants:
    - question: "레지스터 포인터에 값을 쓰는 코드가 RAM 변수에 값을 쓰는 것과 같은 문법으로 동작하는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["GPIO 레지스터 전체가 RAM 메모리 영역 안에 물리적으로 그대로 복사되어 영구히 들어가 있기 때문이다", "컴파일러가 포인터 대입문을 자동으로 함수 호출로 바꿔주기 때문이다", "메모리 맵이 주소 공간을 구간별로 나눠 일부를 레지스터에 할당해 두었기 때문이다", "C 언어 표준이 GPIO 전용 문법을 따로 정의해 두었기 때문이다"]
      answer: 2
      explanation: "메모리 맵이 주소 공간을 구간별로 나눠 일부를 레지스터 영역에 배정해 두므로, 같은 포인터 문법으로 레지스터에 접근할 수 있다."
    - question: "메모리 맵에서 플래시 영역과 SRAM 영역이 서로 다른 용도로 쓰이는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["플래시와 SRAM은 사실 완전히 같은 메모리라서 아무 차이가 없기 때문이다", "SRAM에는 오직 인터럽트 벡터 테이블만 저장할 수 있기 때문이다", "플래시는 오직 읽기만 가능하고 SRAM은 오직 쓰기만 가능해서 둘 다 반쪽짜리 기능만 가진 불완전한 메모리이기 때문이다", "플래시는 전원이 꺼져도 유지되는 코드 저장용이고, SRAM은 전역 변수와 스택이 올라가는 휘발성 영역이기 때문이다"]
      answer: 3
      explanation: "플래시는 전원이 꺼져도 내용이 유지되어 코드 저장에 쓰이고, SRAM은 휘발성이라 변수와 스택처럼 실행 중 바뀌는 데이터에 쓰인다."

- topic: interrupt-nvic
  title: 인터럽트와 NVIC
  section: 정리
  variants:
    - question: "인터럽트가 발생했을 때 CPU가 수행하는 동작을 옳게 설명한 것은 무엇인가?"
      choices: ["지금 실행 중이던 프로그램 전체를 완전히 종료시키고 전원을 끊었다가 다시 켜서 처음부터 재시작한다", "인터럽트가 발생해도 현재 작업이 끝날 때까지 무조건 무시한다", "CPU의 클럭 속도를 영구적으로 두 배로 끌어올려서 이후 모든 ISR을 더 빠르게 실행하도록 재설정한다", "현재 레지스터 상태를 스택에 저장하고 ISR로 점프해 실행한 뒤 끝나면 원래 작업으로 복귀한다"]
      answer: 3
      explanation: "인터럽트가 발생하면 CPU는 현재 상태를 스택에 저장하고 ISR로 점프하며, ISR이 끝나면 원래 하던 작업으로 복귀한다."
    - question: "NVIC가 제동 센서 인터럽트를 인포테인먼트 인터럽트보다 먼저 처리하게 만드는 방법으로 가장 적절한 것은 무엇인가?"
      choices: ["두 인터럽트의 벡터 주소를 완전히 동일하게 맞춰서 순서를 무작위로 섞는다", "각 인터럽트에 우선순위를 부여해 더 높은 우선순위의 인터럽트를 먼저 처리하도록 설정한다", "인포테인먼트 인터럽트의 전원 공급을 영구적으로 차단해 버린다", "모든 인터럽트를 폴링 방식으로 완전히 바꿔서 그 순서를 CPU가 매번 직접 눈으로 하나씩 확인하게 만든다"]
      answer: 1
      explanation: "NVIC는 각 인터럽트에 부여된 우선순위를 비교해, 더 중요한 인터럽트가 먼저 처리되도록 관리한다."
