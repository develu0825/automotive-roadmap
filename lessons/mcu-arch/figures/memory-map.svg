<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="플래시, SRAM, 주변장치 레지스터가 배치된 메모리 맵">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">메모리 맵: 하나의 주소 공간에 배치된 영역들</text>

  <text x="100" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">주소 증가</text>
  <line x1="100" y1="325" x2="100" y2="52" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="140" y="60" width="320" height="60" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">GPIO 포트 A 레지스터</text>
  <text x="300" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0x4002_0000 – 0x4002_03FF</text>

  <rect x="140" y="130" width="320" height="60" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="154" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">타이머 레지스터</text>
  <text x="300" y="174" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0x4001_0000 – 0x4001_03FF</text>

  <rect x="140" y="200" width="320" height="60" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="300" y="224" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">SRAM (변수 · 스택)</text>
  <text x="300" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0x2000_0000 – 0x2000_FFFF</text>

  <rect x="140" y="270" width="320" height="60" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="300" y="294" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">Flash (프로그램 코드)</text>
  <text x="300" y="314" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">0x0000_0000 – 0x0007_FFFF</text>
</svg>
