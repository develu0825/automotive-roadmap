- topic: soa-vs-can
  title: "SOA와 CAN의 설계 차이"
  section: 정리
  variants:
    - question: "CAN 기반 설계와 SOA 기반 설계가 근본적으로 다른 지점은 무엇인가?"
      choices: ["CAN처럼 네트워크가 작고 설계 변경이 드물 때 가장 효율적으로 동작하도록 만들어졌다는 점에서 근본적으로 동일하다", "서버가 서비스를 제공한다고 네트워크에 알리면 클라이언트가 그것을 찾아 연결을 맺는다는 점이다", "서비스 디스커버리 없이 고정된 메시지 ID로만 통신을 계속 유지한다는 점이다", "항상 TCP만 사용해 신뢰성을 확보한다는 점이다"]
      answer: 1
      explanation: "SOA는 서버가 서비스를 광고하고 클라이언트가 이를 찾아 연결하는 동적 구조를 쓰는 반면, CAN은 송수신 노드와 신호 의미가 설계 시점에 고정된다."
    - question: "소프트웨어 중심 차량에서 CAN처럼 고정된 메시지 ID와 송수신 노드를 전제하는 설계의 한계로 가장 적절한 것은?"
      choices: ["데이터를 제공하는 주체가 차종이나 구성에 따라 달라지면 유연하게 대응하기 어렵다", "서비스 디스커버리가 반드시 유니캐스트 대신 멀티캐스트로만 응답하도록 강제한다는 제약이 생기기 때문이다", "서비스 ID와 메서드 ID를 저장할 공간이 부족해진다", "UDP만 지원하고 TCP는 전혀 쓸 수 없게 된다"]
      answer: 0
      explanation: "기능을 제공하는 ECU가 차종이나 구성마다 달라질 수 있는 환경에서는 설계 시점에 고정된 CAN 방식이 유연성이 떨어진다."

- topic: someip-rpc-header
  title: "SOME/IP 통신 패턴과 메시지 헤더"
  section: 정리
  variants:
    - question: "SOME/IP가 지원하는 세 가지 통신 패턴 중 조회·설정·통지를 모두 지원하는 상태 값에 해당하는 것은 무엇인가?"
      choices: ["RPC로, 클라이언트의 요청에 서버가 결과를 돌려주는 호출 방식이다", "이벤트로, 서버가 값이 바뀔 때마다 구독한 클라이언트들에게 주기적 혹은 변경 시점마다 알려주는 방식이다", "필드로, 값을 조회·설정할 수도 있고 변경 통지도 받을 수 있는 상태 값에 가까운 개념이다", "서비스 디스커버리로, 네트워크에서 서버의 실제 위치를 찾아내는 절차를 가리킨다"]
      answer: 2
      explanation: "필드는 RPC처럼 조회·설정이 가능하고 이벤트처럼 변경 통지도 받을 수 있는 상태 값에 가까운 개념이다."
    - question: "클라이언트가 session_id = 7로 요청을 보냈는데 응답으로 session_id = 7과 8이 섞여 도착했을 때, 자신의 요청에 대한 응답을 골라내는 기준은 무엇인가?"
      choices: ["자신이 보낸 client_id와 session_id의 조합과 일치하는 응답만 자신의 것으로 간주한다", "먼저 도착한 응답을 항상 자신의 요청에 대한 응답으로 간주하고 그 뒤에 도착하는 모든 응답은 전부 무시해 버린다", "반환 코드가 E_OK인 응답만 자신의 요청으로 간주한다", "메시지 길이가 가장 짧은 응답을 고른다"]
      answer: 0
      explanation: "클라이언트는 자신이 보낸 Request ID(client_id와 session_id의 조합)와 일치하는 응답만 자신의 요청에 대한 것으로 간주한다."

- topic: someip-sd
  title: "SOME/IP-SD와 전송 계층 선택"
  section: 정리
  variants:
    - question: "SOME/IP-SD에서 클라이언트가 필요한 서비스를 아무도 제공하지 않을 때 보내는 메시지와 그 역할로 옳은 것은?"
      choices: ["Offer Service를 멀티캐스트로 반복해서 보내 자신이 그 서비스를 제공하고 있다고 지속적으로 알린다", "Find Service를 멀티캐스트로 보내 해당 서비스를 제공하는 서버가 있는지 찾는다", "Subscribe Eventgroup을 보내 이벤트 구독을 신청한다", "RequestDownload를 보내 재프로그래밍을 요청한다"]
      answer: 1
      explanation: "클라이언트는 필요한 서비스를 아직 아무도 제공하지 않을 때 Find Service 메시지를 멀티캐스트로 보내 서버를 찾는다."
    - question: "SOME/IP가 이벤트처럼 반복되는 지연 민감 데이터에 UDP를, 소프트웨어 업데이트 전송처럼 손실이 용납되지 않는 데이터에 TCP를 선택하는 이유로 가장 적절한 것은?"
      choices: ["UDP는 오버헤드가 작아 반복 전송에 적합하고 TCP는 순서 보장과 재전송으로 손실 없는 전달을 보장한다", "UDP는 반드시 서비스 디스커버리 전용으로만 쓰이고 TCP는 이벤트 전송 전용으로만 쓰이도록 고정되어 있다", "TCP는 서비스 디스커버리 전용 프로토콜이라 이벤트에는 쓸 수 없다", "UDP는 헤더에 서비스 ID를 담을 수 없다"]
      answer: 0
      explanation: "UDP는 가볍고 반복 전송에 적합하며, TCP는 순서 보장과 재전송을 통해 손실 없는 전달을 보장하므로 상황에 맞게 선택해 쓴다."
