<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="SOME/IP-SD의 Offer Service와 Find Service 흐름">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">SOME/IP-SD: 서비스를 찾는 과정</text>

  <rect x="80" y="55" width="180" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="170" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">클라이언트</text>
  <rect x="460" y="55" width="180" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="550" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">서버</text>

  <line x1="170" y1="105" x2="170" y2="340" stroke="#3a4d72" stroke-width="1.5"/>
  <line x1="550" y1="105" x2="550" y2="340" stroke="#3a4d72" stroke-width="1.5"/>

  <line x1="550" y1="140" x2="170" y2="140" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Offer Service (멀티캐스트, 주기적)</text>

  <line x1="170" y1="200" x2="550" y2="200" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="193" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Find Service (서비스 ID 질의)</text>

  <line x1="550" y1="260" x2="170" y2="260" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="253" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Offer Service (IP·포트 포함 응답)</text>

  <line x1="170" y1="320" x2="550" y2="320" stroke="#b794f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="313" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">RPC 호출 / 이벤트 구독 시작</text>
</svg>
