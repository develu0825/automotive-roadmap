<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="SOME/IP의 세 가지 통신 패턴: RPC, 이벤트, 필드">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">SOME/IP의 세 가지 통신 패턴</text>

  <text x="110" y="70" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">RPC</text>
  <rect x="40" y="80" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="115" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">클라이언트</text>
  <rect x="530" y="80" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="605" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">서버</text>
  <line x1="190" y1="95" x2="530" y2="95" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Request (호출)</text>
  <line x1="530" y1="118" x2="190" y2="118" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="137" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Response (응답)</text>

  <text x="110" y="200" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">이벤트</text>
  <rect x="40" y="210" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="115" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">구독자</text>
  <rect x="530" y="210" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="605" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">서버</text>
  <line x1="530" y1="235" x2="190" y2="235" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="227" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Event (구독 기반 통지)</text>

  <text x="110" y="330" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">필드</text>
  <rect x="40" y="340" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="115" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">클라이언트</text>
  <rect x="530" y="340" width="150" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="605" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">서버 (상태값)</text>
  <line x1="190" y1="358" x2="530" y2="358" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="351" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Get / Set</text>
  <line x1="530" y1="378" x2="190" y2="378" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="400" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Notify (변경 통지)</text>
</svg>
