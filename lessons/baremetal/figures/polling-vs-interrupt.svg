<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="폴링과 인터럽트 방식에서 CPU가 이벤트를 기다리는 방식 비교">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">폴링과 인터럽트: CPU가 이벤트를 기다리는 두 방식</text>

  <text x="190" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">폴링 (Polling)</text>
  <path d="M140,75 C140,58 240,58 240,75" fill="none" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="80" y="75" width="220" height="90" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="190" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">CPU: 플래그 반복 확인</text>
  <text x="190" y="134" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(다른 작업 불가: busy-wait)</text>

  <text x="520" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">인터럽트 (Interrupt)</text>
  <rect x="410" y="75" width="220" height="90" rx="6" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="520" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">CPU: 다른 작업 수행</text>
  <text x="520" y="134" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(이벤트 시에만 ISR 실행)</text>

  <line x1="500" y1="165" x2="500" y2="195" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="195" x2="540" y2="165" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="410" y="195" width="220" height="45" rx="6" fill="#111a2e" stroke="#b794f6" stroke-width="1.5"/>
  <text x="520" y="222" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">ISR 실행 (짧게 실행 후 복귀)</text>

  <text x="360" y="262" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">폴링은 CPU를 묶어 두고, 인터럽트는 이벤트가 날 때만 ISR을 실행한다</text>
</svg>
