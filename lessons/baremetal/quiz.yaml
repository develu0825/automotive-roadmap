- topic: reset-vector
  title: 리셋 벡터와 스타트업 코드
  section: 정리
  variants:
    - question: "main 함수가 호출되기 전에 스타트업 코드가 반드시 수행해야 하는 작업으로 가장 적절한 것은 무엇인가?"
      choices: [".data 영역을 플래시에서 RAM으로 복사하고 .bss 영역을 0으로 채운다", "시스템에 등록된 모든 인터럽트를 영구적으로 완전히 비활성화시켜서 다시는 켜질 수 없게 만들어 버린다", "플래시 메모리의 내용을 전부 지우고 새 프로그램을 기다린다", "CPU의 클럭 속도를 사용자가 입력할 때까지 무한정 대기시킨다"]
      answer: 0
      explanation: "스타트업 코드는 main 호출 전에 .data를 RAM으로 복사하고 .bss를 0으로 채워 전역 변수가 올바른 초기값을 갖게 한다."
    - question: "스타트업 코드가 .bss 초기화를 건너뛰고 곧바로 main을 호출했을 때 생기는 문제로 가장 적절한 것은 무엇인가?"
      choices: ["컴파일러가 즉시 빌드를 거부해서 펌웨어가 아예 생성되지 않는다", "스택 포인터가 자동으로 0번지로 재설정되어 리셋이 반복된다", "플래시 메모리에 저장되어 있던 프로그램 코드 자체가 실행되는 도중에 영구적으로 완전히 지워져 버린다", "0으로 시작해야 할 전역 변수가 쓰레기 값으로 시작해 간헐적인 오동작을 일으킬 수 있다"]
      answer: 3
      explanation: ".bss를 지우지 않으면 0으로 초기화되어야 할 전역 변수가 이전 값이나 임의값을 가진 채 시작해 재현하기 어려운 오동작을 낳는다."

- topic: mmio-volatile
  title: MMIO와 volatile
  section: 정리
  variants:
    - question: "하드웨어 레지스터를 가리키는 포인터에 volatile을 붙이지 않았을 때 생길 수 있는 문제로 가장 적절한 것은 무엇인가?"
      choices: ["포인터의 자료형이 자동으로 정수형에서 문자형으로 바뀌어 버린다", "링커가 해당 변수를 찾지 못해 빌드 자체가 실패한다", "그 레지스터의 물리적 주소 자체가 프로그램을 실행할 때마다 완전히 무작위로 다른 번지로 바뀌어 버린다", "컴파일러가 값이 안 변한다고 가정해 읽기를 캐시해 버려 하드웨어의 실제 변화를 놓칠 수 있다"]
      answer: 3
      explanation: "volatile이 없으면 컴파일러가 레지스터 값이 변하지 않는다고 가정해 읽기를 생략할 수 있어, 하드웨어의 실제 변화를 놓칠 수 있다."
    - question: "GPIO 핀을 켜고 끄는 코드에서 BSRR처럼 특정 비트에 쓰기만 하면 되는 레지스터를 쓰는 이유로 가장 적절한 것은 무엇인가?"
      choices: ["BSRR 레지스터는 전원이 꺼진 상태에서도 값을 읽을 수 있기 때문이다", "이 레지스터를 쓰면 컴파일러가 코드를 자동으로 어셈블리로 변환해 주기 때문이다", "BSRR 레지스터를 쓰지 않으면 모든 GPIO 핀이 영구적으로 입력 모드로만 고정되어 다시는 출력으로 바뀌지 않기 때문이다", "읽기-수정-쓰기 없이 한 번의 쓰기만으로 원하는 핀만 안전하게 설정할 수 있기 때문이다"]
      answer: 3
      explanation: "BSRR 같은 전용 레지스터는 쓰기 한 번으로 원하는 핀만 안전하게 설정해, 읽기-수정-쓰기 과정에서 생길 수 있는 충돌을 피한다."

- topic: polling-interrupt
  title: 폴링과 인터럽트
  section: 정리
  variants:
    - question: "폴링 방식으로 UART 송신 완료를 기다리는 코드의 가장 큰 단점으로 가장 적절한 것은 무엇인가?"
      choices: ["폴링은 반드시 두 개 이상의 CPU 코어가 있어야만 동작한다", "폴링 방식은 UART 하드웨어를 영구적으로 손상시킨다", "폴링 방식을 쓰면 컴파일러가 해당 함수뿐 아니라 프로그램 전체의 최적화를 영구적으로 비활성화해 버린다", "조건이 만족될 때까지 CPU가 다른 일을 전혀 못 하고 그 자리에 묶여 있는다"]
      answer: 3
      explanation: "폴링은 원하는 조건이 될 때까지 CPU를 그 자리에 묶어 두어(busy-wait), 그동안 다른 작업을 전혀 처리하지 못하게 한다."
    - question: "UART 송신을 인터럽트 방식으로 바꾸었을 때 얻는 이점으로 가장 적절한 것은 무엇인가?"
      choices: ["전송 속도 자체가 하드웨어적으로 두 배 빨라진다", "인터럽트를 쓰면 더 이상 ISR을 짧게 작성할 필요가 없어진다", "인터럽트 방식은 워치독 타이머의 기능을 완전히 대체해서 안전장치 역할까지 전부 혼자서 도맡아 처리한다", "전송을 걸어두고 즉시 반환해 CPU가 그 사이에 다른 작업을 계속할 수 있다"]
      answer: 3
      explanation: "인터럽트 방식은 전송을 시작시켜 두고 즉시 반환되므로, 전송이 끝날 때까지 CPU가 다른 작업을 자유롭게 할 수 있다."
