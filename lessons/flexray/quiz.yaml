- topic: priority-inversion
  title: "우선순위 역전과 CAN FD의 한계"
  section: 정리
  variants:
    - question: "CAN 버스에서 우선순위 역전이 발생하는 상황으로 가장 적절한 것은?"
      choices: ["ID가 동일한 경우", "ID가 낮은 메시지들이 반복돼 ID가 높은 메시지 전송이 한없이 밀리는 경우", "버스에 노드가 단 하나만 연결되어 있어서 서로 충돌할 다른 노드 자체가 존재하지 않는 경우", "CRC 계산이 틀려서 메시지가 폐기되는 경우"]
      answer: 1
      explanation: "ID가 낮은 메시지가 계속 쏟아지면 ID가 조금 높은 메시지는 전송 시점을 보장받지 못하는 우선순위 역전이 생긴다."
    - question: "CAN FD가 비트레이트를 전환하는 방식에 대한 설명으로 옳은 것은?"
      choices: ["프레임 전체를 처음부터 끝까지 동일하게 빠른 속도로 보낸다", "중재가 끝난 데이터 구간에서만 선택적으로 더 빠른 속도로 전환한다", "ID 중재 구간에서 속도를 먼저 두 배로 올린 뒤 데이터 구간에서 다시 낮춘다", "속도 전환이 전혀 일어나지 않는다"]
      answer: 1
      explanation: "경쟁이 필요한 중재 구간은 느린 속도를 유지하고, 경쟁이 끝난 데이터 구간만 더 빠른 속도로 전환한다."
- topic: tdma-static-segment
  title: "FlexRay TDMA와 정적 세그먼트"
  section: 정리
  variants:
    - question: "FlexRay의 정적 세그먼트가 설계 시점에 고정된 결정론을 제공하는 원리로 가장 적절한 것은?"
      choices: ["모든 노드가 매 사이클마다 ID 비교를 통해 그때그때 다시 우선순위를 다투어 전송 순서를 결정하기 때문이다", "각 타임 슬롯이 특정 노드에 미리 배정되어 버스 혼잡과 무관하게 전송 시점이 확정되기 때문이다", "슬롯 배정이 매 사이클마다 무작위로 바뀌기 때문이다", "노드 수가 적기 때문이다"]
      answer: 1
      explanation: "타임 슬롯이 설계 시점에 특정 노드로 고정 배정되어 매 사이클의 전송 시점이 항상 동일하게 확정된다."
    - question: "한 사이클 길이가 4ms이고 정적 세그먼트에 슬롯 80개가 균등 배정되어 있을 때, 슬롯 번호 20번을 배정받은 노드의 전송 시작 시점으로 옳은 것은?"
      choices: ["사이클 시작 후 1000µs 지점", "사이클 시작 후 950µs 지점", "버스의 혼잡도에 따라 매번 달라지는 임의의 시점", "0µs"]
      answer: 1
      explanation: "슬롯 길이는 4ms/80=50µs이고 앞선 19개 슬롯이 지난 뒤이므로 19*50µs=950µs 지점부터 전송된다."
- topic: dual-channel-sync
  title: "이중 채널과 클럭 동기화"
  section: 정리
  variants:
    - question: "FlexRay가 이중 채널(채널 A, 채널 B)을 두는 핵심 목적으로 가장 적절한 것은?"
      choices: ["두 채널이 완전히 동일한 속도로만 동작해야 하기 때문이다", "한쪽 채널의 배선이 손상되어도 다른 채널로 통신을 이어갈 수 있는 내고장성을 확보하기 위해서다", "채널을 두 개로 늘리기만 하면 슬롯 배정이나 클럭 동기화 같은 설계 작업이 전부 필요 없어지기 때문이다", "전력 소모를 줄이기 위해서다"]
      answer: 1
      explanation: "물리적으로 독립된 두 채널을 두면 한쪽 배선이 손상되어도 나머지 채널로 통신이 계속될 수 있다."
    - question: "FlexRay의 결함 허용 중간값 알고리즘이 클럭 동기화에서 하는 역할로 옳은 것은?"
      choices: ["가장 벗어난 오차값을 잘라내고 남은 값들의 중간점을 보정값으로 쓴다", "모든 노드의 오차 측정값을 단순 평균하여 그대로 보정값으로 사용하는 방식을 쓴다", "동기화 노드를 하나만 남기고 나머지 노드의 측정값은 전부 무시한다", "보정하지 않는다"]
      answer: 0
      explanation: "극단적으로 벗어난 측정값을 잘라내고 남은 값의 중간점을 쓰므로 한 노드의 고장이 전체 시간 기준을 왜곡하지 못한다."
