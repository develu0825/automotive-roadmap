<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="FlexRay 사이클의 정적 세그먼트와 동적 세그먼트">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">FlexRay 사이클: 정적 세그먼트 + 동적 세그먼트</text>

  <rect x="60" y="90" width="360" height="60" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <rect x="420" y="90" width="240" height="60" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>

  <line x1="120" y1="90" x2="120" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="180" y1="90" x2="180" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="240" y1="90" x2="240" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="300" y1="90" x2="300" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="360" y1="90" x2="360" y2="150" stroke="#3a4d72" stroke-width="1"/>

  <line x1="450" y1="90" x2="450" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="480" y1="90" x2="480" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="510" y1="90" x2="510" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="540" y1="90" x2="540" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="570" y1="90" x2="570" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="600" y1="90" x2="600" y2="150" stroke="#3a4d72" stroke-width="1"/>
  <line x1="630" y1="90" x2="630" y2="150" stroke="#3a4d72" stroke-width="1"/>

  <rect x="240" y="90" width="60" height="60" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

  <text x="240" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">정적 세그먼트</text>
  <text x="240" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">고정 슬롯 배정</text>

  <text x="540" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">동적 세그먼트</text>
  <text x="540" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">미니슬롯</text>

  <line x1="270" y1="178" x2="270" y2="152" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="195" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="middle">조향 액추에이터 전용 슬롯</text>

  <text x="360" y="218" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">한 사이클 (예: 5 ms, 정적+동적 세그먼트)</text>
</svg>
