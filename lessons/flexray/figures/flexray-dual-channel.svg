<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="FlexRay 이중 채널 구조와 단선 고장 허용">
  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">FlexRay 이중 채널 구조 (내고장성)</text>

  <rect x="140" y="15" width="140" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="210" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">조향 센서 노드</text>

  <rect x="440" y="15" width="140" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="510" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">조향 액추에이터 노드</text>

  <line x1="80" y1="80" x2="340" y2="80" stroke="#8aa0c6" stroke-width="3"/>
  <line x1="360" y1="80" x2="640" y2="80" stroke="#8aa0c6" stroke-width="3"/>
  <line x1="340" y1="70" x2="360" y2="90" stroke="#f59e0b" stroke-width="3"/>
  <line x1="360" y1="70" x2="340" y2="90" stroke="#f59e0b" stroke-width="3"/>
  <text x="60" y="83" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">채널 A</text>
  <text x="350" y="105" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="middle">채널 A 단선</text>

  <line x1="80" y1="160" x2="640" y2="160" stroke="#38bdf8" stroke-width="3"/>
  <text x="60" y="163" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">채널 B</text>
  <text x="350" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">채널 B로 통신 계속</text>

  <line x1="210" y1="65" x2="210" y2="160" stroke="#8aa0c6" stroke-width="2"/>
  <line x1="510" y1="65" x2="510" y2="160" stroke="#8aa0c6" stroke-width="2"/>
</svg>
