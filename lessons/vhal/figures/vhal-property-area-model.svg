<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="VehicleProperty의 ID와 area 구성">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">VehicleProperty = ID + area</text>

  <rect x="260" y="50" width="200" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">HVAC_TEMPERATURE_SET</text>
  <text x="360" y="97" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(프로퍼티 ID)</text>

  <line x1="310" y1="110" x2="170" y2="170" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="110" x2="550" y2="170" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="170" width="220" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="170" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">area: DRIVER_SEAT</text>
  <text x="170" y="217" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">24.0 C</text>

  <rect x="440" y="170" width="220" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="550" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">area: PASSENGER_SEAT</text>
  <text x="550" y="217" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">22.0 C</text>
</svg>
