<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-label="VHAL과 프레임워크, 차량 네트워크 사이의 통신 구조">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>
  <text x="360" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">VHAL: 프레임워크와 차량 네트워크 사이</text>

  <rect x="210" y="50" width="300" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">CarService / 프레임워크</text>

  <line x1="360" y1="110" x2="360" y2="160" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="240" y1="160" x2="240" y2="110" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="480" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">get / set 요청</text>
  <text x="140" y="130" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">subscribe 이벤트</text>

  <rect x="210" y="160" width="300" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">VHAL</text>
  <text x="360" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(VehicleProperty 저장소)</text>

  <line x1="360" y1="220" x2="360" y2="270" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="240" y1="270" x2="240" y2="220" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="480" y="245" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">set → CAN 인코딩</text>
  <text x="140" y="245" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">CAN 수신 → 이벤트</text>

  <rect x="210" y="270" width="300" height="60" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="360" y="298" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">CAN 버스</text>
  <text x="360" y="318" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">(차량 네트워크)</text>
</svg>
