<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="U-Boot에서 커널로의 제어권 전달">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/></marker></defs>
  <text x="360" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">U-Boot에서 커널로의 제어권 전달</text>

  <rect x="40" y="90" width="220" height="70" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="150" y="119" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">U-Boot</text>
  <text x="150" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">booti 명령 실행</text>

  <rect x="460" y="90" width="220" height="70" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="570" y="119" fill="#cbd5e1" font-family="sans-serif" font-size="16" text-anchor="middle">Linux 커널</text>
  <text x="570" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">x0 레지스터 확인</text>

  <line x1="260" y1="125" x2="460" y2="125" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="108" fill="#f59e0b" font-family="sans-serif" font-size="15" text-anchor="middle">bootargs 전달</text>
  <text x="360" y="150" fill="#38bdf8" font-family="sans-serif" font-size="15" text-anchor="middle">디바이스 트리 주소 → x0</text>
</svg>
