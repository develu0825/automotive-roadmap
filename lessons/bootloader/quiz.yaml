- topic: boot-stages
  title: "부트 단계"
  section: 정리
  variants:
    - question: "부트 과정이 BootROM, SPL, U-Boot 본체처럼 여러 단계로 나뉘어 있는 이유로 가장 적절한 것은?"
      choices:
        - "작은 내부 메모리만 쓸 수 있는 상태에서 점점 더 많은 자원을 확보하며 단계적으로 실행해야 하기 때문이다"
        - "커널과 부트로더 개발자들이 서로 다른 회사와 팀 조직 구조에 맞춰 코드를 억지로 나눠 작성하게 만들기 위한 정책이다"
        - "보안을 위해 일부러 부팅 속도를 늦추기 위한 설계다"
        - "각 단계마다 다른 프로그래밍 언어를 사용해야 하기 때문이다"
      answer: 0
      explanation: "전원 인가 직후에는 아주 작은 내부 메모리만 쓸 수 있어, 점점 더 많은 자원을 확보해 가며 단계적으로 큰 코드를 실행해야 한다."
    - question: "SPL의 핵심 임무로 옳은 것은?"
      choices:
        - "DRAM 컨트롤러를 초기화해 큰 메모리 공간을 쓸 수 있게 만드는 것이다"
        - "사람이 직접 명령을 입력할 수 있는 셀 콘솔과 네트워크 드라이버까지 전부 제공하는 것이다"
        - "커널의 디바이스 드라이버를 전부 로드하는 것이다"
        - "차량의 CAN 통신 프로토콜을 해석하는 것이다"
      answer: 0
      explanation: "SPL의 가장 중요한 임무는 DRAM 컨트롤러를 초기화해 이후 단계가 큰 메모리 공간을 쓸 수 있게 만드는 것이다."
- topic: uboot-role
  title: "U-Boot의 역할"
  section: 정리
  variants:
    - question: "U-Boot의 bootcmd 환경 변수가 하는 역할로 가장 적절한 것은?"
      choices:
        - "어떤 매체에서 커널과 디바이스 트리를 읽어와 실행할지를 정의해 자동 부팅을 수행한다"
        - "DRAM 컨트롤러의 세부 타이밍 파라미터와 리프레시 주기를 하드웨어 칩 설계 단계에서부터 미리 계산해서 수정한다"
        - "커널 소스 코드를 다시 컴파일한다"
        - "보드의 전원 레일 순서를 결정한다"
      answer: 0
      explanation: "bootcmd는 어떤 매체에서 커널과 디바이스 트리를 읽어와 어떤 인자로 실행할지를 정의해 자동 부팅 절차를 수행한다."
    - question: "U-Boot가 booti 명령으로 커널에게 제어권을 넘길 때 함께 전달하는 정보를 고른 것은?"
      choices:
        - "부트 인자(bootargs) 문자열과 디바이스 트리 이미지의 메모리 주소"
        - "소스 코드의 주석과 변수 이름 목록"
        - "보드의 가격표와 제조사 연락처 정보"
        - "커널 개발자의 깃허브 계정 정보와 과거 모든 커밋 로그, 버그 리포트 목록 전체"
      answer: 0
      explanation: "U-Boot는 콘솔·루트 파일시스템 설정이 담긴 bootargs와 디바이스 트리 주소를 함께 전달해야 커널이 자신을 올바르게 초기화할 수 있다."
- topic: ab-fallback-boot
  title: "A/B 부트와 fallback"
  section: 정리
  variants:
    - question: "A/B 부트 파티션과 fallback 부팅 메커니즘의 목적으로 가장 적절한 것은?"
      choices:
        - "OTA 업데이트 실패로 차량이 영원히 부팅하지 못하는 상황을 막기 위한 것이다"
        - "부팅 속도를 두 배로 빠르게 만들기 위한 것이다"
        - "두 개의 서로 다른 커널 이미지를 항상 동시에 메모리에 올려 병렬로 실행하기 위한 것이다"
        - "디스크 용량을 두 배로 늘리기 위한 설계다"
      answer: 0
      explanation: "A/B 슬롯과 fallback 부팅은 OTA 업데이트 실패로 차량이 영원히 부팅하지 못하는 brick 상황을 막기 위한 안전장치다."
    - question: "새 슬롯으로 부팅을 시도했는데 커널이 정상 신호를 보내기 전에 재부팅이 반복될 때 U-Boot가 취하는 조치로 옳은 것은?"
      choices:
        - "그 슬롯에 결함이 있다고 판단해 이전의 정상 슬롯으로 되돌아가 부팅한다"
        - "DRAM 용량을 절반으로 줄여서 재시도한다"
        - "보드의 전원을 영구적으로 차단한다"
        - "오류를 완전히 무시한 채로 같은 결함이 있는 슬롯으로만 영원히 반복해서 부팅을 계속 시도한다"
      answer: 0
      explanation: "U-Boot는 연속된 부팅 실패를 감지하면 결함 슬롯으로 판단하고 이전의 정상 슬롯으로 되돌아가는 fallback 동작을 수행한다."
