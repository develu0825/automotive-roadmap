<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="gPTP 네 타임스탬프로 시계 오프셋과 전파 지연 계산">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0c6"/>
    </marker>
  </defs>

  <text x="360" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">gPTP: 4개의 타임스탬프로 오프셋과 지연 계산</text>

  <rect x="80" y="50" width="160" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="160" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">마스터 (그랜드마스터)</text>

  <rect x="480" y="50" width="160" height="50" rx="8" fill="#111a2e" stroke="#3a4d72" stroke-width="1.5"/>
  <text x="560" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">슬레이브</text>

  <line x1="160" y1="100" x2="160" y2="215" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="560" y1="100" x2="560" y2="215" stroke="#3a4d72" stroke-width="1.5" stroke-dasharray="5,5"/>

  <text x="360" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Sync (t1 → t2)</text>
  <line x1="160" y1="130" x2="560" y2="130" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="135" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">t1</text>
  <text x="585" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">t2</text>

  <text x="360" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">Delay_Req/Resp (t3 → t4)</text>
  <line x1="560" y1="190" x2="160" y2="190" stroke="#8aa0c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="585" y="193" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">t3</text>
  <text x="135" y="193" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="end">t4</text>

  <text x="360" y="238" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">offset = ((t2−t1) − (t4−t3)) / 2</text>
  <text x="360" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="middle">delay = ((t2−t1) + (t4−t3)) / 2</text>
</svg>
