- topic: gptp-sync
  title: "gPTP 시간 동기화"
  section: 정리
  variants:
    - question: "gPTP가 네 개의 타임스탬프로 계산하는 두 값으로 옳은 것은?"
      choices: ["프레임 크기와 CRC", "시계 오차(offset)와 전파 지연(delay)", "트래픽 클래스 번호와 게이트 개폐 시각표 전체를 모두 포함하는 값", "전압"]
      answer: 1
      explanation: "gPTP는 네 타임스탬프로부터 마스터와 슬레이브 사이의 시계 오차(offset)와 전파 지연(delay)을 동시에 추정한다."
    - question: "마스터와 슬레이브 사이에서 t2-t1=600ns, t4-t3=400ns로 측정되었을 때 offset과 delay로 옳은 것은?"
      choices: ["offset 500ns, delay 100ns", "offset 100ns, delay 500ns", "offset 1000ns, delay 200ns로 계산되어 두 값이 서로 반비례하는 관계를 보인다", "offset과 delay가 모두 0ns다"]
      answer: 1
      explanation: "offset=(600-400)/2=100ns, delay=(600+400)/2=500ns로 계산된다."
- topic: scheduled-traffic-tas
  title: "스케줄드 트래픽과 타임 어웨어 셰이퍼"
  section: 정리
  variants:
    - question: "IEEE 802.1Qbv 스케줄드 트래픽이 결정론적 전송을 만드는 방식으로 가장 적절한 것은?"
      choices: ["모든 트래픽을 섞어서 무작위 순서로 내보낸다", "트래픽 클래스별 대기열 게이트를 미리 정한 시간표에 따라 열고 닫아 특정 구간을 특정 트래픽에 고정 배정한다", "프레임의 CRC 비트 수를 데이터 길이에 따라 항상 17비트나 21비트까지 더 길게 늘려서 오류 검출 확률을 높이는 방식을 쓴다", "속도를 높인다"]
      answer: 1
      explanation: "게이트를 미리 정한 시간표대로 열고 닫아 특정 시간 구간을 특정 트래픽 클래스에 고정 배정한다."
    - question: "TSN의 스케줄드 트래픽과 FlexRay의 정적 세그먼트가 공유하는 발상으로 옳은 것은?"
      choices: ["둘 다 중앙 관리자 없이 메시지 ID만으로 그때그때 우선순위를 다투어 전송 순서를 정한다", "시간 구간을 특정 트래픽이나 노드에 미리 고정 배정해 둔다", "둘 다 전선을 한 가닥만 사용해 배선을 최소화한다", "둘 다 암호화를 전제로 한다"]
      answer: 1
      explanation: "둘 다 시간 구간을 설계 시점에 특정 트래픽이나 노드에 미리 고정 배정해 결정론을 확보한다."
- topic: frame-preemption
  title: "프레임 선점"
  section: 정리
  variants:
    - question: "IEEE 802.1Qbu 프레임 선점이 해결하는 문제로 가장 적절한 것은?"
      choices: ["모든 프레임의 CRC가 틀려지는 문제다", "게이트가 닫히기 직전 시작된 긴 일반 프레임 때문에 긴급한 프레임이 오래 기다려야 하는 상황이다", "네트워크 전체의 시계가 서로 완전히 다른 기준을 쓰게 되어 모든 타임스탬프와 스케줄 시각표가 전부 무의미해지는 문제다", "전력 소모 문제다"]
      answer: 1
      explanation: "긴 일반 프레임 전송 중이라도 급행 프레임이 끼어들 수 있게 해 긴급 프레임이 오래 기다리는 문제를 줄인다."
    - question: "프레임 선점에서 전송 중단과 재개가 임의의 비트가 아니라 mPacket이라는 고정된 단위로만 이뤄지는 이유로 가장 적절한 것은?"
      choices: ["그렇게 해야 전송 속도가 두 배로 빨라지기 때문이다", "수신 측이 정상 종료된 프레임과 중단된 프레임을 구분할 근거를 가질 수 있도록 하기 위해서다", "모든 이더넷 케이블의 물리적 길이와 커넥터 규격, 심지어 색깔까지도 전부 동일하게 맞추기 위해서다", "비용을 줄이기 위해서다"]
      answer: 1
      explanation: "정해진 단위마다 경계를 두어야 수신 측이 중단된 프레임과 정상 종료된 프레임을 구분할 수 있다."
